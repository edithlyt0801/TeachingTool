      +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/></svg>'
      + '</div>'
      + '<span>' + PHYLAB_esc(name) + '</span>'
      + '</div>';
  },
  /* 米尺：0 cm 在像素 60，每 cm = 4 px，故 150 cm = 像素 660 */
  cmToPx: function (cm) { return 60 + cm * 4; },

  render: function () {
    PHYLAB_$("phylabLabLeft").innerHTML = ''
      + '<div class="phylab-lab-panel-title">儀器與材料</div>'
      + this.equipItem("光具座") + this.equipItem("凸透鏡") + this.equipItem("屏幕")
      + this.equipItem("光源") + this.equipItem("米尺");

    PHYLAB_$("phylabLabCenter").innerHTML = '<div class="phylab-workspace">'
      + '<svg id="phylabLensSVG" viewBox="0 0 700 420" preserveAspectRatio="xMidYMid meet"></svg>'
      + '</div>';

    PHYLAB_$("phylabLabRight").innerHTML = ''
      + '<div class="phylab-lab-panel-title">操作面板</div>'
      + '<div class="phylab-control">'
      +   '<div class="phylab-control-label"><span>透鏡位置</span><span id="phylabLensPosVal">40 cm</span></div>'
      +   '<input type="range" class="phylab-slider" id="phylabLensPos" min="20" max="80" step="1" value="40">'
      + '</div>'
      + '<div class="phylab-control">'
      +   '<div class="phylab-control-label"><span>屏幕位置</span><span id="phylabScreenPosVal">100 cm</span></div>'
      +   '<input type="range" class="phylab-slider" id="phylabScreenPos" min="25" max="150" step="1" value="100">'
      + '</div>'
      + '<div class="phylab-readout">'
      +   '<div class="phylab-readout-label">物距 u（物體在 0 cm）</div>'
      +   '<div class="phylab-readout-value" id="phylabLensU">40<span class="phylab-readout-unit">cm</span></div>'
      + '</div>'
      + '<div class="phylab-readout">'
      +   '<div class="phylab-readout-label">像距 v</div>'
      +   '<div class="phylab-readout-value" id="phylabLensV">60<span class="phylab-readout-unit">cm</span></div>'
      + '</div>'
      + '<div class="phylab-readout" style="border-color:#f59e0b;">'
      +   '<div class="phylab-readout-label">清晰度</div>'
      +   '<div class="phylab-readout-value" id="phylabLensSharp" style="color:#fbbf24;">--</div>'
      + '</div>'
      + '<button class="phylab-btn success" id="phylabLensRecord" type="button" style="margin-top:12px;"><span>記錄數據</span></button>'
      + '<div class="phylab-lab-panel-title" style="margin-top:16px;">數據記錄</div>'
      + '<div id="phylabLensData"></div>';

    PHYLAB_$("phylabStepText").textContent = "步驟 1：調整透鏡與屏幕位置，讓成像清晰";
    this.renderSVG();
    this.renderData();
    this.bindControls();
  },

  renderSVG: function () {
    var svg = PHYLAB_$("phylabLensSVG");
    if (!svg) { return; }
    var s = this.state;
    var objCm = this.OBJ_POS;
    var lensCm = s.lensPosition;
    var screenCm = s.screenPosition;
    var f = s.focalLength;

    var u = lensCm - objCm;
    var v = screenCm - lensCm;
    var predictedV = (u > f) ? (u * f) / (u - f) : -1;
    var sharp;
    if (predictedV < 0 || v <= 0) { sharp = 0; }
    else { sharp = Math.max(0, 100 - Math.abs(v - predictedV) * 20); }

    var objPx = this.cmToPx(objCm);
    var lensPx = this.cmToPx(lensCm);
    var screenPx = this.cmToPx(screenCm);
    var axisY = 220;
    var fPx = f * 4;

    /* ===== 米尺：0 cm 就是起點，尺條從像素 60 開始 ===== */
    var rulerStartPx = 60;
    var rulerEndPx = this.cmToPx(150); /* 660 */
    var rulerBar = '<rect x="' + rulerStartPx + '" y="' + (axisY + 60) + '" width="' + (rulerEndPx - rulerStartPx) + '" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>';
    var rulerTicks = '';
    /* 每 1 cm 一個小格，每 5 cm 一個大格並標數字 */
    for (var c = 0; c <= 150; c++) {
      var x = this.cmToPx(c);
      var isMajor = (c % 10 === 0);
      var isMid = (c % 5 === 0);
      var tickH = isMajor ? 14 : (isMid ? 10 : 5);
      rulerTicks += '<line x1="' + x + '" y1="' + (axisY + 60) + '" x2="' + x + '" y2="' + (axisY + 60 + tickH) + '" stroke="' + (isMajor ? '#cbd5e1' : '#64748b') + '" stroke-width="' + (isMajor ? 1.5 : 1) + '"/>';
      if (isMajor) {
        rulerTicks += '<text x="' + x + '" y="' + (axisY + 96) + '" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="monospace" font-weight="700">' + c + '</text>';
      }
    }
    /* 特別強調 0 標記 */
    var zeroMark = '<line x1="' + rulerStartPx + '" y1="' + (axisY + 55) + '" x2="' + rulerStartPx + '" y2="' + (axisY + 82) + '" stroke="#10b981" stroke-width="2"/>'
      + '<text x="' + rulerStartPx + '" y="' + (axisY + 96) + '" font-size="11" fill="#10b981" text-anchor="middle" font-family="monospace" font-weight="800">0</text>';

    /* ===== 光線（帶方向箭頭）===== */
    var rays = '';
    var arrowSize = 5;
    var objHeight = 50;
    var objTipY = axisY - objHeight;

    function arrow(x, y, dx, dy, color) {
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len < 1e-6) { return ''; }
      var ux = dx / len, uy = dy / len;
      var px = -uy, py = ux;
      var x1 = x - ux * arrowSize + px * arrowSize * 0.8;
      var y1 = y - uy * arrowSize + py * arrowSize * 0.8;
      var x2 = x + ux * arrowSize;
      var y2 = y + uy * arrowSize;
      var x3 = x - ux * arrowSize - px * arrowSize * 0.8;
      var y3 = y - uy * arrowSize - py * arrowSize * 0.8;
      return '<polygon points="' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' ' + x2.toFixed(1) + ',' + y2.toFixed(1) + ' ' + x3.toFixed(1) + ',' + y3.toFixed(1) + '" fill="' + color + '"/>';
    }

    if (u > f && v > 0) {
      /* 光線 1：平行於光軸，經透鏡後過右焦點 */
      var p1x1 = objPx, p1y1 = objTipY;
      var p1x2 = lensPx, p1y2 = objTipY;
      rays += '<line x1="' + p1x1 + '" y1="' + p1y1 + '" x2="' + p1x2 + '" y2="' + p1y2 + '" stroke="#fbbf24" stroke-width="1.8" opacity="0.85"/>';
      var mid1x = (p1x1 + p1x2) / 2;
      rays += arrow(mid1x, objTipY, 1, 0, '#fbbf24');

      /* 透鏡後：往右焦點方向，斜率 = (axisY - objTipY) / fPx */
      var slope1 = (axisY - objTipY) / fPx;
      var p2x1 = lensPx, p2y1 = objTipY;
      var p2x2 = lensPx + (screenPx - lensPx) + 40;
      var p2y2 = objTipY + slope1 * (p2x2 - lensPx);
      rays += '<line x1="' + p2x1 + '" y1="' + p2y1 + '" x2="' + p2x2 + '" y2="' + p2y2 + '" stroke="#fbbf24" stroke-width="1.8" opacity="0.85"/>';
      rays += arrow((p2x1 + p2x2) / 2, (p2y1 + p2y2) / 2, p2x2 - p2x1, p2y2 - p2y1, '#fbbf24');

      /* 光線 2：過光心，不偏折 */
      var slope2 = (axisY - objTipY) / (lensPx - objPx);
      var p3x1 = objPx, p3y1 = objTipY;
      var p3x2 = lensPx + (screenPx - lensPx) + 40;
      var p3y2 = objTipY + slope2 * (p3x2 - objPx);
      rays += '<line x1="' + p3x1 + '" y1="' + p3y1 + '" x2="' + p3x2 + '" y2="' + p3y2 + '" stroke="#fbbf24" stroke-width="1.8" opacity="0.85"/>';
      var m3x = objPx + (lensPx - objPx) * 0.65;
      var m3y = objTipY + slope2 * (m3x - objPx);
      rays += arrow(m3x, m3y, 1, slope2, '#fbbf24');
      var m3bx = lensPx + (p3x2 - lensPx) * 0.5;
      var m3by = objTipY + slope2 * (m3bx - objPx);
      rays += arrow(m3bx, m3by, 1, slope2, '#fbbf24');
    } else {
      /* 物距 ≤ 焦距：無實像，顯示發散光線 */
      rays += '<line x1="' + objPx + '" y1="' + objTipY + '" x2="' + lensPx + '" y2="' + objTipY + '" stroke="#fbbf24" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 3"/>';
      rays += '<line x1="' + objPx + '" y1="' + objTipY + '" x2="' + lensPx + '" y2="' + (axisY + 40) + '" stroke="#fbbf24" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 3"/>';
    }

    /* ===== 成像 ===== */
    var imageSvg = '';
    if (u > f && v > 0 && sharp > 20) {
      var imgHeight = 50 * (v / u);
      imageSvg = '<g transform="translate(' + screenPx + ',' + axisY + ')" opacity="' + (sharp / 100) + '">'
        + '<line x1="0" y1="0" x2="0" y2="' + imgHeight + '" stroke="#fbbf24" stroke-width="3"/>'
        + '<polygon points="-6,' + (imgHeight - 4) + ' 6,' + (imgHeight - 4) + ' 0,' + (imgHeight + 6) + '" fill="#fbbf24"/>'
        + '</g>';
    } else {
      imageSvg = '<ellipse cx="' + screenPx + '" cy="' + axisY + '" rx="30" ry="40" fill="rgba(251,191,36,' + (0.08 + sharp / 800) + ')"/>';
    }

    /* ===== 主光軸上的物體 ===== */
    var objArrow = '<g transform="translate(' + objPx + ',' + axisY + ')">'
      + '<line x1="0" y1="0" x2="0" y2="-50" stroke="#10b981" stroke-width="3"/>'
      + '<polygon points="-6,-46 6,-46 0,-56" fill="#10b981"/>'
      + '</g>';

    /* ===== 組合 SVG ===== */
    svg.innerHTML = ''
      + '<defs><pattern id="phylabLensGrid" width="40" height="40" patternUnits="userSpaceOnUse">'
      + '<path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99,102,241,0.05)" stroke-width="1"/></pattern></defs>'
      + '<rect width="700" height="420" fill="url(#phylabLensGrid)"/>'
      /* 光具座 */
      + '<rect x="20" y="' + (axisY + 55) + '" width="660" height="30" rx="5" fill="rgba(30,41,59,0.4)" stroke="#334155" stroke-width="1"/>'
      /* 米尺 */
      + rulerBar + rulerTicks + zeroMark
      /* 主光軸 */
      + '<line x1="40" y1="' + axisY + '" x2="680" y2="' + axisY + '" stroke="#334155" stroke-width="1" stroke-dasharray="6 4"/>'
      /* 光線 */
      + rays
      /* 物體 */
      + objArrow
      /* 透鏡 */
      + '<g transform="translate(' + lensPx + ',' + axisY + ')"><polygon points="0,-70 -22,0 0,70 22,0" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="2"/></g>'
      /* 屏幕 */
      + '<g transform="translate(' + screenPx + ',' + axisY + ')"><rect x="-3" y="-80" width="6" height="160" fill="#475569" rx="2"/></g>'
      /* 成像 */
      + imageSvg
      /* 標籤 */
      + '<text x="' + objPx + '" y="' + (axisY + 118) + '" font-size="10" fill="#10b981" text-anchor="middle" font-weight="700">OBJECT</text>'
      + '<text x="' + lensPx + '" y="' + (axisY + 118) + '" font-size="10" fill="#a5b4fc" text-anchor="middle" font-weight="700">LENS</text>'
      + '<text x="' + screenPx + '" y="' + (axisY + 118) + '" font-size="10" fill="#cbd5e1" text-anchor="middle" font-weight="700">SCREEN</text>'
      /* 資訊框 */
      + '<rect x="470" y="30" width="210" height="100" rx="8" fill="rgba(15,23,42,0.78)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>'
      + '<text x="485" y="52" font-size="10" fill="#64748b" font-family="monospace">u = ' + u.toFixed(0) + ' cm, v = ' + v.toFixed(0) + ' cm</text>'
      + '<text x="485" y="70" font-size="10" fill="#64748b" font-family="monospace">1/u + 1/v = 1/f</text>'
      + '<text x="485" y="88" font-size="10" fill="#64748b" font-family="monospace">f expected = ' + f.toFixed(1) + ' cm</text>'
      + '<text x="485" y="110" font-size="12" fill="' + (sharp > 90 ? '#10b981' : (sharp > 60 ? '#fbbf24' : '#ef4444')) + '" font-family="monospace" font-weight="700">Sharpness: ' + sharp.toFixed(0) + '%</text>';
  },

  updateReadouts: function () {
    var s = this.state;
    var u = s.lensPosition - this.OBJ_POS;
    var v = s.screenPosition - s.lensPosition;
    PHYLAB_$("phylabLensU").innerHTML = u + '<span class="phylab-readout-unit">cm</span>';
    PHYLAB_$("phylabLensV").innerHTML = v + '<span class="phylab-readout-unit">cm</span>';
    var predictedV = (u > s.focalLength) ? (u * s.focalLength) / (u - s.focalLength) : -1;
    var sharp = (predictedV > 0 && v > 0) ? Math.max(0, 100 - Math.abs(v - predictedV) * 20) : 0;
    var sEl = PHYLAB_$("phylabLensSharp");
    if (sEl) {
      sEl.textContent = sharp.toFixed(0) + "%";
      sEl.style.color = sharp > 90 ? "#10b981" : (sharp > 60 ? "#fbbf24" : "#ef4444");
    }
  },

  bindControls: function () {
    var self = this;
    var lensSlider = PHYLAB_$("phylabLensPos");
    if (lensSlider) {
      lensSlider.addEventListener("input", function () {
        self.state.lensPosition = parseInt(this.value, 10);
        PHYLAB_$("phylabLensPosVal").textContent = self.state.lensPosition + " cm";
        self.updateReadouts();
        self.renderSVG();
      });
    }
    var screenSlider = PHYLAB_$("phylabScreenPos");
    if (screenSlider) {
      screenSlider.addEventListener("input", function () {
        self.state.screenPosition = parseInt(this.value, 10);
        PHYLAB_$("phylabScreenPosVal").textContent = self.state.screenPosition + " cm";
        self.updateReadouts();
        self.renderSVG();
      });
    }
    var recBtn = PHYLAB_$("phylabLensRecord");
    if (recBtn) { recBtn.addEventListener("click", function () { self.record(); }); }
    this.updateReadouts();
  },

  record: function () {
    var s = this.state;
    var u = s.lensPosition - this.OBJ_POS;
    var v = s.screenPosition - s.lensPosition;
    var predictedV = (u > s.focalLength) ? (u * s.focalLength) / (u - s.focalLength) : -1;
    var sharp = (predictedV > 0 && v > 0) ? Math.max(0, 100 - Math.abs(v - predictedV) * 20) : 0;
    if (sharp < 60) { PHYLAB_toast("影像不夠清晰（至少 60%）。請調整屏幕位置。", "warn"); return; }
    if (u <= s.focalLength) { PHYLAB_toast("物距必須大於焦距，才可形成實像。", "warn"); return; }
    var fMeasured = (u * v) / (u + v);
    s.data.push({ u: u, v: v, f: fMeasured });
    this.renderData();
    PHYLAB_$("phylabStepText").textContent = "步驟 3：已記錄 " + s.data.length + " 組數據";
  },

  renderData: function () {
    var el = PHYLAB_$("phylabLensData");
    if (!el) { return; }
    var d = this.state.data;
    if (d.length === 0) {
      el.innerHTML = '<table class="phylab-data-table"><tr class="empty"><td>尚未記錄任何數據</td></tr></table>';
      return;
    }
    var html = '<table class="phylab-data-table"><thead><tr><th>u(cm)</th><th>v(cm)</th><th>f(cm)</th></tr></thead><tbody>';
    for (var i = 0; i < d.length; i++) {
      html += '<tr><td>' + d[i].u + '</td><td>' + d[i].v + '</td><td>' + d[i].f.toFixed(1) + '</td></tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  },

  score: function () {
    var d = this.state.data;
    if (d.length < 3) { return { error: "數據不足，請至少記錄 3 組數據" }; }
    var sum = 0;
    for (var i = 0; i < d.length; i++) { sum += d[i].f; }
    var fMeasured = sum / d.length;
    var expected = 15.0;
    var errorPct = Math.abs(fMeasured - expected) / expected * 100;
    var score;
    if (errorPct < 2) { score = 100; }
    else if (errorPct < 5) { score = 90; }
    else if (errorPct < 10) { score = 75; }
    else if (errorPct < 20) { score = 55; }
    else { score = 30; }
    var advice = [];
    if (d.length < 4) { advice.push("只有 " + d.length + " 組數據。建議至少量度 4 組不同物距。"); }
    if (errorPct < 5) { advice.push("結果良好！你的焦距非常接近標準值。"); }
    else { advice.push("誤差較大。請確認屏幕成像清晰（清晰度 >= 90%）後才記錄數據。"); }
    advice.push("公式：1/u + 1/v = 1/f。將多次實驗的 f 值取平均以提升準確度。");
    return { score: score, measured: fMeasured, expected: expected, unit: this.unit, errorPct: errorPct, advice: advice };
  }
};

function PHYLAB_renderSelector() {
  var grid = PHYLAB_$("phylabExpGrid");
  if (!grid) { return; }
  grid.innerHTML = "";
  var expKeys = Object.keys(PHYLAB_experiments);
  for (var i = 0; i < expKeys.length; i++) {
    (function (key) {
      var exp = PHYLAB_experiments[key];
      var card = document.createElement("button");
      card.className = "phylab-exp-card";
      card.type = "button";
      var diffDots = "";
      for (var d = 1; d <= 3; d++) {
        diffDots += '<div class="phylab-exp-difficulty-dot ' + (d <= exp.difficulty ? "filled" : "") + '"></div>';
      }
      card.innerHTML = ''
        + '<div class="phylab-exp-preview">' + exp.previewSVG() + '</div>'
        + '<div class="phylab-exp-title">' + PHYLAB_esc(exp.title_zh) + '</div>'
        + '<div class="phylab-exp-subtitle">' + PHYLAB_esc(exp.desc_zh) + '</div>'
        + '<div class="phylab-exp-meta">'
        +   '<div class="phylab-exp-difficulty">' + diffDots + '</div>'
        +   '<div class="phylab-exp-start">開始 '
        +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
        +   '</div>'
        + '</div>';
      card.addEventListener("click", function () { PHYLAB_openExperiment(key); });
      grid.appendChild(card);
    })(expKeys[i]);
  }
}

var PHYLAB_currentExp = null;

function PHYLAB_openExperiment(key) {
  var exp = PHYLAB_experiments[key];
  if (!exp) { return; }
  PHYLAB_currentExp = exp;
  exp.reset();
  PHYLAB_showScreen("lab");
  PHYLAB_$("phylabLabTitle").textContent = exp.title_zh;
  exp.render();
}

function PHYLAB_showResult(result) {
  if (result.error) { PHYLAB_toast(result.error, "warn"); return; }
  var backdrop = PHYLAB_$("phylabResultBackdrop");
  if (!backdrop) { return; }
  var emoji, title;
  if (result.score >= 90) { emoji = "\uD83C\uDFC6"; title = "完美！"; }
  else if (result.score >= 75) { emoji = "\u2728"; title = "表現不錯"; }
  else if (result.score >= 55) { emoji = "\uD83D\uDC4D"; title = "尚可接受"; }
  else { emoji = "\uD83D\uDCDA"; title = "需要改進"; }
  PHYLAB_$("phylabResultEmoji").textContent = emoji;
  PHYLAB_$("phylabResultTitle").textContent = title;
  PHYLAB_$("phylabResultSub").textContent = "得分：" + result.score + " / 100";

  var circumference = 2 * Math.PI * 38;
  var dash = (result.score / 100) * circumference;
  var ring = PHYLAB_$("phylabScoreRing");
  if (ring) {
    var color = result.score >= 75 ? "#10b981" : (result.score >= 55 ? "#f59e0b" : "#ef4444");
    ring.setAttribute("stroke", color);
    ring.setAttribute("stroke-dasharray", "0 " + circumference);
    setTimeout(function () { ring.setAttribute("stroke-dasharray", dash + " " + circumference); }, 100);
  }
  var textEl = PHYLAB_$("phylabScoreText");
  if (textEl) {
    var c = result.score >= 75 ? "#10b981" : (result.score >= 55 ? "#f59e0b" : "#ef4444");
    textEl.textContent = "0%"; textEl.style.color = c;
    var startTime = Date.now();
    var animate = function () {
      var elapsed = Date.now() - startTime;
      var pct = Math.min(result.score, (elapsed / 800) * result.score);
      textEl.textContent = Math.round(pct) + "%";
      if (pct < result.score) { requestAnimationFrame(animate); }
    };
    animate();
  }

  PHYLAB_$("phylabResultCompare").innerHTML = ''
    + '<div class="phylab-compare-row"><span class="phylab-compare-label">你的結果</span><span class="phylab-compare-value">' + result.measured.toFixed(2) + ' ' + PHYLAB_esc(result.unit) + '</span></div>'
    + '<div class="phylab-compare-row"><span class="phylab-compare-label">標準值</span><span class="phylab-compare-value">' + result.expected.toFixed(2) + ' ' + PHYLAB_esc(result.unit) + '</span></div>'
    + '<div class="phylab-compare-row"><span class="phylab-compare-label">誤差</span><span class="phylab-compare-value" style="color:' + (result.errorPct < 5 ? "#10b981" : (result.errorPct < 15 ? "#f59e0b" : "#ef4444")) + ';">' + result.errorPct.toFixed(2) + '%</span></div>';

  var adviceHtml = '<div class="phylab-advice-head">實驗建議</div><ul>';
  for (var i = 0; i < result.advice.length; i++) {
    adviceHtml += '<li>' + result.advice[i] + '</li>';
  }
  adviceHtml += '</ul>';
  PHYLAB_$("phylabResultAdvice").innerHTML = adviceHtml;

  backdrop.classList.add("show");
  if (result.score >= 75 && typeof PHY_launchConfetti === "function") {
    try { PHY_launchConfetti(); } catch (e) {}
  }
}

function PHYLAB_hideResult() {
  var backdrop = PHYLAB_$("phylabResultBackdrop");
  if (backdrop) { backdrop.classList.remove("show"); }
}

function PHYLAB_spawnParticles() {
  var wrap = PHYLAB_$("phylabParticles");
  if (!wrap) { return; }
  var html = "";
  for (var i = 0; i < 30; i++) {
    var left = Math.random() * 100;
    var delay = Math.random() * 20;
    var duration = 15 + Math.random() * 15;
    var size = 1 + Math.random() * 3;
    html += '<div class="phylab-particle" style="left:' + left + '%; animation-delay: -' + delay + 's; animation-duration: ' + duration + 's; width:' + size + 'px; height:' + size + 'px;"></div>';
  }
  wrap.innerHTML = html;
}

function PHYLAB_bindNavigation() {
  var choices = document.querySelectorAll("[data-phylab-choice]");
  for (var i = 0; i < choices.length; i++) {
    (function (btn) {
      btn.addEventListener("click", function () {
        var choice = btn.getAttribute("data-phylab-choice");
        if (choice === "practice") { PHYLAB_hideAll(); }
        else if (choice === "experiment") {
          PHYLAB_showScreen("selector");
          PHYLAB_renderSelector();
        }
      });
    })(choices[i]);
  }
  var navs = document.querySelectorAll("[data-phylab-nav]");
  for (var j = 0; j < navs.length; j++) {
    (function (btn) {
      btn.addEventListener("click", function () {
        var target = btn.getAttribute("data-phylab-nav");
        if (target === "launcher") { PHYLAB_showScreen("launcher"); }
        else if (target === "selector") {
          PHYLAB_showScreen("selector");
          PHYLAB_renderSelector();
        }
      });
    })(navs[j]);
  }
  var resetBtn = PHYLAB_$("phylabReset");
  if (resetBtn) {
    resetBtn.addEventListener("click", function () {
      if (!PHYLAB_currentExp) { return; }
      if (!confirm("確定重置此實驗？")) { return; }
      PHYLAB_currentExp.reset();
      PHYLAB_currentExp.render();
    });
  }
  var scoreBtn = PHYLAB_$("phylabScore");
  if (scoreBtn) {
    scoreBtn.addEventListener("click", function () {
      if (!PHYLAB_currentExp) { return; }
      var result = PHYLAB_currentExp.score();
      PHYLAB_showResult(result);
    });
  }
  var retryBtn = PHYLAB_$("phylabResultRetry");
  if (retryBtn) {
    retryBtn.addEventListener("click", function () {
      PHYLAB_hideResult();
      if (PHYLAB_currentExp) { PHYLAB_currentExp.reset(); PHYLAB_currentExp.render(); }
    });
  }
  var backBtn = PHYLAB_$("phylabResultBack");
  if (backBtn) {
    backBtn.addEventListener("click", function () {
      PHYLAB_hideResult();
      PHYLAB_showScreen("selector");
      PHYLAB_renderSelector();
    });
  }
  var backdrop = PHYLAB_$("phylabResultBackdrop");
  if (backdrop) {
    backdrop.addEventListener("click", function (e) {
      if (e.target === backdrop) { PHYLAB_hideResult(); }
    });
  }
}

function PHYLAB_init() {
  PHYLAB_spawnParticles();
  PHYLAB_bindNavigation();
  PHYLAB_showScreen("launcher");
  console.log("[PhyGenius Lab] v1.0 ready - experiments: " + Object.keys(PHYLAB_experiments).length);
window.PHYLAB_experiments = PHYLAB_experiments;
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", PHYLAB_init);
} else {
  PHYLAB_init();
}

})();
</script>

<script>
(function () {
"use strict";

function P8_$(id) { return document.getElementById(id); }

function P8_getLang() {
  try {
    var s = localStorage.getItem("phy_lang_v2");
    if (s === "en" || s === "zh") return s;
  } catch (e) {}
  return "zh";
}

var P8_I18N = {
  zh: {
    home: "主頁",
    tab_leaderboard: "排行",
    title_leaderboard: "排行榜",
    subtitle_leaderboard: "記錄你的最佳成績",
    lb_exp: "實驗",
    lb_prac: "練習",
    lb_total: "總分",
    lb_empty: "尚未有任何記錄，去練習或做實驗吧！",
    lb_reset: "清除實驗記錄",
    lb_confirm_reset: "確定清除所有實驗分數？",
    lb_score: "分",
    lb_total_score: "總積分",
    lb_exp_total: "實驗總分",
    lb_prac_total: "練習總分",
    lb_exp_count: "實驗次數",
    lb_avg_exp: "平均實驗得分",
    lb_avg_prac: "平均練習得分",
    just_now: "剛剛",
    min_ago: " 分鐘前",
    hr_ago: " 小時前",
    d_ago: " 天前"
  },
  en: {
    home: "Home",
    tab_leaderboard: "Rank",
    title_leaderboard: "Leaderboard",
    subtitle_leaderboard: "Track your best scores",
    lb_exp: "Experiment",
    lb_prac: "Practice",
    lb_total: "Total",
    lb_empty: "No records yet. Start practicing or try an experiment!",
    lb_reset: "Clear Experiment Records",
    lb_confirm_reset: "Clear all experiment scores?",
    lb_score: "pts",
    lb_total_score: "Total",
    lb_exp_total: "Experiment",
    lb_prac_total: "Practice",
    lb_exp_count: "Runs",
    lb_avg_exp: "Avg Experiment",
    lb_avg_prac: "Avg Practice",
    just_now: "Just now",
    min_ago: " min ago",
    hr_ago: " hr ago",
    d_ago: " d ago"
  }
};

function P8_t(key) {
  var lang = P8_getLang();
  return (P8_I18N[lang] && P8_I18N[lang][key]) || P8_I18N.zh[key] || key;
}

/* ===================================================
   Storage helpers
   =================================================== */
var P8_EXP_KEY = "phygenius_exp_scores_v1";

function P8_loadExp() {
  try {
    var s = localStorage.getItem(P8_EXP_KEY);
    if (s) return JSON.parse(s);
  } catch (e) {}
  return [];
}

function P8_saveExp(list) {
  if (list.length > 100) list = list.slice(-100);
  try { localStorage.setItem(P8_EXP_KEY, JSON.stringify(list)); } catch (e) {}
}

function P8_loadPrac() {
  try {
    var s = localStorage.getItem("phy_history_v2");
    if (s) return JSON.parse(s);
  } catch (e) {}
  return [];
}

/* ===================================================
   1. Home button in header
   =================================================== */
function P8_injectHomeButton() {
  var header = document.querySelector(".header-inner");
  if (!header) return;
  var actions = header.querySelector(".header-actions");
  if (!actions || P8_$("phyHomeBtn")) return;

  var btn = document.createElement("button");
  btn.id = "phyHomeBtn";
  btn.className = "icon-btn";
  btn.type = "button";
  btn.title = P8_t("home");
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>';
  btn.addEventListener("click", function () {
    var launcher = P8_$("phylabLauncher");
    var selector = P8_$("phylabSelector");
    var lab = P8_$("phylabLab");
    if (launcher) launcher.classList.remove("hidden");
    if (selector) selector.classList.add("hidden");
    if (lab) lab.classList.add("hidden");
    var resModal = P8_$("phylabResultBackdrop");
    if (resModal) resModal.classList.remove("show");
  });
  actions.insertBefore(btn, actions.firstChild);
}

/* ===================================================
   2. Leaderboard tab in tabbar
   =================================================== */
function P8_injectLeaderboardTab() {
  var tabbar = document.querySelector(".tabbar-inner");
  if (!tabbar) return;
  if (document.querySelector('.tab-btn[data-tab="leaderboard"]')) return;

  var btn = document.createElement("button");
  btn.className = "tab-btn";
  btn.setAttribute("data-tab", "leaderboard");
  btn.type = "button";
  btn.innerHTML = 
    '<span class="tab-icon">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>'
    + '<path d="M4 22h16"/>'
    + '<path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>'
    + '<path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>'
    + '<path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>'
    + '</svg></span>'
    + '<span class="tab-lb-label"></span>';
  btn.querySelector(".tab-lb-label").textContent = P8_t("tab_leaderboard");
  tabbar.appendChild(btn);

  btn.addEventListener("click", function () {
    P8_switchToLeaderboard();
  });

  var others = tabbar.querySelectorAll('.tab-btn:not([data-tab="leaderboard"])');
  for (var i = 0; i < others.length; i++) {
    others[i].addEventListener("click", function () {
      var lb = P8_$("panel-leaderboard");
      if (lb) lb.classList.remove("active");
    });
  }
}

function P8_switchToLeaderboard() {
  var panels = ["practice", "formulas", "report", "library"];
  for (var i = 0; i < panels.length; i++) {
    var p = P8_$("panel-" + panels[i]);
    if (p) p.classList.remove("active");
  }
  var lb = P8_$("panel-leaderboard");
  if (lb) lb.classList.add("active");
  var btns = document.querySelectorAll(".tab-btn");
  for (var j = 0; j < btns.length; j++) {
    btns[j].classList.toggle("active", btns[j].getAttribute("data-tab") === "leaderboard");
  }
  P8_renderLeaderboard(P8_currentCat);
}

/* ===================================================
   3. Leaderboard panel
   =================================================== */
var P8_currentCat = "experiment";

function P8_injectLeaderboardPanel() {
  var main = document.querySelector(".main");
  if (!main) return;
  if (P8_$("panel-leaderboard")) return;

  var panel = document.createElement("section");
  panel.id = "panel-leaderboard";
  panel.className = "panel";
  panel.innerHTML = ''
    + '<h2 class="page-title" id="phyLbTitle"></h2>'
    + '<p class="page-subtitle" id="phyLbSubtitle"></p>'
    + '<div id="phyLbTabs" class="phy-lb-tabs"></div>'
    + '<div id="phyLbContent"></div>'
    + '<button id="phyLbReset" class="btn-danger" type="button" style="margin-top:16px;"></button>';
  main.appendChild(panel);

  var tabsWrap = P8_$("phyLbTabs");
  var cats = ["experiment", "practice", "total"];
  var catKeys = { experiment: "lb_exp", practice: "lb_prac", total: "lb_total" };

  for (var i = 0; i < cats.length; i++) {
    (function (cat) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (cat === P8_currentCat ? " selected" : "");
      b.textContent = P8_t(catKeys[cat]);
      b.setAttribute("data-lb-cat", cat);
      b.addEventListener("click", function () {
        P8_currentCat = cat;
        var all = tabsWrap.querySelectorAll(".chip");
        for (var k = 0; k < all.length; k++) all[k].classList.remove("selected");
        b.classList.add("selected");
        P8_renderLeaderboard(cat);
      });
      tabsWrap.appendChild(b);
    })(cats[i]);
  }

  var resetBtn = P8_$("phyLbReset");
  resetBtn.textContent = P8_t("lb_reset");
  resetBtn.addEventListener("click", function () {
    if (!confirm(P8_t("lb_confirm_reset"))) return;
    try { localStorage.removeItem(P8_EXP_KEY); } catch (e) {}
    P8_renderLeaderboard(P8_currentCat);
  });
}

/* ===================================================
   4. Rendering
   =================================================== */
function P8_formatWhen(ts) {
  var diff = Date.now() - ts;
  var lang = P8_getLang();
  if (diff < 60000) return P8_t("just_now");
  if (diff < 3600000) return Math.floor(diff / 60000) + P8_t("min_ago");
  if (diff < 86400000) return Math.floor(diff / 3600000) + P8_t("hr_ago");
  if (diff < 604800000) return Math.floor(diff / 86400000) + P8_t("d_ago");
  return new Date(ts).toLocaleDateString(lang === "en" ? "en-US" : "zh-HK");
}

function P8_renderLeaderboard(cat) {
  var titleEl = P8_$("phyLbTitle");
  var subEl = P8_$("phyLbSubtitle");
  var content = P8_$("phyLbContent");
  var resetBtn = P8_$("phyLbReset");
  var tabsWrap = P8_$("phyLbTabs");
  if (!content) return;

  titleEl.textContent = P8_t("title_leaderboard");
  subEl.textContent = P8_t("subtitle_leaderboard");
  resetBtn.textContent = P8_t("lb_reset");

  if (tabsWrap) {
    var chips = tabsWrap.querySelectorAll(".chip");
    var labels = ["lb_exp", "lb_prac", "lb_total"];
    for (var i = 0; i < chips.length; i++) {
      chips[i].textContent = P8_t(labels[i]);
      chips[i].classList.toggle("selected", chips[i].getAttribute("data-lb-cat") === cat);
    }
  }

  content.innerHTML = "";

  if (cat === "experiment") P8_renderExp(content);
  else if (cat === "practice") P8_renderPrac(content);
  else P8_renderTotal(content);
}

function P8_renderExp(container) {
  var list = P8_loadExp();
  list.sort(function (a, b) { return b.score - a.score || b.ts - a.ts; });
  var top = list.slice(0, 10);

  if (top.length === 0) {
    var e = document.createElement("div");
    e.className = "phy-lb-empty";
    e.textContent = P8_t("lb_empty");
    container.appendChild(e);
    return;
  }

  var lang = P8_getLang();
  var card = document.createElement("div");
  card.className = "phy-lb-card";
  var html = "";
  for (var i = 0; i < top.length; i++) {
    var it = top[i];
    var rankCls = "phy-lb-rank" + (i < 3 ? " rank-" + (i + 1) : "");
    var name = (lang === "en" && it.nameEn) ? it.nameEn : it.name;
    html += '<div class="phy-lb-row">'
      + '<div class="' + rankCls + '">' + (i + 1) + '</div>'
      + '<div class="phy-lb-info">'
      +   '<div class="phy-lb-topic">' + name + '</div>'
      +   '<div class="phy-lb-when">' + P8_formatWhen(it.ts) + '</div>'
      + '</div>'
      + '<div class="phy-lb-score">' + it.score + '<span class="phy-lb-score-max"> / 100</span></div>'
      + '</div>';
  }
  card.innerHTML = html;
  container.appendChild(card);
}

function P8_renderPrac(container) {
  var list = P8_loadPrac();
  var enriched = [];
  for (var i = 0; i < list.length; i++) {
    var e = list[i];
    var pct = e.total > 0 ? Math.round((e.score / e.total) * 100) : 0;
    enriched.push({
      topic: e.topic_zh,
      topicEn: e.topic_en,
      score: e.score,
      total: e.total,
      pct: pct,
      ts: e.ts
    });
  }
  enriched.sort(function (a, b) { return b.pct - a.pct || b.ts - a.ts; });
  var top = enriched.slice(0, 10);

  if (top.length === 0) {
    var em = document.createElement("div");
    em.className = "phy-lb-empty";
    em.textContent = P8_t("lb_empty");
    container.appendChild(em);
    return;
  }

  var lang = P8_getLang();
  var card = document.createElement("div");
  card.className = "phy-lb-card";
  var html = "";
  for (var j = 0; j < top.length; j++) {
    var it = top[j];
    var rankCls = "phy-lb-rank" + (j < 3 ? " rank-" + (j + 1) : "");
    var name = (lang === "en" && it.topicEn) ? it.topicEn : it.topic;
    html += '<div class="phy-lb-row">'
      + '<div class="' + rankCls + '">' + (j + 1) + '</div>'
      + '<div class="phy-lb-info">'
      +   '<div class="phy-lb-topic">' + name + '</div>'
      +   '<div class="phy-lb-when">' + it.score + ' / ' + it.total + ' - ' + P8_formatWhen(it.ts) + '</div>'
      + '</div>'
      + '<div class="phy-lb-score">' + it.pct + '%</div>'
      + '</div>';
  }
  card.innerHTML = html;
  container.appendChild(card);
}

function P8_renderTotal(container) {
  var expList = P8_loadExp();
  var pracList = P8_loadPrac();

  var totalExp = 0;
  var totalPracPct = 0;
  for (var i = 0; i < expList.length; i++) totalExp += expList[i].score;
  for (var j = 0; j < pracList.length; j++) {
    if (pracList[j].total > 0) {
      totalPracPct += (pracList[j].score / pracList[j].total) * 100;
    }
  }

  var overall = Math.round(totalExp + totalPracPct);

  var stats = document.createElement("div");
  stats.className = "phy-lb-stats";
  stats.innerHTML = ''
    + '<div class="phy-lb-stat"><div class="phy-lb-stat-num">' + overall + '</div>'
    +   '<div class="phy-lb-stat-lbl">' + P8_t("lb_total_score") + '</div></div>'
    + '<div class="phy-lb-stat"><div class="phy-lb-stat-num">' + Math.round(totalExp) + '</div>'
    +   '<div class="phy-lb-stat-lbl">' + P8_t("lb_exp_total") + '</div></div>'
    + '<div class="phy-lb-stat"><div class="phy-lb-stat-num">' + Math.round(totalPracPct) + '</div>'
    +   '<div class="phy-lb-stat-lbl">' + P8_t("lb_prac_total") + '</div></div>'
    + '<div class="phy-lb-stat"><div class="phy-lb-stat-num">' + expList.length + '</div>'
    +   '<div class="phy-lb-stat-lbl">' + P8_t("lb_exp_count") + '</div></div>';
  container.appendChild(stats);

  if (expList.length + pracList.length > 0) {
    var avgExp = expList.length > 0 ? Math.round(totalExp / expList.length) : 0;
    var avgPrac = pracList.length > 0 ? Math.round(totalPracPct / pracList.length) : 0;
    var summary = document.createElement("div");
    summary.className = "phy-lb-card";
    summary.innerHTML = ''
      + '<div class="phy-lb-row">'
      +   '<div class="phy-lb-info"><div class="phy-lb-topic">' + P8_t("lb_avg_exp") + '</div></div>'
      +   '<div class="phy-lb-score">' + avgExp + '</div>'
      + '</div>'
      + '<div class="phy-lb-row">'
      +   '<div class="phy-lb-info"><div class="phy-lb-topic">' + P8_t("lb_avg_prac") + '</div></div>'
      +   '<div class="phy-lb-score">' + avgPrac + '%</div>'
      + '</div>';
    container.appendChild(summary);
  }
}

/* ===================================================
   5. Hook experiment score submission
   =================================================== */
function P8_hookExpScore() {
  document.addEventListener("click", function (e) {
    var target = e.target;
    if (target && target.id === "phylabScore") {
      setTimeout(function () {
        var sub = P8_$("phylabResultSub");
        var title = P8_$("phylabLabTitle");
        if (!sub || !title) return;
        var text = sub.textContent || "";
        var m = text.match(/(\d+)\s*\/\s*100/);
        if (!m) return;
        var score = parseInt(m[1], 10);
        var t = title.textContent || "";

        var nameZh = t, nameEn = t;
        if (t.indexOf("單擺") !== -1 || t.indexOf("Pendulum") !== -1) {
          nameZh = "單擺測重力加速度"; nameEn = "Simple Pendulum - g";
        } else if (t.indexOf("歐姆") !== -1 || t.indexOf("Ohm") !== -1) {
          nameZh = "歐姆定律測電阻"; nameEn = "Ohm's Law - Resistance";
        } else if (t.indexOf("凸透鏡") !== -1 || t.indexOf("Lens") !== -1) {
          nameZh = "凸透鏡測焦距"; nameEn = "Convex Lens - Focal Length";
        }

        var list = P8_loadExp();
        list.push({ name: nameZh, nameEn: nameEn, score: score, ts: Date.now() });
        P8_saveExp(list);
      }, 300);
    }
  }, true);
}

/* ===================================================
   6. Lab language button + i18n translation

    var cur = P8_getLang();
    try { localStorage.setItem("phy_lang_v2", cur === "en" ? "zh" : "en"); } catch (e) {}
    location.reload();
  }
}

var P8_origMap = new WeakMap();

function P8_translateNode(node) {
  if (node.nodeType === 3) {
    var text = node.textContent;
    if (!text || !text.trim()) return;
    var trimmed = text.trim();

    if (!P8_origMap.has(node)) {
      P8_origMap.set(node, text);
    }
    var orig = P8_origMap.get(node);

    var isEn = P8_getLang() === "en";
    var target;

    if (isEn) {
      var trimmedOrig = orig.trim();
      if (P8_LAB_MAP[trimmedOrig]) {
        target = orig.replace(trimmedOrig, P8_LAB_MAP[trimmedOrig]);
      } else {
        target = orig;
        if (orig.indexOf("得分：") !== -1) target = target.replace("得分：", "Score: ");
        if (target.indexOf("步驟 3：已記錄 ") !== -1) {
          target = target.replace("步驟 3：已記錄 ", "Step 3: Recorded ").replace(" 組數據", " data points");
        }
        if (target.indexOf("步驟 4：已記錄 ") !== -1) {
          target = target.replace("步驟 4：已記錄 ", "Step 4: Recorded ").replace(" 組數據（建議 5 組以上）", " data points (5+ recommended)");
        }
      }
    } else {
      target = orig;
    }

    if (node.textContent !== target) {
      node.textContent = target;
    }
  } else if (node.nodeType === 1) {
    var tag = node.tagName;
    if (tag === "SCRIPT" || tag === "STYLE") return;
    for (var i = 0; i < node.childNodes.length; i++) {
      P8_translateNode(node.childNodes[i]);
    }
  }
}

function P8_translateLab() {
return;
  var ids = ["phylabLauncher", "phylabSelector", "phylabLab", "phylabResultBackdrop"];
  for (var i = 0; i < ids.length; i++) {
    var el = P8_$(ids[i]);
    if (el) P8_translateNode(el);
  }
  P8_injectLangButtons();
}

var P8_obs = null;
function P8_startObserver() {
  if (P8_obs) return;
  P8_obs = new MutationObserver(function () {
    if (P8_obs.timer) clearTimeout(P8_obs.timer);
    P8_obs.timer = setTimeout(P8_translateLab, 50);
  });
  var ids = ["phylabLauncher", "phylabSelector", "phylabLab", "phylabResultBackdrop"];
  for (var i = 0; i < ids.length; i++) {
    var el = P8_$(ids[i]);
    if (el) P8_obs.observe(el, { childList: true, subtree: true, characterData: true });
  }
}

}

    + '<path d="M4 22h16"/>'

    + '<path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>'

function P9_updateToolbar() {
  var bar = P9_$("phylabToolbar");
  if (!bar) return;

  var langText = P9_$("phylabToolbarLangText");
  if (langText) langText.textContent = P9_getLang() === "en" ? "中文" : "EN";

  var themeText = P9_$("phylabToolbarThemeText");
  if (themeText) themeText.textContent = P9_t("theme");

  var rankText = P9_$("phylabToolbarRankText");
  if (rankText) rankText.textContent = P9_t("rank");

  var isLight = P9_getTheme() === "light";
  bar.classList.toggle("light-mode", isLight);

  /* Show only when launcher/selector/lab is visible (leaderboard modal hides it) */
  var anyOverlayOpen = false;
  var ids = ["phylabLauncher", "phylabSelector", "phylabLab"];
  for (var i = 0; i < ids.length; i++) {
    var el = P9_$(ids[i]);
    if (el && !el.classList.contains("hidden")) { anyOverlayOpen = true; break; }
  }
  var lbModal = P9_$("p9LbBackdrop");
  if (lbModal && lbModal.classList.contains("show")) {
    bar.classList.add("hidden");
  } else {
    bar.classList.toggle("hidden", !anyOverlayOpen);
  }
}

var P9_lbCat = "experiment";

function P9_openLeaderboardModal() {

function P9_formatWhen(ts) {
  var diff = Date.now() - ts;
  if (diff < 60000) return P9_t("just_now");
  if (diff < 3600000) return Math.floor(diff / 60000) + P9_t("min_ago");
  if (diff < 86400000) return Math.floor(diff / 3600000) + P9_t("hr_ago");
  if (diff < 604800000) return Math.floor(diff / 86400000) + P9_t("d_ago");
  var lang = P9_getLang();
  return new Date(ts).toLocaleDateString(lang === "en" ? "en-US" : "zh-HK");
}

function P9_renderLbModal(cat) {
  var titleText = P9_$("p9LbTitleText");
  if (titleText) titleText.textContent = P9_t("lb_title");

  var tabs = P9_$("p9LbTabs");
  if (tabs) {
    var btns = tabs.querySelectorAll(".p9-lb-tab");
    var keys = ["lb_exp", "lb_prac", "lb_total"];
    var cats = ["experiment", "practice", "total"];
    for (var i = 0; i < btns.length; i++) {
      btns[i].textContent = P9_t(keys[i]);
      btns[i].classList.toggle("active", cats[i] === cat);
    }
  }

  var content = P9_$("p9LbContent");
  if (!content) return;
  content.innerHTML = "";

  if (cat === "experiment") P9_renderExpList(content);
  else if (cat === "practice") P9_renderPracList(content);
  else P9_renderTotalStats(content);
}

function P9_renderExpList(container) {
  var list = [];
  try {
    var s = localStorage.getItem("phygenius_exp_scores_v1");
    if (s) list = JSON.parse(s);
  } catch (e) {}
  list.sort(function (a, b) { return b.score - a.score || b.ts - a.ts; });
  var top = list.slice(0, 10);

  if (top.length === 0) {
    container.innerHTML = '<div class="p9-lb-empty">' + P9_t("lb_empty") + '</div>';
    return;
  }

  var lang = P9_getLang();
  var html = '<div class="p9-lb-card">';
  for (var i = 0; i < top.length; i++) {
    var it = top[i];
    var rankCls = "p9-lb-rank" + (i < 3 ? " rank-" + (i + 1) : "");
    var name;
    if (lang === "en") {
      name = it.nameEn || P9_EXP_MAP[it.name] || it.name;
    } else {
      name = it.name;
    }
    html += '<div class="p9-lb-row">'
      + '<div class="' + rankCls + '">' + (i + 1) + '</div>'
      + '<div class="p9-lb-info">'
      +   '<div class="p9-lb-topic">' + name + '</div>'
      +   '<div class="p9-lb-when">' + P9_formatWhen(it.ts) + '</div>'
      + '</div>'
      + '<div class="p9-lb-score">' + it.score + '<span class="p9-lb-score-max"> / 100</span></div>'
      + '</div>';
  }
  html += '</div>';
  container.innerHTML = html;
}

function P9_renderPracList(container) {
  var list = [];
  try {
    var s = localStorage.getItem("phy_history_v2");
    if (s) list = JSON.parse(s);
  } catch (e) {}

  var enriched = [];
  for (var i = 0; i < list.length; i++) {
    var e = list[i];
    var pct = e.total > 0 ? Math.round((e.score / e.total) * 100) : 0;
    enriched.push({
      topic: e.topic_zh, topicEn: e.topic_en,
      score: e.score, total: e.total, pct: pct, ts: e.ts
    });
  }
  enriched.sort(function (a, b) { return b.pct - a.pct || b.ts - a.ts; });
  var top = enriched.slice(0, 10);

  if (top.length === 0) {
    container.innerHTML = '<div class="p9-lb-empty">' + P9_t("lb_empty") + '</div>';
    return;
  }

  var lang = P9_getLang();
  var html = '<div class="p9-lb-card">';
  for (var j = 0; j < top.length; j++) {
    var it = top[j];
    var rankCls = "p9-lb-rank" + (j < 3 ? " rank-" + (j + 1) : "");
    var name = (lang === "en" && it.topicEn) ? it.topicEn : it.topic;
    html += '<div class="p9-lb-row">'
      + '<div class="' + rankCls + '">' + (j + 1) + '</div>'
      + '<div class="p9-lb-info">'
      +   '<div class="p9-lb-topic">' + name + '</div>'
      +   '<div class="p9-lb-when">' + it.score + ' / ' + it.total + ' - ' + P9_formatWhen(it.ts) + '</div>'
      + '</div>'
      + '<div class="p9-lb-score">' + it.pct + '%</div>'
      + '</div>';
  }
  html += '</div>';
  container.innerHTML = html;
}

function P9_renderTotalStats(container) {
  var expList = [];
  var pracList = [];
  try {
    var s1 = localStorage.getItem("phygenius_exp_scores_v1");
    if (s1) expList = JSON.parse(s1);
  } catch (e) {}
  try {
    var s2 = localStorage.getItem("phy_history_v2");
    if (s2) pracList = JSON.parse(s2);
  } catch (e) {}

  var totalExp = 0, totalPracPct = 0;
  for (var i = 0; i < expList.length; i++) totalExp += expList[i].score;
  for (var j = 0; j < pracList.length; j++) {
    if (pracList[j].total > 0) totalPracPct += (pracList[j].score / pracList[j].total) * 100;
  }
  var overall = Math.round(totalExp + totalPracPct);
  var avgExp = expList.length > 0 ? Math.round(totalExp / expList.length) : 0;
  var avgPrac = pracList.length > 0 ? Math.round(totalPracPct / pracList.length) : 0;

  var html = ''
    + '<div class="p9-lb-stats">'
    +   '<div class="p9-lb-stat"><div class="p9-lb-stat-num">' + overall + '</div>'
    +     '<div class="p9-lb-stat-lbl">' + P9_t("lb_total_score") + '</div></div>'
    +   '<div class="p9-lb-stat"><div class="p9-lb-stat-num">' + Math.round(totalExp) + '</div>'
    +     '<div class="p9-lb-stat-lbl">' + P9_t("lb_exp_total") + '</div></div>'
    +   '<div class="p9-lb-stat"><div class="p9-lb-stat-num">' + Math.round(totalPracPct) + '</div>'
    +     '<div class="p9-lb-stat-lbl">' + P9_t("lb_prac_total") + '</div></div>'
    +   '<div class="p9-lb-stat"><div class="p9-lb-stat-num">' + expList.length + '</div>'
    +     '<div class="p9-lb-stat-lbl">' + P9_t("lb_exp_count") + '</div></div>'
    + '</div>'
    + '<div class="p9-lb-card">'
    + '<div class="p9-lb-row">'
    +   '<div class="p9-lb-info"><div class="p9-lb-topic">' + P9_t("lb_avg_exp") + '</div></div>'
    +   '<div class="p9-lb-score">' + avgExp + '</div>'
    + '</div>'
    + '<div class="p9-lb-row">'
    +   '<div class="p9-lb-info"><div class="p9-lb-topic">' + P9_t("lb_avg_prac") + '</div></div>'
    +   '<div class="p9-lb-score">' + avgPrac + '%</div>'
    + '</div>'
    + '</div>';

  container.innerHTML = html;
}

/* ===================================================
   3. SINGLE-DIRECTION translator (no loop)
   =================================================== */
var P9_origMap = new WeakMap();
var P9_translating = false;

function P9_translateNode(node) {
  if (node.nodeType === 3) {
    var text = node.textContent;
    if (!text || !text.trim()) return;

    /* Cache original on first sight */
    if (!P9_origMap.has(node)) {
      P9_origMap.set(node, text);
    }
    var orig = P9_origMap.get(node);

    /* Compute target based on language */
    var target = orig;
    if (P9_getLang() === "en") {
      var trimmedOrig = orig.trim();
      if (P9_LAB_MAP[trimmedOrig]) {
        target = orig.replace(trimmedOrig, P9_LAB_MAP[trimmedOrig]);
      } else if (P9_EXP_MAP[trimmedOrig]) {
        target = orig.replace(trimmedOrig, P9_EXP_MAP[trimmedOrig]);
      } else {
        /* Handle dynamic strings like "步驟 3：已記錄 5 組數據" */
        if (orig.indexOf("步驟 3：已記錄 ") !== -1) {
          target = orig.replace("步驟 3：已記錄 ", "Step 3: Recorded ")
                       .replace(" 組數據", " data points");
        } else if (orig.indexOf("步驟 4：已記錄 ") !== -1) {
          target = orig.replace("步驟 4：已記錄 ", "Step 4: Recorded ")
                       .replace(" 組數據（建議 5 組以上）", " data points (5+ recommended)");
        } else if (orig.indexOf("得分：") !== -1) {
          target = orig.replace("得分：", "Score: ");
        }
      }
    }
    /* When zh: target = orig (original Chinese), no change needed */

    if (node.textContent !== target) {
      node.textContent = target;
    }
  } else if (node.nodeType === 1) {
    var tag = node.tagName;
    if (tag === "SCRIPT" || tag === "STYLE") return;
    for (var i = 0; i < node.childNodes.length; i++) {
      P9_translateNode(node.childNodes[i]);
    }
  }
}

function P9_translateAll() {
  if (P9_translating) return;
  P9_translating = true;

  P9_removePart8Buttons();

  var ids = ["phylabLauncher", "phylabSelector", "phylabLab", "phylabResultBackdrop"];
  for (var i = 0; i < ids.length; i++) {
    var el = P9_$(ids[i]);
    if (el) P9_translateNode(el);
  }
  P9_updateToolbar();

  /* Discard mutation records caused by our own translation */
  if (P9_obs) {
    try { P9_obs.takeRecords(); } catch (e) {}
  }

  P9_translating = false;
}

/* ===================================================
   4. MutationObserver
   =================================================== */
var P9_obs = null;

function P9_startObserver() {
  if (P9_obs) {
    try { P9_obs.disconnect(); } catch (e) {}
  }
  P9_obs = new MutationObserver(function (mutations) {
    if (P9_translating) return;
    /* Ignore mutations where only text was changed by our translator */
    var real = false;
    for (var i = 0; i < mutations.length; i++) {
      var m = mutations[i];
      if (m.type === "childList" && m.addedNodes.length > 0) { real = true; break; }
    }
    if (!real) {
      try { P9_obs.takeRecords(); } catch (e) {}
      return;
    }
    if (P9_obs._timer) clearTimeout(P9_obs._timer);
    P9_obs._timer = setTimeout(P9_translateAll, 80);
  });

  var ids = ["phylabLauncher", "phylabSelector", "phylabLab", "phylabResultBackdrop"];
  for (var i = 0; i < ids.length; i++) {
    var el = P9_$(ids[i]);
    if (el) P9_obs.observe(el, { childList: true, subtree: true });
  }
}

/* ===================================================
   5. Hook main lang/theme buttons
   =================================================== */
function P9_hookMainButtons() {
  var langBtn = P9_$("langBtn");
  if (langBtn) {
    langBtn.addEventListener("click", function () {
      setTimeout(P9_translateAll, 150);
    });
  }
  var themeBtn = P9_$("themeBtn");
  if (themeBtn) {
    themeBtn.addEventListener("click", function () {
      setTimeout(P9_updateToolbar, 60);
    });
  }
}

/* ===================================================
   6. Watch screen visibility
   =================================================== */
function P9_watchScreens() {
  var ids = ["phylabLauncher", "phylabSelector", "phylabLab"];
  for (var i = 0; i < ids.length; i++) {
    (function (el) {
      if (!el) return;
      var obs = new MutationObserver(function () {
        P9_updateToolbar();
      });
      obs.observe(el, { attributes: true, attributeFilter: ["class"] });
    })(P9_$(ids[i]));
  }
}

/* ===================================================
   7. Init
   =================================================== */
function P9_init() {
  P9_removePart8Buttons();
  P9_injectToolbar();
  P9_buildLeaderboardModal();
  P9_startObserver();
  P9_hookMainButtons();
  P9_watchScreens();

  if (P9_getLang() === "en") {
    setTimeout(P9_translateAll, 400);
  }

  console.log("[Part 9 v2] Lab Lang/Theme/Leaderboard fixes ready");
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", P9_init);
} else {
  P9_init();
}

})();

<script>

  var str = String(s), out = "";

    else if (c === "<") out += "&lt;";

      + '<rect width="700" height="420" fill="url(#phylabShcGrid)"/>'

      + '<rect x="245" y="' + (100 + 220 * (1 - fillLevel)) + '" width="210" height="' + (220 * fillLevel - 5) + '" rx="8" fill="' + fillColor + '"/>'

      + '<text x="350" y="80" font-size="12" fill="#a5b4fc" text-anchor="middle" font-family="monospace">' + s.powerW + 'W</text>'
      + '<line x1="350" y1="110" x2="350" y2="200" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>'
      + (s.running ? '<circle cx="350" cy="215" r="8" fill="#ef4444" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="0.8s" repeatCount="indefinite"/></circle>' : '')
      + '<rect x="530" y="100" width="20" height="220" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>'
      + '<rect x="533" y="' + (100 + 220 * (1 - tempPct) + 5) + '" width="14" height="' + Math.max(0, 220 * tempPct - 10) + '" rx="7" fill="' + tempColor + '"/>'
      + '<text x="580" y="' + (105 + 220 * (1 - tempPct) + 8) + '" font-size="16" fill="' + tempColor + '" font-family="monospace" font-weight="700">' + temp.toFixed(1) + '°C</text>'
      + '<text x="540" y="345" font-size="10" fill="#64748b" text-anchor="middle" font-family="monospace">T</text>'
      + '<rect x="30" y="30" width="190" height="100" rx="8" fill="rgba(15,23,42,0.78)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>'
      + '<text x="45" y="52" font-size="10" fill="#64748b" font-family="monospace">c = Pt / (m·dT)</text>'
      + '<text x="45" y="72" font-size="10" fill="#64748b" font-family="monospace">m = ' + s.massKg.toFixed(1) + ' kg</text>'
      + '<text x="45" y="90" font-size="10" fill="#64748b" font-family="monospace">P = ' + s.powerW + ' W</text>'
      + '<text x="45" y="108" font-size="10" fill="#64748b" font-family="monospace">T0 = ' + s.startTemp.toFixed(1) + '°C</text>';
  },
  updateReadouts: function () {
    var s = this.state;

  },
  startAnimation: function () {
    var myGen = ++this.state.animGen;
    var self = this;
    function loop() {
      if (self.state.animGen !== myGen) return;
      if (!P10_$("phylabShcSVG")) return;
      if (self.state.running) {
        var elapsedReal = (Date.now() - self.state.realStartMs) / 1000;
        self.state.simSec = elapsedReal * 30; // 1 real sec = 30 sim sec
        var c = self.getC();
        var dT = (self.state.powerW * self.state.simSec) / (self.state.massKg * c);
        self.state.currentTemp = self.state.startTemp + dT;
        self.renderSVG();
        self.updateReadouts();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  },
  bindControls: function () {
    var self = this;

    var matW = P10_$("phylabShcMatW");
    var matAl = P10_$("phylabShcMatAl");
    if (matW && matAl) {
      matW.addEventListener("click", function () {

        self.state.currentTemp = self.state.startTemp;
        self.state.running = false;

        self.state.animGen++; // stop old animation

      matAl.addEventListener("click", function () {
        self.state.material = "aluminium";
        matAl.style.background = "linear-gradient(135deg,#6366f1,#7c3aed)";
        matW.style.background = "";
        self.state.simSec = 0;
        self.state.currentTemp = self.state.startTemp;
        self.state.running = false;

    if (powerSlider) {
      powerSlider.addEventListener("input", function () {
        self.state.powerW = parseInt(this.value, 10);
        P10_$("phylabShcPowerVal").textContent = self.state.powerW + " W";
        self.renderSVG();
      });
    }

    var startBtn = P10_$("phylabShcStart");
    if (startBtn) {
      startBtn.addEventListener("click", function () {
        self.state.running = !self.state.running;
        if (self.state.running) {
          self.state.realStartMs = Date.now() - (self.state.simSec / 30) * 1000;
          startBtn.querySelector("span").textContent = "停止加熱";

    var clrBtn = P10_$("phylabShcClear");
    if (clrBtn) {
      clrBtn.addEventListener("click", function () {
        self.state.data = [];

      });
    }

  renderData: function () {
    var el = P10_$("phylabShcData");
    if (!el) return;
    var d = this.state.data;
    if (d.length === 0) {
      el.innerHTML = '<table class="phylab-data-table"><tr class="empty"><td>尚未記錄任何數據</td></tr></table>';
      return;
    }
    var html = '<table class="phylab-data-table"><thead><tr><th>t(s)</th><th>T(°C)</th><th>dT</th></tr></thead><tbody>';
    for (var i = 0; i < d.length; i++) {
      html += '<tr><td>' + d[i].t.toFixed(0) + '</td><td>' + d[i].T.toFixed(1) + '</td><td>' + d[i].dT.toFixed(1) + '</td></tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  },
  score: function () {
    var d = this.state.data;
    if (d.length < 1) return { error: "請先記錄至少 1 組數據" };
    var last = d[d.length - 1];
    if (last.dT < 5) return { error: "溫度上升太少，無法準確計算。請加熱久一點。" };

    var cReal = this.getC();
    var cMeasured = (this.state.powerW * last.t) / (this.state.massKg * last.dT);
    var expected = cReal;
    var errorPct = Math.abs(cMeasured - expected) / expected * 100;
    var score;
    if (errorPct < 2) score = 100;
    else if (errorPct < 5) score = 90;
    else if (errorPct < 10) score = 75;
    else if (errorPct < 20) score = 55;
    else score = 30;
    var advice = [];
    var mat = this.state.material === "water" ? "水" : "鋁";
    advice.push("使用公式：c = Pt / (m·ΔT)。代入 P = " + this.state.powerW + " W, t = " + last.t.toFixed(0) + " s, m = " + this.state.massKg.toFixed(1) + " kg, ΔT = " + last.dT.toFixed(1) + " °C");
    if (errorPct < 5) {
      advice.push("結果良好！你的 c 值非常接近" + mat + "的標準值 " + expected + " J kg-1 K-1。");
    } else {
      advice.push("誤差較大。請確認加熱時間夠長、記錄前溫度穩定，並注意電熱器的熱損失。");
    }
    advice.push("實際實驗中，電熱器會有部分熱能散失到環境，導致計算出的 c 值偏大。");
    return {
      score: score, measured: cMeasured, expected: expected,
      unit: this.unit, errorPct: errorPct, advice: advice
    };
  }
};

      +   '<div class="phylab-control-label"><span>質量 m</span><span id="phylabLatMassVal">' + s.massKg.toFixed(2) + ' kg</span></div>'
      +   '<input type="range" class="phylab-slider" id="phylabLatMass" min="0.1" max="1.0" step="0.05" value="' + s.massKg + '">'
      + '</div>'
      + '<div class="phylab-control">'
      +   '<div class="phylab-control-label"><span>功率 P</span><span id="phylabLatPowerVal">' + s.powerW + ' W</span></div>'
      +   '<input type="range" class="phylab-slider" id="phylabLatPower" min="100" max="1000" step="50" value="' + s.powerW + '">'
      + '</div>'
      + '<button class="phylab-btn" id="phylabLatStart" type="button"><span>啟動電熱器</span></button>'
      + '<div class="phylab-readout">'
      +   '<div class="phylab-readout-label">模擬時間 t</div>'
      +   '<div class="phylab-readout-value" id="phylabLatTimer">0<span class="phylab-readout-unit">s</span></div>'
      + '</div>'
      + '<div class="phylab-readout">'
      +   '<div class="phylab-readout-label">已轉化質量</div>'
      +   '<div class="phylab-readout-value" id="phylabLatMelted" style="color:#10b981;">0.00<span class="phylab-readout-unit">kg</span></div>'
      + '</div>'
      + '<button class="phylab-btn success" id="phylabLatRecord" type="button"><span>記錄數據</span></button>'
      + '<div class="phylab-lab-panel-title" style="margin-top:16px;">數據記錄</div>'
      + '<div id="phylabLatData"></div>'
      + '<button class="phylab-btn secondary" id="phylabLatClear" type="button" style="margin-top:8px;"><span>清空數據</span></button>';

    P10_$("phylabStepText").textContent = "步驟 1：選擇類型與質量，啟動電熱器";
    this.renderSVG();
    this.renderData();
    this.bindControls();
    this.updateReadouts();
  },
  renderSVG: function () {
    var svg = P10_$("phylabLatSVG");
    if (!svg) return;
    var s = this.state;
    var meltPct = Math.min(1, s.meltedKg / s.massKg);

    var fillColor, topColor, label;
    if (s.type === "fusion") {
      fillColor = "rgba(96,165,250,0.6)";
      topColor = "rgba(219,234,254,0.85)";
      label = "ICE / WATER";
    } else {
      fillColor = "rgba(96,165,250,0.6)";
      topColor = "rgba(255,255,255,0.4)";
      label = "WATER / STEAM";
    }
    var iceHeight = 90 * (1 - meltPct);
    var waterHeight = 90 - iceHeight;

    svg.innerHTML = ''
      + '<defs><pattern id="phylabLatGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99,102,241,0.05)" stroke-width="1"/></pattern></defs>'
      + '<rect width="700" height="420" fill="url(#phylabLatGrid)"/>'
      + '<rect x="240" y="100" width="220" height="220" rx="10" fill="rgba(30,41,59,0.3)" stroke="#475569" stroke-width="2"/>'
      + '<rect x="245" y="' + (100 + 220 - 90) + '" width="210" height="90" rx="8" fill="' + fillColor + '"/>';
    if (iceHeight > 0) {
      svg.innerHTML += '<rect x="245" y="' + (100 + 220 - 90 - iceHeight) + '" width="210" height="' + iceHeight + '" rx="8" fill="' + topColor + '"/>';
    }
    svg.innerHTML += ''
      + '<rect x="330" y="40" width="40" height="70" fill="#1e293b" stroke="#475569" stroke-width="1.5" rx="4"/>'
      + '<text x="350" y="80" font-size="12" fill="#a5b4fc" text-anchor="middle" font-family="monospace">' + s.powerW + 'W</text>'
      + '<line x1="350" y1="110" x2="350" y2="200" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>'
      + (s.running ? '<circle cx="350" cy="215" r="8" fill="#ef4444" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="0.8s" repeatCount="indefinite"/></circle>' : '')
      + '<text x="350" y="345" font-size="11" fill="#cbd5e1" text-anchor="middle" font-weight="700" font-family="monospace">' + label + '</text>'
      + '<rect x="30" y="30" width="190" height="100" rx="8" fill="rgba(15,23,42,0.78)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>'
      + '<text x="45" y="52" font-size="10" fill="#64748b" font-family="monospace">L = Pt / m</text>'
      + '<text x="45" y="72" font-size="10" fill="#64748b" font-family="monospace">m_total = ' + s.massKg.toFixed(2) + ' kg</text>'
      + '<text x="45" y="90" font-size="10" fill="#64748b" font-family="monospace">P = ' + s.powerW + ' W</text>'
      + '<text x="45" y="108" font-size="10" fill="#64748b" font-family="monospace">t = ' + Math.round(s.simSec) + ' s</text>';
  },
  updateReadouts: function () {
    var s = this.state;
    var tEl = P10_$("phylabLatTimer");
    if (tEl) tEl.innerHTML = Math.round(s.simSec) + '<span class="phylab-readout-unit">s</span>';
    var mEl = P10_$("phylabLatMelted");
    if (mEl) mEl.innerHTML = s.meltedKg.toFixed(3) + '<span class="phylab-readout-unit">kg</span>';
  },
  startAnimation: function () {
    var myGen = ++this.state.animGen;
    var self = this;
    function loop() {
      if (self.state.animGen !== myGen) return;
      if (!P10_$("phylabLatSVG")) return;
      if (self.state.running) {
        var elapsedReal = (Date.now() - self.state.realStartMs) / 1000;
        self.state.simSec = elapsedReal * 30;
        var L = self.getL();
        self.state.meltedKg = Math.min(self.state.massKg, (self.state.powerW * self.state.simSec) / L);
        self.renderSVG();
        self.updateReadouts();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  },
  bindControls: function () {
    var self = this;

    var fusBtn = P10_$("phylabLatFus");
    var vapBtn = P10_$("phylabLatVap");
    if (fusBtn && vapBtn) {
      fusBtn.addEventListener("click", function () {
        self.state.type = "fusion";
        self.state.meltedKg = 0;
        self.state.simSec = 0;
        self.state.running = false;
        self.state.data = [];
        self.state.animGen++;
        self.render();
      });
      vapBtn.addEventListener("click", function () {
        self.state.type = "vaporization";
        self.state.meltedKg = 0;
        self.state.simSec = 0;
        self.state.running = false;
        self.state.data = [];
        self.state.animGen++;
        self.render();
      });
    }

    var massS = P10_$("phylabLatMass");
    if (massS) {
      massS.addEventListener("input", function () {
        self.state.massKg = parseFloat(this.value);
        P10_$("phylabLatMassVal").textContent = self.state.massKg.toFixed(2) + " kg";
        self.renderSVG();
      });
    }

    var powerS = P10_$("phylabLatPower");
    if (powerS) {
      powerS.addEventListener("input", function () {
        self.state.powerW = parseInt(this.value, 10);
        P10_$("phylabLatPowerVal").textContent = self.state.powerW + " W";
        self.renderSVG();
      });
    }

    var startBtn = P10_$("phylabLatStart");
    if (startBtn) {
      startBtn.addEventListener("click", function () {
        self.state.running = !self.state.running;
        if (self.state.running) {
          self.state.realStartMs = Date.now() - (self.state.simSec / 30) * 1000;
          startBtn.querySelector("span").textContent = "停止加熱";
        } else {
          startBtn.querySelector("span").textContent = "啟動電熱器";
        }
      });
    }

    var recBtn = P10_$("phylabLatRecord");
    if (recBtn) {
      recBtn.addEventListener("click", function () {
        if (self.state.meltedKg <= 0) {
          if (typeof PHYLAB_toast === "function") PHYLAB_toast("請先啟動電熱器加熱一段時間", "warn");
          return;
        }
        self.state.data.push({
          t: self.state.simSec,
          m: self.state.meltedKg
        });
        self.renderData();
        P10_$("phylabStepText").textContent = "步驟 3：已記錄 " + self.state.data.length + " 組數據（建議 3 組以上）";
      });
    }

    var clrBtn = P10_$("phylabLatClear");
    if (clrBtn) {
      clrBtn.addEventListener("click", function () {
        self.state.data = [];
        self.renderData();
      });
    }

    this.startAnimation();
  },
  renderData: function () {
    var el = P10_$("phylabLatData");
    if (!el) return;
    var d = this.state.data;
    if (d.length === 0) {
      el.innerHTML = '<table class="phylab-data-table"><tr class="empty"><td>尚未記錄任何數據</td></tr></table>';
      return;
    }
    var html = '<table class="phylab-data-table"><thead><tr><th>t(s)</th><th>m(kg)</th></tr></thead><tbody>';
    for (var i = 0; i < d.length; i++) {
      html += '<tr><td>' + d[i].t.toFixed(0) + '</td><td>' + d[i].m.toFixed(3) + '</td></tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  },
  score: function () {
    var d = this.state.data;
    if (d.length < 1) return { error: "請先記錄至少 1 組數據" };
    var last = d[d.length - 1];
    if (last.m < 0.05) return { error: "轉化質量太少，無法準確計算。請加熱久一點。" };

    var LReal = this.getL();
    var LMeasured = (this.state.powerW * last.t) / last.m;
    var expected = LReal;
    var errorPct = Math.abs(LMeasured - expected) / expected * 100;
    var score;
    if (errorPct < 3) score = 100;
    else if (errorPct < 8) score = 90;
    else if (errorPct < 15) score = 75;
    else if (errorPct < 25) score = 55;
    else score = 30;
    var advice = [];
    var typeName = this.state.type === "fusion" ? "熔化" : "汽化";
    advice.push("使用公式：L = Pt / m。代入 P = " + this.state.powerW + " W, t = " + last.t.toFixed(0) + " s, m = " + last.m.toFixed(3) + " kg");
    if (errorPct < 8) {
      advice.push(typeName + "潛熱結果良好！你的 L 值接近標準值 " + expected.toLocaleString() + " J kg-1。");
    } else {
      advice.push("誤差較大。請確認容器保溫良好，避免外界熱能進入影響量度。");
    }
    if (this.state.type === "vaporization") {
      advice.push("注意：水蒸氣容易被冷凝成水滴回到容器，導致計算出的 L 值偏小。");
    }
    return {
      score: score, measured: LMeasured, expected: expected,
      unit: this.unit, errorPct: errorPct, advice: advice
    };
  }
};

console.log("[Part 10] Added 2 heat experiments: shc, latent");

})();
</script>

<script>
(function () {
"use strict";

function P11_$(id) { return document.getElementById(id); }

var registry = window.PHYLAB_experiments;
if (!registry) {
  console.error("[Part 11] PHYLAB_experiments 未開放");
  return;
}

function P11_esc(s) {
  var str = String(s), out = "";
  for (var i = 0; i < str.length; i++) {
    var c = str.charAt(i);
    if (c === "&") out += "&amp;";
    else if (c === "<") out += "&lt;";
    else if (c === ">") out += "&gt;";
    else if (c === '"') out += "&quot;";
    else out += c;
  }
  return out;
}

function P11_equip(name) {
  return '<div class="phylab-equip-item">'
    + '<div class="phylab-equip-icon">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/></svg>'
    + '</div><span>' + P11_esc(name) + '</span></div>';
}

/* ===================================================
   Experiment 6: Boyle's Law
   =================================================== */
registry.boyle = {
  id: "boyle",
  title_zh: "波以耳定律",
  title_en: "Boyle's Law",
  desc_zh: "固定質量氣體在恆溫下，pV = 常數",
  desc_en: "For fixed mass of gas at constant T, pV = constant",
  difficulty: 2,
  unit: "kPa",
  state: {
    realVolumeML: 40,   // mL, controlled by syringe
    temperatureC: 25,
    data: [],
    animGen: 0
  },
  reset: function () {
    this.state = { realVolumeML: 40, temperatureC: 25, data: [], animGen: 0 };
  },
  constantK: 4000,  // p * V = 4000 (kPa·mL) => at V=40, p=100 kPa
  getP: function () {
    return this.constantK / this.state.realVolumeML;
  },
  previewSVG: function () {
    return '<svg viewBox="0 0 200 120" preserveAspectRatio="xMidYMid meet">'
      + '<rect x="70" y="20" width="60" height="80" rx="4" fill="none" stroke="#4f46e5" stroke-width="2"/>'
      + '<rect x="75" y="30" width="50" height="20" rx="2" fill="rgba(99,102,241,0.3)"/>'
      + '<rect x="85" y="10" width="30" height="15" rx="3" fill="#334155"/>'
      + '<rect x="135" y="55" width="20" height="20" rx="3" fill="#ef4444" opacity="0.7"/>'
      + '<text x="100" y="115" font-size="10" fill="#6366f1" text-anchor="middle" font-family="monospace" font-weight="700">pV = constant</text>'
      + '</svg>';
  },
  equipItem: P11_equip,
  render: function () {
    P11_$("phylabLabLeft").innerHTML = '<div class="phylab-lab-panel-title">儀器與材料</div>'
      + this.equipItem("注射器") + this.equipItem("壓力計") + this.equipItem("密封帽")
      + this.equipItem("溫度計");

    P11_$("phylabLabCenter").innerHTML = '<div class="phylab-workspace">'
      + '<svg id="phylabBoyleSVG" viewBox="0 0 700 420" preserveAspectRatio="xMidYMid meet"></svg>'
      + '</div>';

    P11_$("phylabLabRight").innerHTML = ''
      + '<div class="phylab-lab-panel-title">操作面板</div>'
      + '<div class="phylab-control">'
      +   '<div class="phylab-control-label"><span>體積 V</span><span id="phylabBoyleVVal">' + this.state.realVolumeML + ' mL</span></div>'
      +   '<input type="range" class="phylab-slider" id="phylabBoyleVol" min="10" max="80" step="1" value="' + this.state.realVolumeML + '">'
      + '</div>'
      + '<div class="phylab-readout">'
      +   '<div class="phylab-readout-label">壓力 p</div>'
      +   '<div class="phylab-readout-value" id="phylabBoyleP">100<span class="phylab-readout-unit">kPa</span></div>'
      + '</div>'
      + '<div class="phylab-readout">'
      +   '<div class="phylab-readout-label">p × V</div>'
      +   '<div class="phylab-readout-value" id="phylabBoylePV" style="color:#10b981;">4000</div>'
      + '</div>'
      + '<button class="phylab-btn success" id="phylabBoyleRecord" type="button" style="margin-top:12px;"><span>記錄數據</span></button>'
      + '<div class="phylab-lab-panel-title" style="margin-top:16px;">數據記錄</div>'
      + '<div id="phylabBoyleData"></div>'
      + '<button class="phylab-btn secondary" id="phylabBoyleClear" type="button" style="margin-top:8px;"><span>清空數據</span></button>';

    P11_$("phylabStepText").textContent = "步驟 1：改變體積，觀察壓力變化";
    this.renderSVG();
    this.renderData();
    this.updateReadouts();
    this.bindControls();
  },
  renderSVG: function () {
    var svg = P11_$("phylabBoyleSVG");
    if (!svg) return;
    var s = this.state;
    var V = s.realVolumeML;
    var p = this.getP();

    /* Map V 10-80 mL to syringe barrel fill level */
    var fillPct = (V - 10) / 70;
    var barrelTop = 80, barrelBot = 340, barrelH = barrelBot - barrelTop;
    var gasH = barrelH * fillPct;
    var plungerY = barrelBot - gasH;

    /* Gauge needle: p from 50 to 400 kPa -> -60 to +60 degrees */
    var needleDeg = -60 + ((p - 50) / 350) * 120;
    needleDeg = Math.max(-60, Math.min(60, needleDeg));

    svg.innerHTML = ''
      + '<defs>'
      +   '<pattern id="phylabBoyleGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99,102,241,0.05)" stroke-width="1"/></pattern>'
      +   '<linearGradient id="phylabBoyleGas" x1="0%" y1="0%" x2="0%" y2="100%">'
      +     '<stop offset="0%" stop-color="rgba(99,102,241,0.35)"/>'
      +     '<stop offset="100%" stop-color="rgba(99,102,241,0.6)"/>'
      +   '</linearGradient>'
      + '</defs>'
      + '<rect width="700" height="420" fill="url(#phylabBoyleGrid)"/>'

      /* Syringe barrel */
      + '<rect x="200" y="' + barrelTop + '" width="120" height="' + barrelH + '" rx="6" fill="rgba(30,41,59,0.35)" stroke="#475569" stroke-width="2"/>'
      /* Gas fill */
      + '<rect x="204" y="' + plungerY + '" width="112" height="' + gasH + '" rx="4" fill="url(#phylabBoyleGas)"/>'
      /* Gas molecules (small dots) */
      + this.renderMolecules(204, plungerY, 112, gasH)

      /* Plunger */
      + '<rect x="196" y="' + (plungerY - 12) + '" width="128" height="14" rx="3" fill="#64748b"/>'
      + '<rect x="236" y="' + (plungerY - 30) + '" width="48" height="18" rx="3" fill="#334155"/>'

      /* Sealed cap at bottom */
      + '<rect x="196" y="' + (barrelBot) + '" width="128" height="12" rx="3" fill="#64748b"/>'

      /* Connecting tube to gauge */
      + '<path d="M 320 ' + (barrelBot - 30) + ' Q 380 ' + (barrelBot - 30) + ' 400 220" stroke="#475569" stroke-width="3" fill="none"/>'

      /* Pressure gauge */
      + '<g transform="translate(490,200)">'
      +   '<circle r="80" fill="#0f172a" stroke="#4f46e5" stroke-width="3"/>'
      +   '<circle r="72" fill="none" stroke="#1e293b" stroke-width="1"/>'
      /* Tick marks */
      +   this.renderGaugeTicks()
      /* Needle */
      +   '<line x1="0" y1="0" x2="' + (Math.sin(needleDeg * Math.PI / 180) * 60).toFixed(1) + '" y2="' + (-Math.cos(needleDeg * Math.PI / 180) * 60).toFixed(1) + '" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>'
      +   '<circle r="6" fill="#ef4444"/>'
      +   '<text y="-40" font-size="10" fill="#64748b" text-anchor="middle" font-family="monospace">PRESSURE</text>'
      +   '<text y="40" font-size="20" fill="#a5b4fc" text-anchor="middle" font-family="monospace" font-weight="700">' + p.toFixed(1) + '</text>'
      +   '<text y="58" font-size="11" fill="#64748b" text-anchor="middle" font-family="monospace">kPa</text>'
      + '</g>'

      /* Info box */
      + '<rect x="30" y="30" width="150" height="90" rx="8" fill="rgba(15,23,42,0.78)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>'
      + '<text x="45" y="52" font-size="10" fill="#64748b" font-family="monospace">pV = k</text>'
      + '<text x="45" y="72" font-size="10" fill="#64748b" font-family="monospace">V = ' + V + ' mL</text>'
      + '<text x="45" y="90" font-size="10" fill="#64748b" font-family="monospace">p = ' + p.toFixed(1) + ' kPa</text>'
      + '<text x="45" y="108" font-size="10" fill="#10b981" font-family="monospace">pV = ' + (p * V).toFixed(0) + '</text>';
  },
  renderMolecules: function (x, y, w, h) {
    var out = '';
    /* deterministic pattern */
    var seed = 1;
    function rng() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    var n = Math.max(3, Math.floor(h / 15));
    for (var i = 0; i < n; i++) {
      var mx = x + 8 + rng() * (w - 16);
      var my = y + 8 + rng() * (h - 16);
      out += '<circle cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="2.5" fill="#a5b4fc" opacity="0.7"/>';
    }
    return out;
  },
  renderGaugeTicks: function () {
    var out = '';
    for (var i = -60; i <= 60; i += 30) {
      var rad = i * Math.PI / 180;
      var x1 = Math.sin(rad) * 55;
      var y1 = -Math.cos(rad) * 55;
      var x2 = Math.sin(rad) * 66;
      var y2 = -Math.cos(rad) * 66;
      out += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#64748b" stroke-width="1.5"/>';
    }
    return out;
  },
  updateReadouts: function () {
    var p = this.getP();
    var pEl = P11_$("phylabBoyleP");
    if (pEl) pEl.innerHTML = p.toFixed(1) + '<span class="phylab-readout-unit">kPa</span>';
    var pvEl = P11_$("phylabBoylePV");
    if (pvEl) pvEl.textContent = (p * this.state.realVolumeML).toFixed(0);
  },
  bindControls: function () {
    var self = this;
    var volS = P11_$("phylabBoyleVol");
    if (volS) {
      volS.addEventListener("input", function () {
        self.state.realVolumeML = parseInt(this.value, 10);
        P11_$("phylabBoyleVVal").textContent = self.state.realVolumeML + " mL";
        self.renderSVG();
        self.updateReadouts();
      });
    }
    var recBtn = P11_$("phylabBoyleRecord");
    if (recBtn) {
      recBtn.addEventListener("click", function () {
        self.state.data.push({
          V: self.state.realVolumeML,
          p: self.getP(),
          pV: self.getP() * self.state.realVolumeML
        });
        self.renderData();
        P11_$("phylabStepText").textContent = "步驟 2：已記錄 " + self.state.data.length + " 組數據（建議 5 組以上）";
      });
    }
    var clrBtn = P11_$("phylabBoyleClear");
    if (clrBtn) {
      clrBtn.addEventListener("click", function () {
        self.state.data = [];
        self.renderData();
      });
    }
  },
  renderData: function () {
    var el = P11_$("phylabBoyleData");
    if (!el) return;
    var d = this.state.data;

    var pvValues = d.map(function (x) { return x.pV; });
    var avg = pvValues.reduce(function (a, b) { return a + b; }, 0) / pvValues.length;
    var maxDev = 0;
    for (var i = 0; i < pvValues.length; i++) {
      maxDev = Math.max(maxDev, Math.abs(pvValues[i] - avg) / avg * 100);
    }
    var expected = this.constantK;
    var errorPct = Math.abs(avg - expected) / expected * 100;

    var score;
    if (errorPct < 2) score = 100;
    else if (errorPct < 5) score = 90;
    else if (errorPct < 10) score = 75;
    else if (errorPct < 20) score = 55;
    else score = 30;

    advice.push("波以耳定律：恆溫下 pV = 常數。你的平均 pV = " + avg.toFixed(0) + " kPa·mL");

      advice.push("各組 pV 值非常穩定（最大偏差 " + maxDev.toFixed(1) + "%），實驗做得很好！");
