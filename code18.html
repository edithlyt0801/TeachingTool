      advice.push("各組 pV 值偏差較大（最大偏差 " + maxDev.toFixed(1) + "%）。請確認氣體溫度穩定。");
    }
    advice.push("注意：壓縮氣體時溫度會略為上升，需等待溫度回復後才讀數。");
    return {
      score: score, measured: avg, expected: expected,
      unit: "kPa·mL", errorPct: errorPct, advice: advice
    };
  }
};

    var d = this.state.data;
    if (d.length < 3) return { error: "請至少記錄 3 組數據" };

    /* Linear regression: h = (g/2) t² => slope = g/2, so g = 2 * slope */
    var n = d.length;
    var sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
    for (var i = 0; i < n; i++) {

      sumY += d[i].h;
      sumXY += d[i].t2 * d[i].h;
      sumXX += d[i].t2 * d[i].t2;

    var slope = (n * sumXY - sumX * sumY) / denom;
    var gMeasured = 2 * slope;

    else if (errorPct < 10) score = 75;

    return {
      score: score, measured: gMeasured, expected: expected,
      unit: this.unit, errorPct: errorPct, advice: advice
    };
  }
};

      html += '<tr><td>' + d[i].M.toFixed(2) + '</td><td>' + d[i].F.toFixed(3) + '</td><td>' + d[i].a.toFixed(3) + '</td></tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  },
  score: function () {
    var d = this.state.data;
    if (d.length < 3) return { error: "請至少記錄 3 組數據" };

    /* Least squares: F = Ma + c. For ideal case c = 0. Check slope = M. */
    /* Better: use fixed M across all, vary F, plot a vs F: slope = 1/M */
    /* Simpler check: verify max deviation of F/(M*a) from 1 */
    var ratios = d.map(function (x) { return x.F / (x.M * x.a); });
    var avgRatio = ratios.reduce(function (a, b) { return a + b; }, 0) / ratios.length;
    var maxDev = 0;
    for (var i = 0; i < ratios.length; i++) {
      maxDev = Math.max(maxDev, Math.abs(ratios[i] - avgRatio) / avgRatio * 100);
    }
    var expected = 1.0;
    var errorPct = Math.abs(avgRatio - expected) / expected * 100;

    var score;
    if (errorPct < 2) score = 100;
    else if (errorPct < 5) score = 90;
    else if (errorPct < 10) score = 75;
    else if (errorPct < 20) score = 55;
    else score = 30;

    var advice = [];
    advice.push("牛頓第二定律：F = ma。理論上 F/(Ma) = 1。你的平均比值 = " + avgRatio.toFixed(3));
    if (maxDev < 5) {
      advice.push("數據非常一致（最大偏差 " + maxDev.toFixed(1) + "%），實驗做得很好！");
    } else {
      advice.push("數據偏差較大（" + maxDev.toFixed(1) + "%）。建議使用相同 M 而只改變 F，得到單一直線。");
    }
    advice.push("注意：實際實驗需先做「摩擦補償」（略斜跑道），否則 a 會比理論值小。");
    return {
      score: score, measured: avgRatio, expected: expected,
      unit: "(F/Ma)", errorPct: errorPct, advice: advice
    };
  }
};

    var errPct = Math.abs(last.pB - last.pA) / Math.abs(last.pB) * 100;
    var score;
    if (errPct < 1) score = 100;
    else if (errPct < 2) score = 90;
    else if (errPct < 5) score = 75;
    else score = 55;

    var advice = [];
    advice.push("動量守恆：m1u1 + m2u2 = m1v1 + m2v2。你的碰撞前動量 " + last.pB.toFixed(3) + " kg m/s，碰撞後 " + last.pA.toFixed(3) + " kg m/s。");
    if (errPct < 2) {
      advice.push("動量守恆驗證成功！碰撞前後動量相等。");
    } else {
      advice.push("動量偏差 " + errPct.toFixed(2) + "%。實際實驗中需注意氣軌水平與摩擦力。");
    }
    if (this.state.collisionType === "inelastic") {
      advice.push("完全非彈性碰撞：兩車碰撞後合為一體，動量守恆但動能不守恆。");

      advice.push("彈性碰撞：動量與動能均守恆。");
    }
    return {
      score: score, measured: last.pA, expected: last.pB,
      unit: "kg m s-1", errorPct: errPct, advice: advice
    };
  }
};

    else if (errorPct < 5) score = 90;
    else if (errorPct < 10) score = 75;

      unit: this.unit, errorPct: errorPct, advice: advice

      var r = self.getAngleR();
      self.state.data.push({ i: i, r: r, ratio: Math.sin(i * Math.PI/180) / Math.sin(r * Math.PI/180) });
      self.renderData();
      P13_$("phylabStepText").textContent = "步驟 2：已記錄 " + self.state.data.length + " 組數據（建議 5 組以上）";
    });

    if (clrBtn) clrBtn.addEventListener("click", function () {

      self.renderData();

    var el = P13_$("phylabRefData");
    if (!el) return;
    var d = this.state.data;
    if (d.length === 0) {
      el.innerHTML = '<table class="phylab-data-table"><tr class="empty"><td>尚未記錄任何數據</td></tr></table>';
      return;
    }
    var html = '<table class="phylab-data-table"><thead><tr><th>i</th><th>r</th><th>sin i/sin r</th></tr></thead><tbody>';

      html += '<tr><td>' + d[i].i + '°</td><td>' + d[i].r.toFixed(1) + '°</td><td>' + d[i].ratio.toFixed(3) + '</td></tr>';

  score: function () {
    var d = this.state.data;
    if (d.length < 3) return { error: "請至少記錄 3 組數據" };
    /* Linear regression: sin i = n sin r, slope = n */
    var n = d.length;
    var sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
    for (var i = 0; i < n; i++) {
      var x = Math.sin(d[i].r * Math.PI / 180);
      var y = Math.sin(d[i].i * Math.PI / 180);
      sumX += x; sumY += y; sumXY += x * y; sumXX += x * x;
    }
    var denom = n * sumXX - sumX * sumX;
    if (Math.abs(denom) < 1e-9) return { error: "數據不足" };
    var slope = (n * sumXY - sumX * sumY) / denom;
    var nMeasured = slope;
    var expected = this.state.nReal;
    var errorPct = Math.abs(nMeasured - expected) / expected * 100;
    var score;
    if (errorPct < 2) score = 100;
    else if (errorPct < 5) score = 90;
    else if (errorPct < 10) score = 75;
    else if (errorPct < 20) score = 55;
    else score = 30;
    var advice = [];
    advice.push("使用 Snell 定律：n = sin i / sin r。作 sin i 對 sin r 圖，斜率 = n。");
    if (d.length < 5) advice.push("只有 " + d.length + " 組數據，建議 5 組以上。");
    if (errorPct < 5) advice.push("結果良好！你的 n 值非常接近玻璃標準值。");
    else advice.push("誤差較大。請注意光線是否準確對齊玻璃磚中心，並使用光學針確認入射角。");
    advice.push("注意：出射光線與入射光線平行（因玻璃磚兩面平行），但橫向位移。");
    return {
      score: score, measured: nMeasured, expected: expected,
      unit: this.unit, errorPct: errorPct, advice: advice
    };
  }
};

  renderSVG: function () {

    var i = this.state.angleI;

    var cx = 350, cy = 260, radius = 130;

    /* Ray path: from curved surface bottom, through centre, hits flat surface */
    /* Then either refracts out (i < c) or TIR (i >= c) */

    var iRad = i * Math.PI / 180;

    /* Incoming ray inside glass: comes from below along direction */
    /* Direction: from (cx - R*sin(i), cy + R*cos(i)) to (cx, cy) then to flat surface */
    /* Actually let's simplify: incoming ray inside glass enters perpendicular at bottom of arc */
    /* Then it's along the radius to centre, and reaches flat surface at angle i from normal */

    /* Actually the standard demo: ray enters from curved surface always normal (through centre) */
    /* Then at flat surface, angle of incidence = angle of ray from normal */
    /* Let me place centre of semicircle at (cx, cy), flat side on top */
    /* Ray comes up from bottom, enters curved surface, goes to centre-ish, hits flat side */

    /* At curved surface, it enters radially (no refraction) since it points at centre */
    /* Then inside glass it hits flat surface from below at angle i */

    var incX = cx - radius * Math.sin(iRad);

    /* Angle i arc from normal */
    html += '<path d="' + arc(cx, cy, 40, -iRad, 0) + '" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>';
    html += '<text x="' + (cx - 30 * Math.sin(iRad) - 14) + '" y="' + (cy + 22 * Math.cos(iRad)) + '" font-size="11" fill="#fbbf24" font-family="monospace" font-weight="700">i=' + i + '°</text>';

  startCanvas: function () {
    var self = this;
    var canvas = P13_$("phylabRippleCanvas");
    if (!canvas) return;
    var W = 350, H = 210;
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext("2d");
    var startMs = Date.now();

    function frame() {
      if (!P13_$("phylabRippleCanvas")) return;
      var t = (Date.now() - startMs) / 1000;
      self.drawScene(ctx, W, H, t);
      requestAnimationFrame(frame);
    }
    frame();
  },
  drawScene: function (ctx, W, H, t) {
    var s = this.state;
    var freq = s.frequency;
    ctx.fillStyle = "#0b1220";
    ctx.fillRect(0, 0, W, H);

    if (s.mode === "reflection") this.drawReflection(ctx, W, H, t, freq);
    else if (s.mode === "refraction") this.drawRefraction(ctx, W, H, t, freq);
    else if (s.mode === "diffraction") this.drawDiffraction(ctx, W, H, t, freq);
    else if (s.mode === "interference") this.drawInterference(ctx, W, H, t, freq);
  },
  drawReflection: function (ctx, W, H, t, freq) {
    /* Tilted barrier at 45° in right portion */
    var bx1 = W * 0.75, by1 = H * 0.15;
    var bx2 = W * 0.55, by2 = H * 0.85;

    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(bx1, by1);
    ctx.lineTo(bx2, by2);
    ctx.stroke();

    /* Plane wave incoming from left */
    var speed = freq * 20;
    var wavelength = 40;
    var phase = (t * speed) % wavelength;

    ctx.strokeStyle = "rgba(251,191,36,0.7)";
    ctx.lineWidth = 1.5;
    for (var x = phase; x < W; x += wavelength) {
      /* Clip by barrier: only draw if left of barrier */
      var xMax = x;
      /* Simple approach: draw line then it appears behind barrier */
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }

    /* Reflected wave */
    ctx.strokeStyle = "rgba(239,68,68,0.5)";
    ctx.lineWidth = 1.5;
    /* Reflected waves travel left-up direction; draw diagonal lines from barrier */
    var phase2 = ((t * speed) % wavelength + wavelength) % wavelength;
    for (var d = phase2; d < W; d += wavelength) {
      ctx.beginPath();
      /* Line at 45° starting from barrier */
      ctx.moveTo(bx1 - d * 0.7, 0 + d * 0.7);
      ctx.lineTo(bx1 - d * 0.7 + 100, 0 + d * 0.7 - 100);
      ctx.stroke();
    }

    /* Label */
    ctx.fillStyle = "#64748b";
    ctx.font = "10px monospace";
    ctx.fillText("Incident", 20, 20);
    ctx.fillStyle = "#94a3b8";
    ctx.fillText("Reflected", 20, 36);
    ctx.fillStyle = "#475569";
    ctx.fillText("Barrier (45°)", W * 0.55, H * 0.95);
  },
  drawRefraction: function (ctx, W, H, t, freq) {
    /* Two regions: deep (top half), shallow (bottom half) */
    var boundaryY = H / 2;

    /* Shallow region background */
    ctx.fillStyle = "rgba(96,165,250,0.1)";
    ctx.fillRect(0, boundaryY, W, H - boundaryY);

    ctx.strokeStyle = "#6366f1";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, boundaryY);
    ctx.lineTo(W, boundaryY);
    ctx.stroke();

    var speed = freq * 20;
    var wlDeep = 50;
    var wlShallow = 25; /* shorter in shallow water */

    var phaseDeep = (t * speed) % wlDeep;
    var phaseShallow = (t * speed) % wlShallow;

    /* Deep region: horizontal wavefronts */
    ctx.strokeStyle = "rgba(251,191,36,0.7)";
    ctx.lineWidth = 1.5;
    for (var y = phaseDeep; y < boundaryY; y += wlDeep) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    /* Shallow region: shorter wavefronts */
    ctx.strokeStyle = "rgba(16,185,129,0.7)";
    for (var y2 = boundaryY + phaseShallow; y2 < H; y2 += wlShallow) {
      ctx.beginPath();
      ctx.moveTo(0, y2);
      ctx.lineTo(W, y2);
      ctx.stroke();
    }

    ctx.fillStyle = "#64748b";
    ctx.font = "10px monospace";
    ctx.fillText("Deep (faster)", 20, 20);
    ctx.fillStyle = "#10b981";
    ctx.fillText("Shallow (slower)", 20, boundaryY + 20);
  },
  drawDiffraction: function (ctx, W, H, t, freq) {
    /* Barrier with gap in middle */
    var barrierY = H * 0.45;
    var gapX1 = W * 0.45;
    var gapX2 = W * 0.55;

    /* Barrier lines */
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, barrierY);
    ctx.lineTo(gapX1, barrierY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(gapX2, barrierY);
    ctx.lineTo(W, barrierY);
    ctx.stroke();

    var speed = freq * 20;
    var wavelength = 30;
    var phase = (t * speed) % wavelength;

    /* Plane waves above */
    ctx.strokeStyle = "rgba(251,191,36,0.7)";
    ctx.lineWidth = 1.5;
    for (var y = phase; y < barrierY; y += wavelength) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    /* Circular waves from gap below */
    ctx.strokeStyle = "rgba(239,68,68,0.6)";
    var gapCx = (gapX1 + gapX2) / 2;
    var phase2 = (t * speed) % wavelength;
    for (var r = phase2; r < H; r += wavelength) {
      ctx.beginPath();
      ctx.arc(gapCx, barrierY, r, 0, Math.PI, false);
      ctx.stroke();
    }

    ctx.fillStyle = "#64748b";
    ctx.font = "10px monospace";
    ctx.fillText("Plane wave", 20, 20);
    ctx.fillStyle = "#94a3b8";
    ctx.fillText("Circular waves from gap", 20, H - 20);
    ctx.fillStyle = "#475569";
    ctx.fillText("Gap width ≈ λ", W * 0.45, barrierY - 8);
  },
  drawInterference: function (ctx, W, H, t, freq) {
    var s1x = W * 0.35, s1y = H * 0.5;
    var s2x = W * 0.65, s2y = H * 0.5;

    /* Source markers */
    ctx.fillStyle = "#4f46e5";
    ctx.beginPath(); ctx.arc(s1x, s1y, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(s2x, s2y, 4, 0, Math.PI * 2); ctx.fill();

    var speed = freq * 20;
    var wavelength = 30;
    var phase = (t * speed) % wavelength;

    /* Wavefronts from source 1 */
    ctx.strokeStyle = "rgba(251,191,36,0.6)";
    ctx.lineWidth = 1.5;
    for (var r = phase; r < Math.max(W, H); r += wavelength) {
      ctx.beginPath(); ctx.arc(s1x, s1y, r, 0, Math.PI * 2); ctx.stroke();
    }

    /* Wavefronts from source 2 */
    ctx.strokeStyle = "rgba(96,165,250,0.6)";
    for (var r2 = phase; r2 < Math.max(W, H); r2 += wavelength) {
      ctx.beginPath(); ctx.arc(s2x, s2y, r2, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.fillStyle = "#64748b";
    ctx.font = "10px monospace";
    ctx.fillText("Two coherent sources (in phase)", 20, 20);
    ctx.fillStyle = "#a5b4fc";
    ctx.fillText("Bright = constructive  |  Dark = destructive", 20, H - 20);
  },
  bindControls: function () {
    var self = this;
    var modes = [
      { btnId: "phylabRipRefl", mode: "reflection", label: "反射" },

        btn.addEventListener("click", function () {
          self.state.mode = m.mode;

            buttons[k].style.background = buttons[k] === btn ? "linear-gradient(135deg,#6366f1,#7c3aed)" : "";
          }
          P13_$("phylabRipMode").textContent = m.label;

    }

    if (buttons.reflection) buttons.reflection.style.background = "linear-gradient(135deg,#6366f1,#7c3aed)";

      var mode = self.state.mode;

        return;

      self.state.visited[mode] = true;

      var total = Object.keys(self.state.visited).length;
      P13_$("phylabStepText").textContent = "步驟 2：已記錄 " + total + " / 4 個模式";

    });
    this.updateStep();
  },
  updateStep: function () {
    var modeNames = { reflection: "反射", refraction: "折射", diffraction: "繞射", interference: "干涉" };
    P13_$("phylabStepText").textContent = "目前模式：" + (modeNames[this.state.mode] || this.state.mode) + "，觀察後點「記錄觀察」";

    /* I-V graph axes: origin at (480, 380), x: -3..5V -> 0..180px, y: -0.5..1.5A -> 90..0px */

    var gx_min = -3, gx_max = 5;

    var points = "";
    for (var v = gx_min; v <= gx_max; v += 0.1) {

      s0.voltage = v;
      var iVal = this.getCurrent();

      + '<path d="M ' + loopX1 + ' ' + loopY2 + ' L ' + loopX1 + ' ' + loopY1 + '" stroke="#475569" stroke-width="2"/>'

      +   '<text y="-4" font-size="10" fill="#a5b4fc" text-anchor="middle" font-family="monospace">A</text>'
      +   '<text y="14" font-size="11" fill="#c7d2fe" text-anchor="middle" font-family="monospace" font-weight="700">' + I.toFixed(3) + '</text>'
      + '</g>'

      /* Voltmeter (parallel across component) */
      + '<g transform="translate(480,' + loopY1 + ')">'
      +   '<circle r="22" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>'
      +   '<text y="-4" font-size="10" fill="#a5b4fc" text-anchor="middle" font-family="monospace">V</text>'
      +   '<text y="14" font-size="11" fill="#c7d2fe" text-anchor="middle" font-family="monospace" font-weight="700">' + s.voltage.toFixed(2) + '</text>'

      + '<line x1="390" y1="' + loopY1 + '" x2="390" y2="' + (loopY1 - 60) + '" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>'
      + '<line x1="390" y1="' + (loopY1 - 60) + '" x2="458" y2="' + (loopY1 - 60) + '" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>'
      + '<line x1="458" y1="' + (loopY1 - 60) + '" x2="458" y2="' + loopY1 + '" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>'

      /* I-V Graph */
      + '<g>'
      +   '<rect x="' + graphX + '" y="' + (graphY - graphH) + '" width="' + graphW + '" height="' + graphH + '" fill="rgba(15,23,42,0.5)" stroke="#475569" stroke-width="1"/>'
      /* Axes */
      +   '<line x1="' + graphX + '" y1="' + graphY + '" x2="' + (graphX + graphW) + '" y2="' + graphY + '" stroke="#64748b" stroke-width="1"/>'
      +   '<line x1="' + gX(0) + '" y1="' + graphY + '" x2="' + gX(0) + '" y2="' + (graphY - graphH) + '" stroke="#64748b" stroke-width="1"/>'
      /* Curve */
      +   '<path d="' + points + '" fill="none" stroke="#10b981" stroke-width="2"/>'
      /* Current point */
      +   '<circle cx="' + markerX + '" cy="' + markerY + '" r="4" fill="#ef4444" stroke="#fff" stroke-width="1"/>'
      /* Labels */

      +   '<text x="' + (graphX - 14) + '" y="' + (graphY - graphH / 2) + '" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="monospace" transform="rotate(-90 ' + (graphX - 14) + ' ' + (graphY - graphH / 2) + ')">I (A)</text>'

  updateReadouts: function () {
    var I = this.getCurrent();
    var iEl = P14_$("phylabIvI");
    if (iEl) iEl.innerHTML = I.toFixed(4) + '<span class="phylab-readout-unit">A</span>';
    var rEl = P14_$("phylabIvR");
    if (rEl) {
      if (Math.abs(I) > 1e-6 && Math.abs(this.state.voltage) > 0.1) {
        rEl.innerHTML = (this.state.voltage / I).toFixed(2) + '<span class="phylab-readout-unit">Ω</span>';
      } else {
        rEl.innerHTML = '--<span class="phylab-readout-unit">Ω</span>';
      }
    }
  },
  bindControls: function () {
    var self = this;
    var resBtn = P14_$("phylabIvRes");
    var bulbBtn = P14_$("phylabIvBulb");
    var diodeBtn = P14_$("phylabIvDiode");
    function setComponent(c, btn) {
      self.state.component = c;
      self.state.data = [];
      var all = [resBtn, bulbBtn, diodeBtn];
      for (var i = 0; i < all.length; i++) {
        if (all[i]) all[i].style.background = all[i] === btn ? "linear-gradient(135deg,#6366f1,#7c3aed)" : "";
      }
      self.renderSVG(); self.updateReadouts(); self.renderData();
    }
    if (resBtn) resBtn.addEventListener("click", function () { setComponent("resistor", resBtn); });
    if (bulbBtn) bulbBtn.addEventListener("click", function () { setComponent("bulb", bulbBtn); });
    if (diodeBtn) diodeBtn.addEventListener("click", function () { setComponent("diode", diodeBtn); });
    if (resBtn) resBtn.style.background = "linear-gradient(135deg,#6366f1,#7c3aed)";

    var vS = P14_$("phylabIvV");
    if (vS) vS.addEventListener("input", function () {
      self.state.voltage = parseFloat(this.value);
      P14_$("phylabIvVVal").textContent = self.state.voltage.toFixed(1) + " V";
      self.renderSVG(); self.updateReadouts();
    });

    var recBtn = P14_$("phylabIvRecord");
    if (recBtn) recBtn.addEventListener("click", function () {
      var I = self.getCurrent();
      self.state.data.push({ V: self.state.voltage, I: I });
      self.renderData();
      P14_$("phylabStepText").textContent = "步驟 2：已記錄 " + self.state.data.length + " 組數據（建議 5 組以上）";
    });
    var clrBtn = P14_$("phylabIvClear");
    if (clrBtn) clrBtn.addEventListener("click", function () {
      self.state.data = []; self.renderData();
    });
  },
  renderData: function () {
    var el = P14_$("phylabIvData");
    if (!el) return;
    var d = this.state.data;
    if (d.length === 0) {
      el.innerHTML = '<table class="phylab-data-table"><tr class="empty"><td>尚未記錄任何數據</td></tr></table>';
      return;
    }
    var html = '<table class="phylab-data-table"><thead><tr><th>V(V)</th><th>I(A)</th></tr></thead><tbody>';
    for (var i = 0; i < d.length; i++) {
      html += '<tr><td>' + d[i].V.toFixed(2) + '</td><td>' + d[i].I.toFixed(4) + '</td></tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  },
  score: function () {
    var d = this.state.data;
    if (d.length < 3) return { error: "請至少記錄 3 組數據" };
    var c = this.state.component;
    var score = 100;
    var advice = [];
    var measured, expected, errorPct;

    if (c === "resistor") {
      /* Check linearity */
      var slopes = [];
      for (var i = 0; i < d.length; i++) {
        if (Math.abs(d[i].V) > 0.1) slopes.push(d[i].I / d[i].V);
      }
      var avg = slopes.reduce(function (a, b) { return a + b; }, 0) / slopes.length;
      var maxDev = 0;
      for (var j = 0; j < slopes.length; j++) {
        maxDev = Math.max(maxDev, Math.abs(slopes[j] - avg) / Math.abs(avg) * 100);
      }
      measured = 1 / avg; /* R = 1/slope */
      expected = 10.0;
      errorPct = Math.abs(measured - expected) / expected * 100;
      if (maxDev < 5) advice.push("電阻的 I-V 圖是通過原點的直線（奧姆定律驗證成功）。");
      else advice.push("電阻的 I-V 圖略有彎曲（偏差 " + maxDev.toFixed(1) + "%），可能是溫度變化影響。");
      advice.push("Ohmic 元件：R = V/I = 常數。你的 R ≈ " + measured.toFixed(2) + " Ω");
    } else if (c === "bulb") {
      advice.push("燈泡的 I-V 圖不是直線！電流越大，電阻越大。");
      advice.push("原因：燈絲溫度上升，金屬離子振動加劇，電子更難通過，電阻增加。");
      advice.push("這是非歐姆元件（non-ohmic）的典型例子。");
      measured = 0; expected = 0; errorPct = 0;
    } else {
      advice.push("二極管的 I-V 圖不對稱！");
      advice.push("順向偏壓（V > 0.6 V）時導通，電流快速上升。");
      advice.push("逆向偏壓（V < 0）時幾乎無電流（只有極小漏電流）。");
      advice.push("這是二極管的單向導電特性。");
      measured = 0; expected = 0; errorPct = 0;
    }

    if (d.length < 5) advice.push("只有 " + d.length + " 組數據，建議量度 5 組以上，包含正負電壓。");

    return {
      score: score, measured: measured, expected: expected,
      unit: c === "resistor" ? "Ω" : "A", errorPct: errorPct, advice: advice
    };
  }
};

  renderRuler: function (x1, x2, y) {

      out += '<line x1="' + x + '" y1="' + y + '" x2="' + x + '" y2="' + (y + len) + '" stroke="' + (major ? '#cbd5e1' : '#64748b') + '" stroke-width="' + (major ? 1.5 : 1) + '"/>';

        out += '<text x="' + x + '" y="' + (y + 26) + '" font-size="9" fill="#cbd5e1" text-anchor="middle" font-family="monospace">' + i + '</text>';
      }
    }
    return out;
  },
  updateReadouts: function () {
    var d = this.state.diameterMm / 1000;
    var A = Math.PI * d * d / 4;
    var aEl = P14_$("phylabResA");
    if (aEl) aEl.innerHTML = A.toExponential(3) + '<span class="phylab-readout-unit">m²</span>';
    var rEl = P14_$("phylabResR");
    if (rEl) rEl.innerHTML = this.getR().toFixed(3) + '<span class="phylab-readout-unit">Ω</span>';
  },
  bindControls: function () {
    var self = this;
    var lS = P14_$("phylabResL");
    if (lS) lS.addEventListener("input", function () {
      self.state.lengthCm = parseInt(this.value, 10);
      P14_$("phylabResLVal").textContent = self.state.lengthCm + " cm";
      self.renderSVG(); self.updateReadouts();
    });
    var dS = P14_$("phylabResD");
    if (dS) dS.addEventListener("input", function () {
      self.state.diameterMm = parseFloat(this.value);
      P14_$("phylabResDVal").textContent = self.state.diameterMm.toFixed(2) + " mm";
      self.renderSVG(); self.updateReadouts();
    });
    var recBtn = P14_$("phylabResRecord");
    if (recBtn) recBtn.addEventListener("click", function () {
      self.state.data.push({
        L: self.state.lengthCm / 100,
        Lcm: self.state.lengthCm,
        d: self.state.diameterMm,
        A: Math.PI * Math.pow(self.state.diameterMm / 1000, 2) / 4,
        R: self.getR()
      });
      self.renderData();
      P14_$("phylabStepText").textContent = "步驟 2：已記錄 " + self.state.data.length + " 組數據（建議 5 組以上）";
    });
    var clrBtn = P14_$("phylabResClear");
    if (clrBtn) clrBtn.addEventListener("click", function () {
      self.state.data = []; self.renderData();
    });
  },
  renderData: function () {
    var el = P14_$("phylabResData");
    if (!el) return;
    var d = this.state.data;
    if (d.length === 0) {
      el.innerHTML = '<table class="phylab-data-table"><tr class="empty"><td>尚未記錄任何數據</td></tr></table>';
      return;
    }
    var html = '<table class="phylab-data-table"><thead><tr><th>L(cm)</th><th>R(Ω)</th></tr></thead><tbody>';
    for (var i = 0; i < d.length; i++) {
      html += '<tr><td>' + d[i].Lcm + '</td><td>' + d[i].R.toFixed(3) + '</td></tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  },
  score: function () {
    var d = this.state.data;
    if (d.length < 3) return { error: "請至少記錄 3 組數據" };
    /* Linear regression R = (ρ/A) L, slope = ρ/A */
    var n = d.length;
    var sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
    for (var i = 0; i < n; i++) {
      sumX += d[i].L; sumY += d[i].R; sumXY += d[i].L * d[i].R; sumXX += d[i].L * d[i].L;
    }
    var denom = n * sumXX - sumX * sumX;
    if (Math.abs(denom) < 1e-12) return { error: "數據不足" };
    var slope = (n * sumXY - sumX * sumY) / denom;
    /* ρ = slope * A */
    var avgA = 0;
    for (var j = 0; j < n; j++) avgA += d[j].A;
    avgA /= n;
    var rhoMeasured = slope * avgA;
    var expected = this.RHO_REAL;
    var errorPct = Math.abs(rhoMeasured - expected) / expected * 100;
    var score;
    if (errorPct < 5) score = 100;
    else if (errorPct < 10) score = 90;
    else if (errorPct < 20) score = 75;
    else if (errorPct < 30) score = 55;
    else score = 30;
    var advice = [];
    advice.push("電阻率公式：R = ρL/A，故 ρ = RA/L。作 R 對 L 圖，斜率 = ρ/A，得 ρ = 斜率 × A。");
    advice.push("你的 ρ = " + rhoMeasured.toExponential(3) + " Ω m");
    if (errorPct < 10) advice.push("結果良好！ρ 值接近鎳鉻合金的標準值 " + expected.toExponential(2) + " Ω m");
    else advice.push("誤差較大。請確認導線直徑量度準確（用螺旋測微器），且接觸點電阻影響不大。");
    advice.push("注意：金屬電阻率會隨溫度略為上升，高電流時鎳鉻線會發熱。");
    return {
      score: score, measured: rhoMeasured, expected: expected,
      unit: this.unit, errorPct: errorPct, advice: advice
    };
  }
};

/* ===================================================
   Experiment 17: Magnetic Field Lines
   =================================================== */
registry.magnetic = {
  id: "magnetic",
  title_zh: "磁場線描繪",
  title_en: "Magnetic Field Lines",
  desc_zh: "用指南針描繪條形磁鐵、直導線、螺線管的磁場線",
  desc_en: "Trace field lines of bar magnet, straight wire, solenoid",
  difficulty: 2,
  unit: "fields",
  state: {
    source: "barmagnet", // "barmagnet" | "straightwire" | "solenoid"
    compassX: 0.5,  // 0-1 relative position
    compassY: 0.5,
    traces: [],  // User-placed compass readings
    animGen: 0
  },
  reset: function () {
    this.state = { source: "barmagnet", compassX: 0.5, compassY: 0.5, traces: [], animGen: 0 };
  },
  /* Get magnetic field direction (unit vector) at position (x, y) in px */
  getFieldDir: function (x, y) {
    var W = 700, H = 420;
    var cx = W / 2, cy = H / 2;

    if (this.state.source === "barmagnet") {
      /* Bar magnet horizontal: N on left, S on right */
      var Nx = cx - 70, Ny = cy;
      var Sx = cx + 70, Sy = cy;
      var dx = x - Nx, dy = y - Ny;
      var d1 = Math.sqrt(dx * dx + dy * dy) + 0.001;
      var dx2 = x - Sx, dy2 = y - Sy;
      var d2 = Math.sqrt(dx2 * dx2 + dy2 * dy2) + 0.001;
      /* Field at point: from N pole (positive) to S pole (negative) */
      var bx = (dx / Math.pow(d1, 3)) - (dx2 / Math.pow(d2, 3));
      var by = (dy / Math.pow(d1, 3)) - (dy2 / Math.pow(d2, 3));
      var mag = Math.sqrt(bx * bx + by * by) + 0.001;
      return { x: bx / mag, y: by / mag, mag: mag };
    } else if (this.state.source === "straightwire") {
      /* Current into page at center: field is circular (counterclockwise viewed from above) */
      var dx = x - cx, dy = y - cy;
      var r = Math.sqrt(dx * dx + dy * dy) + 0.001;
      /* Direction: perpendicular to radius, CCW if current into page */
      return { x: -dy / r, y: dx / r, mag: 1 / r };
    } else {
      /* Solenoid: coil along horizontal axis */
      var len = 200;
      /* Inside solenoid: field points along axis (to the right) */
      if (Math.abs(x - cx) < len / 2 && Math.abs(y - cy) < 30) {
        return { x: 1, y: 0, mag: 1.5 };
      }
      /* Outside: dipole-like from end to end */
      var exL = cx - len / 2, eyL = cy;
      var exR = cx + len / 2, eyR = cy;
      var dxL = x - exL, dyL = y - eyL;
      var dL = Math.sqrt(dxL * dxL + dyL * dyL) + 0.001;
      var dxR = x - exR, dyR = y - eyR;
      var dR = Math.sqrt(dxR * dxR + dyR * dyR) + 0.001;
      var bx = -(dxR / Math.pow(dR, 3)) + (dxL / Math.pow(dL, 3));
      var by = -(dyR / Math.pow(dR, 3)) + (dyL / Math.pow(dL, 3));
      /* Inside coil, stronger field to right */
      var mag = Math.sqrt(bx * bx + by * by) + 0.001;
      return { x: bx / mag, y: by / mag, mag: mag };
    }
  },
  previewSVG: function () {
    return '<svg viewBox="0 0 200 120" preserveAspectRatio="xMidYMid meet">'
      + '<rect x="60" y="55" width="30" height="15" rx="3" fill="#ef4444"/>'
      + '<rect x="90" y="55" width="30" height="15" rx="3" fill="#3b82f6"/>'
      + '<text x="75" y="66" font-size="9" fill="#fff" text-anchor="middle">N</text>'
      + '<text x="105" y="66" font-size="9" fill="#fff" text-anchor="middle">S</text>'
      + '<path d="M 60 55 Q 40 30 70 30 Q 100 30 90 55" stroke="#a5b4fc" stroke-width="1" fill="none"/>'
      + '<path d="M 120 55 Q 140 30 100 30" stroke="#a5b4fc" stroke-width="1" fill="none"/>'
      + '<text x="100" y="115" font-size="10" fill="#6366f1" text-anchor="middle" font-family="monospace" font-weight="700">N → S</text>'
      + '</svg>';
  },
  equipItem: P14_equip,
  render: function () {
    var s = this.state;
    P14_$("phylabLabLeft").innerHTML = '<div class="phylab-lab-panel-title">儀器與材料</div>'
      + this.equipItem("條形磁鐵") + this.equipItem("直導線") + this.equipItem("螺線管")
      + this.equipItem("小磁針") + this.equipItem("白紙");

    P14_$("phylabLabCenter").innerHTML = '<div class="phylab-workspace" style="position:relative;">'
      + '<canvas id="phylabMagCanvas" style="width:100%;height:100%;display:block;border-radius:16px;cursor:crosshair;"></canvas>'
      + '</div>';

    P14_$("phylabLabRight").innerHTML = ''
      + '<div class="phylab-lab-panel-title">操作面板</div>'
      + '<div class="phylab-control">'
      +   '<div class="phylab-control-label"><span>磁場源</span></div>'
      +   '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;">'
      +     '<button class="phylab-btn secondary" id="phylabMagBar" type="button" style="margin:0;font-size:10px;padding:8px 4px;"><span>條形</span></button>'
      +     '<button class="phylab-btn secondary" id="phylabMagWire" type="button" style="margin:0;font-size:10px;padding:8px 4px;"><span>直線</span></button>'
      +     '<button class="phylab-btn secondary" id="phylabMagSol" type="button" style="margin:0;font-size:10px;padding:8px 4px;"><span>螺線管</span></button>'
      +   '</div>'
      + '</div>'
      + '<div class="phylab-readout" style="padding:8px 12px;">'
      +   '<div class="phylab-readout-label">說明</div>'
      +   '<div style="font-size:11px;color:#cbd5e1;line-height:1.5;margin-top:4px;">點擊畫布放置小磁針，觀察磁場方向。收集足夠讀數後提交評分。</div>'
      + '</div>'
      + '<div class="phylab-readout" style="padding:8px 12px;">'
      +   '<div class="phylab-readout-label">已放磁針</div>'
      +   '<div class="phylab-readout-value" id="phylabMagCount" style="font-size:18px;">0</div>'
      + '</div>'
      + '<button class="phylab-btn success" id="phylabMagClear" type="button" style="margin-top:12px;"><span>清除畫布</span></button>';

    P14_$("phylabStepText").textContent = "步驟：切換磁場源，在畫布上點擊放置小磁針";
    this.startCanvas();
    this.bindControls();
  },
  startCanvas: function () {
    var self = this;
    var canvas = P14_$("phylabMagCanvas");
    if (!canvas) return;
    var W = 700, H = 420;
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext("2d");

    canvas.addEventListener("click", function (e) {
      var rect = canvas.getBoundingClientRect();
      var x = (e.clientX - rect.left) * (W / rect.width);
      var y = (e.clientY - rect.top) * (H / rect.height);
      var dir = self.getFieldDir(x, y);
      self.state.traces.push({ x: x, y: y, dx: dir.x, dy: dir.y });
      self.updateCount();
      /* Redraw on next frame automatically */
    });

    function frame() {
      if (!P14_$("phylabMagCanvas")) return;
      self.drawScene(ctx, W, H);
      requestAnimationFrame(frame);
    }
    frame();
  },
  drawScene: function (ctx, W, H) {
    var s = this.state;
    ctx.fillStyle = "#0b1220";
    ctx.fillRect(0, 0, W, H);

    /* Grid */
    ctx.strokeStyle = "rgba(99,102,241,0.06)";
    ctx.lineWidth = 1;
    for (var x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (var y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    var cx = W / 2, cy = H / 2;

    /* Draw magnet source */
    if (s.source === "barmagnet") {
      /* Bar magnet: N (left) red, S (right) blue */
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(cx - 80, cy - 15, 80, 30);
      ctx.fillStyle = "#3b82f6";
      ctx.fillRect(cx, cy - 15, 80, 30);
      ctx.strokeStyle = "#c7d2fe";
      ctx.lineWidth = 2;
      ctx.strokeRect(cx - 80, cy - 15, 160, 30);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 14px monospace";
      ctx.textAlign = "center";
      ctx.fillText("N", cx - 40, cy + 5);
      ctx.fillText("S", cx + 40, cy + 5);
    } else if (s.source === "straightwire") {
      /* Wire into page */
      ctx.fillStyle = "#1e293b";
      ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#6366f1"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2); ctx.stroke();
      /* X mark for current into page */
      ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 8, cy - 8); ctx.lineTo(cx + 8, cy + 8);
      ctx.moveTo(cx + 8, cy - 8); ctx.lineTo(cx - 8, cy + 8);
      ctx.stroke();
      /* Label */
      ctx.fillStyle = "#a5b4fc";
      ctx.font = "10px monospace";
      ctx.fillText("I into page", cx, cy + 40);
    } else {
      /* Solenoid: 8 loops */
      var len = 200, coils = 8;
      var xStart = cx - len / 2, xEnd = cx + len / 2;
      ctx.strokeStyle = "#cbd5e1";
      ctx.lineWidth = 2;
      for (var i = 0; i <= coils; i++) {
        var lx = xStart + (len / coils) * i;
        ctx.beginPath();
        ctx.ellipse(lx, cy, 8, 30, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      /* Field direction arrow inside */
      ctx.strokeStyle = "#ef4444";
      ctx.fillStyle = "#ef4444";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(xStart + 30, cy - 5);
      ctx.lineTo(xEnd - 30, cy - 5);
      ctx.stroke();
      /* Arrow head */
      ctx.beginPath();
      ctx.moveTo(xEnd - 30, cy - 5);
      ctx.lineTo(xEnd - 42, cy - 12);
      ctx.lineTo(xEnd - 42, cy + 2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#a5b4fc";
      ctx.font = "10px monospace";
      ctx.textAlign = "center";
      ctx.fillText("I", xStart - 20, cy + 5);
    }

    /* Draw field lines (light, decorative) */
    this.drawBackgroundFieldLines(ctx, W, H);

    /* Draw user traces (compass needles) */
    for (var t = 0; t < s.traces.length; t++) {
      var tr = s.traces[t];
      /* Needle: circle with arrow */
      ctx.fillStyle = "rgba(30,41,59,0.8)";
      ctx.beginPath(); ctx.arc(tr.x, tr.y, 12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#a5b4fc"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(tr.x, tr.y, 12, 0, Math.PI * 2); ctx.stroke();
      /* Arrow: points in field direction (N points along B) */
      var nx = tr.x + tr.dx * 8, ny = tr.y + tr.dy * 8;
      var sx = tr.x - tr.dx * 8, sy = tr.y - tr.dy * 8;
      ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(nx, ny); ctx.stroke();
      /* Arrowhead */
      var ang = Math.atan2(tr.dy, tr.dx);
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.moveTo(nx, ny);
      ctx.lineTo(nx - Math.cos(ang - 0.4) * 6, ny - Math.sin(ang - 0.4) * 6);
      ctx.lineTo(nx - Math.cos(ang + 0.4) * 6, ny - Math.sin(ang + 0.4) * 6);
      ctx.closePath();
      ctx.fill();
    }

    /* Hint text */
    ctx.fillStyle = "#64748b";
    ctx.font = "11px monospace";
    ctx.textAlign = "left";
    ctx.fillText("Click canvas to place compass", 20, 24);
  },
  drawBackgroundFieldLines: function (ctx, W, H) {
    var s = this.state;
    ctx.strokeStyle = "rgba(165,180,252,0.15)";
    ctx.lineWidth = 1;
    var cx = W / 2, cy = H / 2;

    if (s.source === "barmagnet") {
      /* Curved field lines from N to S */
      for (var r = 60; r <= 200; r += 45) {
        ctx.beginPath();
        ctx.ellipse(cx - 20, cy, r, r * 0.7, 0, -Math.PI * 0.55, Math.PI * 0.55);
        ctx.stroke();
      }
    } else if (s.source === "straightwire") {
      /* Concentric circles */
      for (var r2 = 40; r2 <= 200; r2 += 40) {
        ctx.beginPath(); ctx.arc(cx, cy, r2, 0, Math.PI * 2); ctx.stroke();
      }
    } else {
      /* Loops around solenoid */
      for (var i = 0; i < 3; i++) {
        var h = 60 + i * 40;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 160 + i * 20, h, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  },
  updateCount: function () {
    var el = P14_$("phylabMagCount");
    if (el) el.textContent = this.state.traces.length;
  },
  bindControls: function () {
    var self = this;
    function setSource(src, btn) {
      self.state.source = src;
      self.state.traces = [];
      var all = [P14_$("phylabMagBar"), P14_$("phylabMagWire"), P14_$("phylabMagSol")];
      for (var i = 0; i < all.length; i++) {
        if (all[i]) all[i].style.background = all[i] === btn ? "linear-gradient(135deg,#6366f1,#7c3aed)" : "";
      }
      self.updateCount();
    }
    var barBtn = P14_$("phylabMagBar");
    var wireBtn = P14_$("phylabMagWire");
    var solBtn = P14_$("phylabMagSol");
    if (barBtn) barBtn.addEventListener("click", function () { setSource("barmagnet", barBtn); });
    if (wireBtn) wireBtn.addEventListener("click", function () { setSource("straightwire", wireBtn); });
    if (solBtn) solBtn.addEventListener("click", function () { setSource("solenoid", solBtn); });
    if (barBtn) barBtn.style.background = "linear-gradient(135deg,#6366f1,#7c3aed)";

    var clrBtn = P14_$("phylabMagClear");
    if (clrBtn) clrBtn.addEventListener("click", function () {
      self.state.traces = [];
      self.updateCount();
    });
  },
  score: function () {
    var t = this.state.traces;
    if (t.length < 3) return { error: "請至少放置 3 個小磁針" };

    /* Check: all needles should point roughly consistent with the source field.
       For bar magnet: field lines should go N->S outside, S->N inside.
       For wire: perpendicular to radius.
       For solenoid: parallel to axis inside. */
    var score = 100;
    var advice = [];

    if (this.state.source === "barmagnet") {
      advice.push("條形磁鐵：磁場線從 N 極出發，繞過外部回到 S 極，形成閉合曲線。");
      advice.push("磁針北極指向與當地磁場方向相同（即磁力線的切線方向）。");
      advice.push("磁場線不會相交，磁極附近磁場線較密（磁場較強）。");
    } else if (this.state.source === "straightwire") {
      advice.push("直導線：磁場線為同心圓，圓心在導線上。");
      advice.push("右手定律：拇指指電流方向（射入紙面），其餘四指指磁場方向（順時針或逆時針）。");
      advice.push("距離導線越遠，磁場越弱（B ∝ 1/r）。");
    } else {
      advice.push("螺線管：管內磁場均勻，方向沿軸（右手定律：四指指電流方向，拇指指內部磁場方向）。");
      advice.push("管外磁場如條形磁鐵，從 N 極出來回到 S 極。");
      advice.push("管內磁場線較密（磁場較強且均勻）。");
    }

    if (t.length < 5) advice.push("你放了 " + t.length + " 個磁針，建議多放幾個以獲得更好的磁場圖像。");

    return {
      score: score, measured: t.length, expected: 5,
      unit: this.unit, errorPct: 0, advice: advice
    };
  }
};

    magnetSpeed: 5,     // arbitrary 1-10
    coilTurns: 200,     // 100, 200, 400
    magnetPolarity: "N-first",  // "N-first" | "S-first"
    position: -1,       // -1 (left) to +1 (right); 0 = at coil
    direction: 1,       // 1 = moving right, -1 = moving left
    running: false,
    realStartMs: 0,
    lastEMF: 0,
    data: [],
    animGen: 0
  },
  reset: function () {
    this.state = {
      magnetSpeed: 5, coilTurns: 200, magnetPolarity: "N-first",
      position: -1, direction: 1, running: false,
      realStartMs: 0, lastEMF: 0, data: [], animGen: 0
    };
  },
  /* EMF magnitude depends on speed and turns and how close to coil
     EMF = -N dΦ/dt; approximate with Gaussian-like function peaking at coil */
  getEMF: function () {
    var s = this.state;
    if (!s.running) return 0;
    var x = s.position;
    /* dΦ/dx peaks at center, this is a Gaussian-ish bell */
    var dPhidx = Math.exp(-Math.pow(x * 3, 2)) * 8;
    var vx = s.direction * (s.magnetSpeed / 100);
    var polarity = (s.magnetPolarity === "N-first") ? s.direction : -s.direction;
    /* Lenz: EMF opposes change in flux, so sign flips based on direction */
    var emf = -polarity * s.coilTurns * dPhidx * vx;
    return emf;
  },
  previewSVG: function () {

    P15_$("phylabStepText").textContent = "步驟 1：推入或拉出磁鐵，觀察感應電動勢";
    this.renderSVG();

  },
  renderSVG: function () {
    var svg = P15_$("phylabFarSVG");
    if (!svg) return;
    var s = this.state;
    var emf = this.getEMF();

    /* Coil at center, magnet moves along axis */
    var cx = 350, cy = 210;
    /* Position: -1 (left) to +1 (right); map to px -180 to +180 */
    var magnetX = cx + s.position * 180;

    /* Coil: 6 ellipses stacked (like solenoid viewed from side) */
    var coilLeft = cx - 30, coilRight = cx + 30;
    var coilTurns = 6;
    var coilLines = "";
    for (var i = 0; i < coilTurns; i++) {
      var xPos = coilLeft + (coilRight - coilLeft) * i / (coilTurns - 1);
      coilLines += '<ellipse cx="' + xPos + '" cy="' + cy + '" rx="10" ry="80" fill="none" stroke="#a5b4fc" stroke-width="2" opacity="0.85"/>';
    }

    /* Magnet */
    var magW = 60, magH = 40;
    var magLeftX = magnetX - magW / 2;
    var magY = cy - magH / 2;
    var nColor = "#ef4444", sColor = "#3b82f6";
    var nOnLeft = (s.magnetPolarity === "N-first");
    var leftColor = nOnLeft ? nColor : sColor;
    var rightColor = nOnLeft ? sColor : nColor;
    var leftLabel = nOnLeft ? "N" : "S";
    var rightLabel = nOnLeft ? "S" : "N";

    /* Galvanometer needle */
    var needleDeg = Math.max(-60, Math.min(60, emf * 5));
    var galX = 130, galY = 320, galR = 50;

    svg.innerHTML = ''
      + '<defs>'
      +   '<pattern id="phylabFarGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99,102,241,0.05)" stroke-width="1"/></pattern>'
      +   '<linearGradient id="phylabFarN" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="' + (nOnLeft ? "#fca5a5" : "#93c5fd") + '"/><stop offset="100%" stop-color="' + (nOnLeft ? "#ef4444" : "#3b82f6") + '"/></linearGradient>'
      +   '<linearGradient id="phylabFarS" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="' + (nOnLeft ? "#93c5fd" : "#fca5a5") + '"/><stop offset="100%" stop-color="' + (nOnLeft ? "#3b82f6" : "#ef4444") + '"/></linearGradient>'
      + '</defs>'
      + '<rect width="700" height="420" fill="url(#phylabFarGrid)"/>'

      /* Coil */
      + coilLines

      /* Axis line */
      + '<line x1="100" y1="' + cy + '" x2="650" y2="' + cy + '" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>'

      /* Magnet */
      + '<rect x="' + magLeftX + '" y="' + magY + '" width="' + (magW / 2) + '" height="' + magH + '" rx="3" fill="url(#phylabFarN)" stroke="#cbd5e1" stroke-width="1"/>'
      + '<rect x="' + (magLeftX + magW / 2) + '" y="' + magY + '" width="' + (magW / 2) + '" height="' + magH + '" rx="3" fill="url(#phylabFarS)" stroke="#cbd5e1" stroke-width="1"/>'
      + '<text x="' + (magLeftX + magW / 4) + '" y="' + (magY + magH / 2 + 6) + '" font-size="16" fill="#fff" text-anchor="middle" font-family="monospace" font-weight="700">' + leftLabel + '</text>'
      + '<text x="' + (magLeftX + 3 * magW / 4) + '" y="' + (magY + magH / 2 + 6) + '" font-size="16" fill="#fff" text-anchor="middle" font-family="monospace" font-weight="700">' + rightLabel + '</text>'

      /* Velocity arrow */
      + (s.running ? this.velocityArrow(magLeftX + magW + 4, magY + magH / 2, s.direction * (s.magnetSpeed * 3)) : '')

      /* Field lines from magnet (decorative) */
      + this.magnetFieldLines(magnetX, cy)

      /* Galvanometer */
      + '<g transform="translate(' + galX + ',' + galY + ')">'
      +   '<circle r="' + galR + '" fill="#0f172a" stroke="#4f46e5" stroke-width="2.5"/>'
      +   '<circle r="' + (galR - 6) + '" fill="none" stroke="#1e293b" stroke-width="1"/>'
      /* Ticks */
      +   this.galTicks(galR)
      /* Needle */
      +   '<line x1="0" y1="0" x2="' + (Math.sin(needleDeg * Math.PI / 180) * (galR - 10)).toFixed(1) + '" y2="' + (-Math.cos(needleDeg * Math.PI / 180) * (galR - 10)).toFixed(1) + '" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>'
      +   '<circle r="4" fill="#ef4444"/>'
      +   '<text y="' + (galR + 18) + '" font-size="10" fill="#64748b" text-anchor="middle" font-family="monospace">GALVANOMETER</text>'
      + '</g>'

      /* Connecting wires from coil to galvanometer */
      + '<path d="M ' + (coilLeft) + ' ' + (cy + 80) + ' Q 180 380 130 370" stroke="#475569" stroke-width="2" fill="none"/>'
      + '<path d="M ' + (coilRight) + ' ' + (cy + 80) + ' Q 300 380 130 370" stroke="#475569" stroke-width="2" fill="none"/>'

      /* Info box */
      + '<rect x="450" y="30" width="230" height="120" rx="8" fill="rgba(15,23,42,0.78)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>'
      + '<text x="465" y="52" font-size="10" fill="#64748b" font-family="monospace">EMF = -N dphi/dt</text>'
      + '<text x="465" y="72" font-size="10" fill="#64748b" font-family="monospace">N = ' + s.coilTurns + ' turns</text>'
      + '<text x="465" y="90" font-size="10" fill="#64748b" font-family="monospace">Speed = ' + s.magnetSpeed + '</text>'
      + '<text x="465" y="108" font-size="10" fill="#a5b4fc" font-family="monospace">Direction: ' + (s.direction > 0 ? "→ right" : "← left") + '</text>'
      + '<text x="465" y="128" font-size="12" fill="' + (Math.abs(emf) > 0.1 ? "#fbbf24" : "#64748b") + '" font-family="monospace" font-weight="700">EMF = ' + emf.toFixed(3) + ' V</text>';
  },
  velocityArrow: function (x, y, vx) {
    if (Math.abs(vx) < 1) return '';
    var len = Math.min(60, Math.abs(vx));
    var x2 = x + len * Math.sign(vx);
    return '<line x1="' + x + '" y1="' + y + '" x2="' + x2 + '" y2="' + y + '" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrGreenVel)"/>'
      + '<defs><marker id="arrGreenVel" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#10b981"/></marker></defs>'
      + '<text x="' + (x2 + 5 * Math.sign(vx)) + '" y="' + (y - 8) + '" font-size="10" fill="#10b981" font-family="monospace">v</text>';
  },
  magnetFieldLines: function (mx, my) {
    var s = this.state;
    var out = '';
    var nOnLeft = (s.magnetPolarity === "N-first");
    /* Draw 3 curved lines from N to S */
    for (var i = 1; i <= 3; i++) {
      var h = 40 + i * 18;
      var startX = mx - 40 + (nOnLeft ? 0 : 20);
      var endX = mx + 40 + (nOnLeft ? -20 : 0);
      out += '<path d="M ' + (mx - 30) + ' ' + (my - 20) + ' Q ' + (mx - 30) + ' ' + (my - 20 - h) + ' ' + (mx + 30) + ' ' + (my - 20 - h) + ' Q ' + (mx + 30) + ' ' + (my - 20) + ' ' + (mx + 30) + ' ' + (my - 20) + '" fill="none" stroke="#a5b4fc" stroke-width="1" opacity="' + (0.5 - i * 0.1) + '"/>';
    }
    return out;
  },
  galTicks: function (R) {
    var out = '';
    for (var i = -60; i <= 60; i += 30) {
      var rad = i * Math.PI / 180;
      var x1 = Math.sin(rad) * (R - 14);
      var y1 = -Math.cos(rad) * (R - 14);
      var x2 = Math.sin(rad) * (R - 6);
      var y2 = -Math.cos(rad) * (R - 6);
      out += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#64748b" stroke-width="1.5"/>';
    }
    return out;
  },
  updateReadouts: function () {
    var emf = this.getEMF();
    var el = P15_$("phylabFarEMF");
    if (el) el.innerHTML = emf.toFixed(3) + '<span class="phylab-readout-unit">V</span>';
    /* Track peak */
    if (Math.abs(emf) > Math.abs(this.state.lastEMF)) {
      this.state.lastEMF = emf;
      var pEl = P15_$("phylabFarPeak");
      if (pEl) pEl.innerHTML = Math.abs(emf).toFixed(3) + '<span class="phylab-readout-unit">V</span>';
    }
  },
  startAnimation: function () {
    var myGen = ++this.state.animGen;
    var self = this;
    function loop() {
      if (self.state.animGen !== myGen) return;
      if (!P15_$("phylabFarSVG")) return;
      if (self.state.running) {
        var dt = 0.016; /* 60fps ~ 0.016s */
        var vx = self.state.direction * (self.state.magnetSpeed / 250);
        self.state.position += vx;
        if (self.state.position > 1.5 || self.state.position < -1.5) {
          self.state.running = false;
          var recBtn = P15_$("phylabFarRecord");
          if (recBtn) recBtn.disabled = false;
          P15_$("phylabStepText").textContent = "步驟 2：已到達終點，可記錄峰值或換參數";
        }
        self.renderSVG();
        self.updateReadouts();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  },
  bindControls: function () {
    var self = this;

    var speedS = P15_$("phylabFarSpeed");
    if (speedS) speedS.addEventListener("input", function () {
      self.state.magnetSpeed = parseInt(this.value, 10);
      P15_$("phylabFarSpeedVal").textContent = self.state.magnetSpeed;
    });

    var n100 = P15_$("phylabFarN100");
    var n200 = P15_$("phylabFarN200");
    var n400 = P15_$("phylabFarN400");
    function setTurns(N, btn) {
      self.state.coilTurns = N;
      [n100, n200, n400].forEach(function (b) {
        if (b) b.style.background = b === btn ? "linear-gradient(135deg,#6366f1,#7c3aed)" : "";
      });
      self.state.lastEMF = 0;
      var pEl = P15_$("phylabFarPeak");
      if (pEl) pEl.innerHTML = '--<span class="phylab-readout-unit">V</span>';
      self.renderSVG();
    }
    if (n100) n100.addEventListener("click", function () { setTurns(100, n100); });
    if (n200) n200.addEventListener("click", function () { setTurns(200, n200); });
    if (n400) n400.addEventListener("click", function () { setTurns(400, n400); });
    if (n200) n200.style.background = "linear-gradient(135deg,#6366f1,#7c3aed)";

    var nf = P15_$("phylabFarNFirst");
    var sf = P15_$("phylabFarSFirst");
    if (nf && sf) {
      nf.addEventListener("click", function () {
        self.state.magnetPolarity = "N-first";
        sf.style.background = "";
        nf.style.background = "linear-gradient(135deg,#6366f1,#7c3aed)";
        self.renderSVG();
      });
      sf.addEventListener("click", function () {
        self.state.magnetPolarity = "S-first";
        nf.style.background = "";
        sf.style.background = "linear-gradient(135deg,#6366f1,#7c3aed)";
        self.renderSVG();
      });
      nf.style.background = "linear-gradient(135deg,#6366f1,#7c3aed)";
    }

    var pushBtn = P15_$("phylabFarPush");
    if (pushBtn) pushBtn.addEventListener("click", function () {
      self.state.position = -1.2;
      self.state.direction = 1;
      self.state.running = true;
      self.state.realStartMs = Date.now();
      self.state.lastEMF = 0;
      var recBtn = P15_$("phylabFarRecord");
      if (recBtn) recBtn.disabled = true;
      P15_$("phylabStepText").textContent = "步驟 2：磁鐵移動中...";
    });

    var pullBtn = P15_$("phylabFarPull");
    if (pullBtn) pullBtn.addEventListener("click", function () {
      self.state.position = 1.2;
      self.state.direction = -1;
      self.state.running = true;
      self.state.realStartMs = Date.now();
      self.state.lastEMF = 0;
      var recBtn = P15_$("phylabFarRecord");
      if (recBtn) recBtn.disabled = true;
      P15_$("phylabStepText").textContent = "步驟 2：磁鐵移動中...";
    });

    var recBtn = P15_$("phylabFarRecord");
    if (recBtn) recBtn.addEventListener("click", function () {
      self.state.data.push({
        N: self.state.coilTurns,
        speed: self.state.magnetSpeed,
        polarity: self.state.magnetPolarity,
        direction: self.state.direction,
        peakEMF: self.state.lastEMF
      });
      self.renderData();
      P15_$("phylabStepText").textContent = "步驟 3：已記錄 " + self.state.data.length + " 組數據（建議 3 組以上）";
      recBtn.disabled = true;
    });

    var clrBtn = P15_$("phylabFarClear");
    if (clrBtn) clrBtn.addEventListener("click", function () {
      self.state.data = [];
      self.renderData();
    });

    this.startAnimation();
  },
  renderData: function () {
    var el = P15_$("phylabFarData");
    if (!el) return;
    var d = this.state.data;
    if (d.length === 0) {
      el.innerHTML = '<table class="phylab-data-table"><tr class="empty"><td>尚未記錄任何數據</td></tr></table>';
      return;
    }
    var html = '<table class="phylab-data-table"><thead><tr><th>N</th><th>峰值EMF</th></tr></thead><tbody>';
    for (var i = 0; i < d.length; i++) {
      html += '<tr><td>' + d[i].N + '</td><td>' + d[i].peakEMF.toFixed(3) + '</td></tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  },
  score: function () {
    var d = this.state.data;
    if (d.length < 2) return { error: "請至少記錄 2 組數據（不同 N 或 speed）" };
    var score = 100;
    var advice = [];
    advice.push("法拉第定律：EMF = -N dΦ/dt。");
    advice.push("線圈匝數 N 越大，EMF 越大（成正比）。");
    advice.push("磁鐵移動速度越快，dΦ/dt 越大，EMF 越大。");
    advice.push("磁極方向相反時，EMF 正負號相反（楞次定律：感應電流的方向總是反抗磁通變化）。");
    /* Check N-linear relationship */
    var sameSpeed = d.filter(function (x) { return x.speed === d[0].speed; });
    if (sameSpeed.length >= 2) {
      advice.push("你已量度不同匝數的 EMF，可作 EMF 對 N 圖驗證正比關係。");
    } else {
      advice.push("建議固定速度，量度不同匝數 N 的 EMF 以驗證 EMF ∝ N。");
    }
    return {
      score: score, measured: d.length, expected: 3,
      unit: this.unit, errorPct: 0, advice: advice
    };
  }
};

    var errors = [];
    for (var i = 0; i < d.length; i++) {

        var rate = self.getRate();
        var expectedCounts = rate / 60 * dt;
        if (Math.random() < expectedCounts) self.state.count++;

  score: function () {
    var d = this.state.data;
    var bgData = d.filter(function (x) { return !x.sourcePresent; });
    var srcData = d.filter(function (x) { return x.sourcePresent; });
    if (bgData.length < 1 || srcData.length < 1) {
      return { error: "請分別記錄「無源（背景）」與「有源」各至少 1 組數據" };
    }
    var avgBg = bgData.reduce(function (a, x) { return a + x.rate; }, 0) / bgData.length;
    var avgSrc = srcData.reduce(function (a, x) { return a + x.rate; }, 0) / srcData.length;
    var net = avgSrc - avgBg;
    var score = 100;
    var advice = [];
    advice.push("背景輻射計數率約 " + avgBg.toFixed(1) + " cpm。");
    advice.push("放入放射源後計數率約 " + avgSrc.toFixed(1) + " cpm。");
    advice.push("淨計數率 = 有源 − 背景 = " + net.toFixed(1) + " cpm。");
    advice.push("背景輻射來源包括：宇宙射線、地表岩石的天然放射性（如鈾、釷、鉀-40）、建築材料、以及儀器本身的電子噪聲。");
    advice.push("量度時間越長，統計誤差越小（誤差 ≈ √N / N）。");
    if (net < 50) advice.push("淨計數偏小，可能量度時間太短或源距離太遠。");
    return {
      score: score, measured: net, expected: 200,
      unit: "cpm", errorPct: 0, advice: advice
    };
  }
};

  renderSVG: function () {
    var svg = P16_$("phylabDecaySVG");
    if (!svg) return;
    var s = this.state;
    var N0 = s.numDice;
    var N = s.currentDice;
    var rounds = s.rounds;

    /* Bar chart at bottom: y axis = fraction remaining, x axis = round */
    var chartX = 60, chartY = 320, chartW = 580, chartH = 180;
    var maxRounds = Math.max(15, rounds + 2);

    /* Axes */
    var axisX = chartX, axisY = chartY;
    var yAxisTop = chartY - chartH;

    /* Bar positions */
    var bars = "";
    if (s.decayCounts.length > 0) {
      var barW = Math.max(4, (chartW - 20) / maxRounds);
      for (var i = 0; i < s.decayCounts.length; i++) {
        var frac = s.decayCounts[i] / N0;
        var barH = frac * chartH;
        var bx = chartX + 20 + i * barW;
        var by = chartY - barH;
        bars += '<rect x="' + bx + '" y="' + by + '" width="' + (barW - 2) + '" height="' + barH + '" fill="#4f46e5" opacity="0.7"/>';

    }

    /* Theoretical curve: N = N0 * (5/6)^t for dice 6 case */

    else if (s.decayThreshold === 5) pDecay = 2 / 6;
    else if (s.decayThreshold === 4) pDecay = 3 / 6;
    else pDecay = 1 / 6;

    var curvePath = "M";

      var theoretical = N0 * Math.pow(1 - pDecay, t);
      var cx = chartX + 20 + (chartW - 20) * t / maxRounds;
      var cy = chartY - (theoretical / N0) * chartH;
      curvePath += " " + cx.toFixed(1) + " " + cy.toFixed(1) + " L";
    }
    curvePath = curvePath.slice(0, -2);

    var dicePerRow = 20;
    var diceVis = "";

      var diceSize = 8;
      for (var d = 0; d < N; d++) {
        var dx = 30 + (d % dicePerRow) * (diceSize + 2);
        var dy = 30 + Math.floor(d / dicePerRow) * (diceSize + 2);
        diceVis += '<rect x="' + dx + '" y="' + dy + '" width="' + diceSize + '" height="' + diceSize + '" rx="1" fill="#4f46e5" opacity="0.7"/>';

      + '<defs>'
      +   '<pattern id="phylabDecayGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99,102,241,0.05)" stroke-width="1"/></pattern>'

      + '<line x1="' + axisX + '" y1="' + axisY + '" x2="' + axisX + '" y2="' + yAxisTop + '" stroke="#64748b" stroke-width="1.5"/>'

      /* Y-axis labels */
      + '<text x="' + (chartX - 8) + '" y="' + (chartY + 4) + '" font-size="9" fill="#94a3b8" text-anchor="end" font-family="monospace">0</text>'
      + '<text x="' + (chartX - 8) + '" y="' + (chartY - chartH / 2 + 4) + '" font-size="9" fill="#94a3b8" text-anchor="end" font-family="monospace">' + (N0 / 2) + '</text>'
      + '<text x="' + (chartX - 8) + '" y="' + (chartY - chartH + 4) + '" font-size="9" fill="#94a3b8" text-anchor="end" font-family="monospace">' + N0 + '</text>'
      + '<text x="' + (chartX - 50) + '" y="' + (chartY - chartH / 2) + '" font-size="10" fill="#94a3b8" font-family="monospace">N</text>'

      /* X-axis labels */
      + '<text x="' + (chartX + chartW / 2) + '" y="' + (chartY + 18) + '" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="monospace">throws</text>'

      /* Theoretical curve */
      + '<path d="' + curvePath + '" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>'

      /* Bars */
      + bars

      /* Info box */
      + '<rect x="460" y="230" width="220" height="90" rx="8" fill="rgba(15,23,42,0.78)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>'
      + '<text x="475" y="250" font-size="10" fill="#64748b" font-family="monospace">N = N0 (1-p)^t</text>'
      + '<text x="475" y="270" font-size="10" fill="#64748b" font-family="monospace">N0 = ' + N0 + '</text>'
      + '<text x="475" y="288" font-size="10" fill="#64748b" font-family="monospace">p = ' + pDecay.toFixed(3) + ' per throw</text>'
      + '<text x="475" y="306" font-size="10" fill="#fbbf24" font-family="monospace">Theoretical half-life ≈ ' + (Math.log(0.5) / Math.log(1 - pDecay)).toFixed(2) + '</text>';
  },
  updateReadouts: function () {
    var s = this.state;
    var rEl = P16_$("phylabDecayRemain");
    if (rEl) rEl.textContent = s.currentDice;
    var tEl = P16_$("phylabDecayRound");
    if (tEl) tEl.textContent = s.rounds;
  },
  doThrow: function () {
    var s = this.state;
    var pDecay;
    if (s.decayThreshold === 6) pDecay = 1 / 6;
    else if (s.decayThreshold === 5) pDecay = 2 / 6;
    else if (s.decayThreshold === 4) pDecay = 3 / 6;
    else pDecay = 1 / 6;

    var remaining = 0;
    for (var i = 0; i < s.currentDice; i++) {
      /* Each die decays with probability pDecay */
      if (Math.random() >= pDecay) remaining++;
    }
    s.currentDice = remaining;
    s.rounds++;
    s.decayCounts.push(remaining);
    this.renderSVG();
    this.updateReadouts();
    this.renderData();

    if (s.currentDice <= 0) {
      s.running = false;
      P16_$("phylabStepText").textContent = "全部骰子已衰變，實驗結束";

      P16_$("phylabStepText").textContent = "步驟 2：第 " + s.rounds + " 次投擲完成，剩餘 " + s.currentDice + " 顆";

      if (self.state.currentDice <= 0) return;

    if (autoBtn) autoBtn.addEventListener("click", function () {

        setTimeout(loop, 400);
      })();

    });

      self.renderSVG();
      self.updateReadouts();
      self.renderData();

    var finishBtn = P16_$("phylabDecayFinish");
    if (finishBtn) finishBtn.addEventListener("click", function () {
      if (self.state.rounds < 3) {
        if (typeof PHYLAB_toast === "function") PHYLAB_toast("請至少投擲 3 次", "warn");
        return;
      }
      self.state.data.push({
        N0: self.state.numDice,
        rounds: self.state.rounds,
        decayCounts: self.state.decayCounts.slice()
      });
      self.renderData();
      P16_$("phylabStepText").textContent = "已記錄本次實驗（" + self.state.rounds + " 次投擲）";
    });
  },
  renderData: function () {
    var el = P16_$("phylabDecayData");
    if (!el) return;
    var s = this.state;
    var counts = s.decayCounts;
    if (counts.length === 0) {
      el.innerHTML = '<table class="phylab-data-table"><tr class="empty"><td>尚未投擲</td></tr></table>';
      return;
    }
    var html = '<table class="phylab-data-table"><thead><tr><th>t</th><th>N</th></tr></thead><tbody>';
    for (var i = 0; i < Math.min(counts.length, 12); i++) {
      html += '<tr><td>' + (i + 1) + '</td><td>' + counts[i] + '</td></tr>';
    }
    if (counts.length > 12) html += '<tr><td>...</td><td>...</td></tr>';
    html += '</tbody></table>';
    el.innerHTML = html;
  },
  score: function () {
    var s = this.state;
    if (s.decayCounts.length < 3) return { error: "請至少投擲 3 次" };

    /* Calculate experimental half-life: first round where N < N0/2 */
    var N0 = s.numDice;
    var halfLife = -1;
    for (var i = 0; i < s.decayCounts.length; i++) {
      if (s.decayCounts[i] <= N0 / 2) {
        halfLife = i + 1;
        break;
      }
    }

    /* Theoretical half-life */
    var pDecay;
    if (s.decayThreshold === 6) pDecay = 1 / 6;
    else if (s.decayThreshold === 5) pDecay = 2 / 6;
    else pDecay = 3 / 6;
    var theoretical = Math.log(0.5) / Math.log(1 - pDecay);

    if (halfLife < 0) halfLife = s.decayCounts.length;
    var errorPct = Math.abs(halfLife - theoretical) / theoretical * 100;

    var score;
    if (errorPct < 15) score = 100;
    else if (errorPct < 30) score = 85;
    else if (errorPct < 50) score = 70;
    else score = 55;

    var advice = [];
    advice.push("放射衰變是隨機過程，但大量原子核的整體行為遵循指數衰變規律 N = N0 e^(-λt)。");
    advice.push("理論半衰期 = ln(2) / λ。對於「骰 6 衰變」實驗，每次衰變概率 p = 1/6，理論半衰期 ≈ " + theoretical.toFixed(2) + " 次投擲。");
    advice.push("你的實驗半衰期 ≈ " + halfLife + " 次投擲。");
    advice.push("注意：骰子數越多，實驗曲線越接近理論曲線（大數定律）。");
    advice.push("半衰期是統計量，不會因初始數量或環境而改變。");
    return {
      score: score, measured: halfLife, expected: theoretical,
      unit: "throws", errorPct: errorPct, advice: advice
    };
  }
};

      var lambdaPx = (lambda * 100) / 100 * ((tubeBotY - tubeTopY) / 100); /* map cm to px */

      /* Draw standing wave pattern: node at water, antinode at top */
      for (var y = waterY - 2; y > tubeTopY + 5; y -= 2) {
        var distFromWater = waterY - y;
        var phase = (distFromWater / wlPx) * 2 * Math.PI;
        var amp = Math.sin(phase) * 15 * intensity;
        airWaves += '<circle cx="' + (tubeX + tubeW / 2 + amp) + '" cy="' + y + '" r="1.5" fill="#10b981" opacity="0.8"/>';
      }

    /* Intensity bar */

      + '<text x="45" y="52" font-size="10" fill="#64748b" font-family="monospace">v = f lambda</text>'
      + '<text x="45" y="72" font-size="10" fill="#64748b" font-family="monospace">f = ' + freq + ' Hz</text>'
      + '<text x="45" y="90" font-size="10" fill="#64748b" font-family="monospace">L = ' + L.toFixed(1) + ' cm</text>'
      + '<text x="45" y="108" font-size="10" fill="#a5b4fc" font-family="monospace">Intensity: ' + (intensity * 100).toFixed(0) + '%</text>';

  renderRuler: function (x, y1, y2) {
    var out = '';
    var h = y2 - y1;
    for (var i = 0; i <= 20; i++) {
      var y = y1 + h * i / 20;
      var major = (i % 5 === 0);
      out += '<line x1="' + x + '" y1="' + y + '" x2="' + (x + (major ? 25 : 15)) + '" y2="' + y + '" stroke="' + (major ? "#cbd5e1" : "#64748b") + '" stroke-width="' + (major ? 1.5 : 1) + '"/>';
      if (major) {
        out += '<text x="' + (x + 30) + '" y="' + (y + 4) + '" font-size="9" fill="#cbd5e1" font-family="monospace">' + (i * 5) + '</text>';
      }
    }
    return out;
  },
  updateReadouts: function () {

        /* If near L1, λ = 4L; if near L3, λ = 4L/3 */
        var r = this.getResonanceLengths();
        var d1 = Math.abs(L - r.L1);
        var d3 = Math.abs(L - r.L3);
        var lambdaMeasured = (d1 < d3) ? (4 * L) : (4 * L / 3);
        lamEl.innerHTML = (lambdaMeasured * 100).toFixed(1) + '<span class="phylab-readout-unit">cm</span>';

  bindControls: function () {

      var r = self.getResonanceLengths();
      var d1 = Math.abs(L - r.L1);
      var d3 = Math.abs(L - r.L3);
      var which = (d1 < d3) ? 1 : 3;
      var lambdaMeasured = (which === 1) ? (4 * L) : (4 * L / 3);
      self.state.data.push({
        freq: self.state.freq,
        L: L,
        Lcm: self.state.waterLevelCm,
        harmonic: which,
        lambda: lambdaMeasured,
        v: lambdaMeasured * self.state.freq
      });

  renderData: function () {

    if (d.length === 0) {
      el.innerHTML = '<table class="phylab-data-table"><tr class="empty"><td>尚未記錄任何數據</td></tr></table>';
      return;
    }
    var html = '<table class="phylab-data-table"><thead><tr><th>f(Hz)</th><th>L(cm)</th><th>v(m/s)</th></tr></thead><tbody>';
    for (var i = 0; i < d.length; i++) {
      html += '<tr><td>' + d[i].freq + '</td><td>' + d[i].Lcm.toFixed(1) + '</td><td>' + d[i].v.toFixed(1) + '</td></tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  },
  score: function () {
    var d = this.state.data;
    if (d.length < 1) return { error: "請至少記錄 1 組共振數據" };
    var sumV = 0;
    for (var i = 0; i < d.length; i++) sumV += d[i].v;
    var vMeasured = sumV / d.length;
    var expected = this.SPEED_REAL;
    var errorPct = Math.abs(vMeasured - expected) / expected * 100;
    var score;
    if (errorPct < 3) score = 100;
    else if (errorPct < 6) score = 90;
    else if (errorPct < 12) score = 75;
    else if (errorPct < 20) score = 55;
    else score = 30;
    var advice = [];
    advice.push("共鳴條件：L = (2n−1)λ/4，其中 n = 1, 2, 3...");
    advice.push("第一共鳴點：L1 = λ/4；第二共鳴點：L3 = 3λ/4。");
    advice.push("相鄰兩個共鳴點距離 = λ/2。");
    advice.push("聲速 v = f λ。你的平均 v = " + vMeasured.toFixed(1) + " m/s");
    if (errorPct < 6) advice.push("結果良好！室溫下空氣中的聲速約 340 m/s。");
    else advice.push("誤差較大。請確認共鳴點位置（最大聲時）與溫度（v 隨溫度略變）。");
    advice.push("注意：管末端效應（end correction）會使有效長度比實際長約 0.6r（r 為管半徑）。");
    return {
      score: score, measured: vMeasured, expected: expected,
      unit: this.unit, errorPct: errorPct, advice: advice
    };
  }
};

  renderSVG: function () {
    var svg = P17_$("phylabDsSVG");
    if (!svg) return;
    var s = this.state;
    var lambda = s.wavelengthNm;
    /* Color from wavelength */
    function wlToColor(wl) {
      var r, g, b;
      if (wl < 440) { r = (440 - wl) / 60; g = 0; b = 1; }
      else if (wl < 490) { r = 0; g = (wl - 440) / 50; b = 1; }
      else if (wl < 510) { r = 0; g = 1; b = (510 - wl) / 20; }
      else if (wl < 580) { r = (wl - 510) / 70; g = 1; b = 0; }
      else if (wl < 645) { r = 1; g = (645 - wl) / 65; b = 0; }
      else { r = 1; g = 0; b = 0; }
      r = Math.round(r * 255); g = Math.round(g * 255); b = Math.round(b * 255);
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
    var color = wlToColor(lambda);

    var laserX = 60, laserY = 200;
    var slitX = 300;
    var screenX = 620;
    var screenTopY = 60, screenBotY = 340;
    var screenCenterY = (screenTopY + screenBotY) / 2;

    /* Fringe spacing on screen (in px) */
    var fringeSpacingMm = this.getFringeSpacingMm();
    /* Fringe spacing (mm) maps to px: use 20 mm across 280 px window */
    var screenMmPerPx = 40 / (screenBotY - screenTopY);
    var fringeSpacingPx = fringeSpacingMm / screenMmPerPx;
    /* Clamp to visible range */
    if (fringeSpacingPx > 60) fringeSpacingPx = 60;

      /* Position on screen in mm */
      var yMm = dy * screenMmPerPx;
      /* Envelope: single slit diffraction */
      var envelope = Math.exp(-Math.pow(yMm / (fringeSpacingMm * 8), 2));
      /* Interference */
      var intensity = Math.pow(Math.cos(Math.PI * yMm / fringeSpacingMm), 2) * envelope;
      /* Distance from pointer */
      var ptrDy = Math.abs(y - screenCenterY);
      var opacity = 0.3 + intensity * 0.7;
      var w = 8;
      fringes += '<rect x="' + (screenX - w / 2) + '" y="' + y + '" width="' + w + '" height="3" fill="' + color + '" opacity="' + opacity.toFixed(2) + '"/>';
    }

    var ray1EndY = screenCenterY + fringeSpacingPx;
    var ray2EndY = screenCenterY - fringeSpacingPx;

      + '<defs>'

      + '<rect x="' + (slitX - 3) + '" y="' + (screenTopY + 20) + '" width="6" height="' + (screenBotY - screenTopY - 40) + '" fill="#334155"/>'

      + '<line x1="' + (slitX + 3) + '" y1="' + (laserY + slitSepPx / 2) + '" x2="' + screenX + '" y2="' + ray2EndY + '" stroke="' + color + '" stroke-width="0.8" opacity="0.35"/>'
      + '<line x1="' + (slitX + 3) + '" y1="' + (laserY - slitSepPx / 2) + '" x2="' + screenX + '" y2="' + ray1EndY + '" stroke="' + color + '" stroke-width="0.8" opacity="0.35"/>'
      + '<line x1="' + (slitX + 3) + '" y1="' + (laserY + slitSepPx / 2) + '" x2="' + screenX + '" y2="' + ray1EndY + '" stroke="' + color + '" stroke-width="0.8" opacity="0.35"/>'

      /* Screen */
      + '<rect x="' + (screenX - 20) + '" y="' + screenTopY + '" width="40" height="' + (screenBotY - screenTopY) + '" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>'

      self.state.data.push({

      return;

    var html = '<table class="phylab-data-table"><thead><tr><th>d(mm)</th><th>D(m)</th><th>Δy(mm)</th></tr></thead><tbody>';

      html += '<tr><td>' + d[i].d.toFixed(2) + '</td><td>' + d[i].D.toFixed(1) + '</td><td>' + d[i].spacingMm.toFixed(3) + '</td></tr>';

  score: function () {
    var d = this.state.data;
    if (d.length < 1) return { error: "請至少記錄 1 組數據" };
    var avgLam = 0;
    for (var i = 0; i < d.length; i++) avgLam += d[i].lambdaMeasured;
    avgLam /= d.length;
    var expected = this.state.wavelengthNm;
    var errorPct = Math.abs(avgLam - expected) / expected * 100;
    var score;
    if (errorPct < 2) score = 100;
    else if (errorPct < 5) score = 90;
    else if (errorPct < 10) score = 75;
    else score = 55;
    var advice = [];
    advice.push("條紋間距公式：Δy = λD/d。");
    advice.push("波長 λ 越大，條紋間距越寬。");
    advice.push("縫距 d 越小，條紋間距越寬。");
    advice.push("屏距 D 越大，條紋間距越寬。");
    advice.push("你的實驗波長 ≈ " + avgLam.toFixed(0) + " nm（設定值 " + expected + " nm）");
    advice.push("實際實驗中，我們量度多個條紋的總距離再除以條紋數，可減低量度誤差。");
    return {
      score: score, measured: avgLam, expected: expected,
      unit: this.unit, errorPct: errorPct, advice: advice
    };
  }
};

    /* Color */
    function wlToColor(wl) {
      var r, g, b;
      if (wl < 440) { r = (440 - wl) / 60; g = 0; b = 1; }
      else if (wl < 490) { r = 0; g = (wl - 440) / 50; b = 1; }
      else if (wl < 510) { r = 0; g = 1; b = (510 - wl) / 20; }
      else if (wl < 580) { r = (wl - 510) / 70; g = 1; b = 0; }
      else if (wl < 645) { r = 1; g = (645 - wl) / 65; b = 0; }
      else { r = 1; g = 0; b = 0; }
      return 'rgb(' + Math.round(r * 255) + ',' + Math.round(g * 255) + ',' + Math.round(b * 255) + ')';
    }
    var color = wlToColor(lambda);

    var gratingX = 350, gratingY = 210;
    var beamLen = 220;

    /* Incident beam (from left) */
    var incStartX = gratingX - beamLen;
    var incY = gratingY;

      beams += '<path d="M ' + (gratingX + arcR) + ' ' + gratingY + ' A ' + arcR + ' ' + arcR + ' 0 0 0 ' + arcX.toFixed(1) + ' ' + arcY.toFixed(1) + '" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>';

      + '<line x1="' + incStartX + '" y1="' + incY + '" x2="' + gratingX + '" y2="' + gratingY + '" stroke="' + color + '" stroke-width="2.5" opacity="0.9"/>'
      + '<text x="' + (incStartX + 20) + '" y="' + (incY - 12) + '" font-size="10" fill="' + color + '" font-family="monospace">INCIDENT</text>'

      + '<rect x="' + (gratingX - 25) + '" y="' + (gratingY - 75) + '" width="50" height="150" rx="4" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1.5"/>'
      + gratingLines

    if (dS) dS.addEventListener("input", function () {
      self.state.linesPerMm = parseInt(this.value, 10);
      P17_$("phylabGratDVal").textContent = self.state.linesPerMm + " lines/mm";
      self.renderSVG(); self.updateReadouts();
    });
    function setOrder(n, btn) {
      self.state.order = n;
      [P17_$("phylabGratN1"), P17_$("phylabGratN2"), P17_$("phylabGratN3")].forEach(function (b) {
        if (b) b.style.background = b === btn ? "linear-gradient(135deg,#6366f1,#7c3aed)" : "";
      });
      self.renderSVG(); self.updateReadouts();
    }
    var n1 = P17_$("phylabGratN1");
    var n2 = P17_$("phylabGratN2");
    var n3 = P17_$("phylabGratN3");
    if (n1) n1.addEventListener("click", function () { setOrder(1, n1); });
    if (n2) n2.addEventListener("click", function () { setOrder(2, n2); });
    if (n3) n3.addEventListener("click", function () { setOrder(3, n3); });
    if (n1) n1.style.background = "linear-gradient(135deg,#6366f1,#7c3aed)";

    var recBtn = P17_$("phylabGratRecord");
    if (recBtn) recBtn.addEventListener("click", function () {
      var theta = self.getThetaDeg();
      if (theta === null) {
        if (typeof PHYLAB_toast === "function") PHYLAB_toast("此級數無繞射（sinθ > 1），請降低級數或增加光柵密度", "warn");
        return;
      }
      var d = self.getGratingSpacingM();
      var lambdaMeasured = d * Math.sin(theta * Math.PI / 180) / self.state.order * 1e9;
      self.state.data.push({
        n: self.state.order,
        theta: theta,
        d: d,
        linesPerMm: self.state.linesPerMm,
        lambdaSet: self.state.wavelengthNm,
        lambdaMeasured: lambdaMeasured
      });
      self.renderData();
      P17_$("phylabStepText").textContent = "步驟 2：已記錄 " + self.state.data.length + " 組數據";
    });
    var clrBtn = P17_$("phylabGratClear");
    if (clrBtn) clrBtn.addEventListener("click", function () {
      self.state.data = []; self.renderData();
    });
  },
  renderData: function () {
    var el = P17_$("phylabGratData");
    if (!el) return;
    var d = this.state.data;
    if (d.length === 0) {
      el.innerHTML = '<table class="phylab-data-table"><tr class="empty"><td>尚未記錄任何數據</td></tr></table>';
      return;
    }
    var html = '<table class="phylab-data-table"><thead><tr><th>n</th><th>θ(°)</th><th>λ(nm)</th></tr></thead><tbody>';
    for (var i = 0; i < d.length; i++) {
      html += '<tr><td>' + d[i].n + '</td><td>' + d[i].theta.toFixed(2) + '</td><td>' + d[i].lambdaMeasured.toFixed(0) + '</td></tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  },
  score: function () {
    var d = this.state.data;
    if (d.length < 1) return { error: "請至少記錄 1 組數據" };
    var avgLam = 0;
    for (var i = 0; i < d.length; i++) avgLam += d[i].lambdaMeasured;
    avgLam /= d.length;
    var expected = this.state.wavelengthNm;
    var errorPct = Math.abs(avgLam - expected) / expected * 100;
    var score;
    if (errorPct < 2) score = 100;
    else if (errorPct < 5) score = 90;
    else if (errorPct < 10) score = 75;
    else score = 55;
    var advice = [];
    advice.push("光柵方程：d sin θ = n λ。");
    advice.push("d 為光柵間距（相鄰兩縫距離），n 為級數，θ 為繞射角。");
    advice.push("n = 0 為中央亮紋（不偏折）；n = ±1, ±2, ... 為第一、二...級亮紋。");
    advice.push("你的實驗波長 ≈ " + avgLam.toFixed(0) + " nm");
    advice.push("使用光柵比雙縫準確，因為光柵有多條狹縫，亮紋更窄更亮。");
    advice.push("實際實驗常用鈉燈（λ ≈ 589 nm）作光源。");
    return {
      score: score, measured: avgLam, expected: expected,
      unit: this.unit, errorPct: errorPct, advice: advice
    };
  }
};

console.log("[Part 17] Added 3 experiments: sound, doubleslit, grating");
console.log("[PhyGenius Lab] All 25 experiments loaded successfully!");

})();

    setTimeout(fixToolbarOverlap, 200);

  function update() {

    barEl.classList.toggle("lab-mode", labVisible);
  }

  /* Watch lab visibility */
  var obs = new MutationObserver(update);
  obs.observe(labEl, { attributes: true, attributeFilter: ["class"] });

  var origUpdate = window.__P9_updateToolbar_wrapped;
  update();
}
