<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>PhyGenius</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' }
      }
    }
  }
};
</script>
<style>
:root {
  --primary: #4f46e5;
  --primary-dark: #4338ca;
  --primary-light: #eef2ff;
  --primary-lighter: #e0e7ff;
  --text: #1e293b;
  --text-secondary: #475569;
  --muted: #94a3b8;
  --bg: #f8fafc;
  --bg-elevated: #ffffff;
  --card: #ffffff;
  --card-hover: #fafbff;
  --border: #e2e8f0;
  --border-light: #f1f5f9;
  --success: #10b981;
  --success-light: #d1fae5;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
  --shadow-lg: 0 12px 32px rgba(15,23,42,0.12);
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="dark"] {
  --primary: #818cf8;
  --primary-dark: #6366f1;
  --primary-light: #1e1b4b;
  --primary-lighter: #312e81;
  --text: #e2e8f0;
  --text-secondary: #cbd5e1;
  --muted: #64748b;
  --bg: #0f172a;
  --bg-elevated: #1e293b;
  --card: #1e293b;
  --card-hover: #243447;
  --border: #334155;
  --border-light: #1e293b;
  --success: #34d399;
  --success-light: #064e3b;
  --warning: #fbbf24;
  --warning-light: #78350f;
  --danger: #f87171;
  --danger-light: #7f1d1d;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
  font-size: 14px;
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
}
.header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
  color: #fff;
  box-shadow: var(--shadow-md);
}
[data-theme="dark"] .header { background: linear-gradient(135deg, #312e81 0%, #5b21b6 100%); }
.header-inner {
  max-width: 780px; margin: 0 auto;
  padding: 0 16px; height: 60px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.logo-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo-badge {
  width: 36px; height: 36px; border-radius: 10px;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-badge svg { width: 22px; height: 22px; }
.logo-name { font-weight: 700; font-size: 17px; color: #fff; letter-spacing: -0.01em; }
.logo-ver {
  font-size: 9px; font-weight: 700;
  background: rgba(255,255,255,0.25);
  color: #fff; padding: 2px 6px; border-radius: 4px;
  letter-spacing: 0.05em;
}
.header-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #fff; transition: all var(--transition);
  font-family: inherit;
}
.icon-btn:hover { background: rgba(255,255,255,0.28); transform: scale(1.05); }
.icon-btn:active { transform: scale(0.95); }
.icon-btn svg { width: 18px; height: 18px; }
.lang-btn {
  height: 36px; padding: 0 12px; border-radius: 10px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  border: none; cursor: pointer; color: #fff;
  font-weight: 600; font-size: 12px; font-family: inherit;
  letter-spacing: 0.05em; transition: all var(--transition);
}
.lang-btn:hover { background: rgba(255,255,255,0.28); }
.streak-badge {
  display: flex; align-items: center; gap: 4px;
  background: rgba(251,191,36,0.25);
  color: #fef3c7; padding: 6px 10px; border-radius: 10px;
  font-size: 12px; font-weight: 700;
  border: 1px solid rgba(251,191,36,0.3);
  transition: transform var(--transition);
}
.streak-badge.pulse { animation: pulse 0.5s ease-out; }
@keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.15);} 100%{transform:scale(1);} }
.streak-badge svg { width: 14px; height: 14px; }
.streak-badge.hidden { display: none; }
.main { max-width: 780px; margin: 0 auto; padding: 16px; }
.panel { display: none; }
.panel.active { display: block; animation: panelIn 0.3s cubic-bezier(0.4,0,0.2,1); }
@keyframes panelIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
.page-title {
  font-size: 22px; font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 4px; color: var(--text);
}
.page-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.card {
  background: var(--card); border-radius: var(--radius-lg);
  padding: 18px; margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-light);
  transition: all var(--transition);
}
[data-theme="dark"] .card { border-color: var(--border); }
.section-label {
  font-size: 12px; font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 10px; display: block;
}
.chip-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin-bottom: 18px;
}
.chip {
  padding: 10px 8px;
  border: 2px solid var(--border);
  background: var(--card);
  border-radius: var(--radius);
  font-size: 13px; cursor: pointer;
  font-family: inherit; color: var(--text);
  text-align: center;
  transition: all var(--transition);
  font-weight: 500;
}
.chip:hover { border-color: var(--primary); transform: translateY(-1px); }
.chip.selected {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 700;
  box-shadow: 0 0 0 3px var(--primary-lighter);
}
[data-theme="dark"] .chip.selected { color: #c7d2fe; }
.btn-primary {
  width: 100%;
  background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
  color: #fff; border: none;
  padding: 15px; border-radius: var(--radius);
  font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  transition: all var(--transition);
  box-shadow: 0 4px 14px rgba(79,70,229,0.35);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  letter-spacing: -0.01em;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,70,229,0.45); }
.btn-primary:active { transform: translateY(0) scale(0.99); }
.btn-primary svg { width: 18px; height: 18px; }
.range-row { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
input[type="range"] {
  flex: 1; height: 6px; border-radius: 3px;
  background: var(--border); outline: none;
  -webkit-appearance: none; appearance: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--primary);
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(79,70,229,0.4);
  border: 3px solid var(--card);
}
input[type="range"]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--primary); cursor: pointer;
  border: 3px solid var(--card);
}
.range-val { font-weight: 800; color: var(--primary); min-width: 32px; text-align: center; font-size: 18px; }
.question {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: 18px; margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-light);
  animation: qIn 0.35s cubic-bezier(0.4,0,0.2,1);
  position: relative; overflow: hidden;
}
[data-theme="dark"] .question { border-color: var(--border); }
.question::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 4px; height: 100%;
  background: linear-gradient(180deg, var(--primary) 0%, #7c3aed 100%);
}
@keyframes qIn { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
.q-head {
  display: flex; justify-content: space-between;
  align-items: flex-start; margin-bottom: 12px;
  gap: 8px; flex-wrap: wrap;
}
.q-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge-num {
  background: var(--primary); color: #fff;
  font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px;
  letter-spacing: 0.02em;
}
.badge-topic {
  background: var(--border-light); color: var(--text-secondary);
  font-size: 11px; padding: 3px 10px;
  border-radius: 20px; font-weight: 600;
}
[data-theme="dark"] .badge-topic { background: var(--border); }
.badge-marks {
  color: var(--primary); font-size: 12px;
  font-weight: 800; padding: 3px 10px;
  background: var(--primary-light); border-radius: 20px;
}
.q-text { font-size: 15px; line-height: 1.7; margin-bottom: 14px; color: var(--text); font-weight: 500; }
.q-timer {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--muted);
  background: var(--border-light);
  padding: 3px 8px; border-radius: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .q-timer { background: var(--border); }
.q-timer svg { width: 12px; height: 12px; }
textarea {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 12px; font-size: 14px;
  font-family: inherit; resize: vertical;
  outline: none; background: var(--bg);
  min-height: 62px; color: var(--text);
  transition: all var(--transition);
  line-height: 1.5;
}
textarea:focus {
  border-color: var(--primary);
  background: var(--card);
  box-shadow: 0 0 0 4px var(--primary-lighter);
}
textarea::placeholder { color: var(--muted); }
.btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn-grade {
  flex: 1; min-width: 120px;
  background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
  color: #fff; border: none;
  padding: 11px; border-radius: var(--radius);
  font-weight: 700; font-size: 14px;
  cursor: pointer; font-family: inherit;
  transition: all var(--transition);
  box-shadow: 0 3px 10px rgba(79,70,229,0.25);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-grade:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(79,70,229,0.35); }
.btn-grade:active { transform: scale(0.98); }
.btn-grade svg { width: 16px; height: 16px; }
.btn-sol, .btn-hint {
  background: var(--border-light); color: var(--text-secondary);
  border: none; padding: 11px 16px; border-radius: var(--radius);
  font-weight: 600; font-size: 14px;
  cursor: pointer; font-family: inherit;
  transition: all var(--transition);
  display: flex; align-items: center; gap: 6px;
}
[data-theme="dark"] .btn-sol, [data-theme="dark"] .btn-hint { background: var(--border); color: var(--text); }
.btn-sol:hover, .btn-hint:hover { background: var(--border); }
[data-theme="dark"] .btn-sol:hover, [data-theme="dark"] .btn-hint:hover { background: #475569; }
.btn-sol svg, .btn-hint svg { width: 16px; height: 16px; }
.result { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); font-size: 14px; }
.result.show { display: block; animation: panelIn 0.25s ease-out; }
.result .verdict { font-weight: 800; font-size: 15px; }
.result.correct .verdict { color: var(--success); }
.result.wrong .verdict { color: var(--danger); }
.result .expected {
  font-size: 12px; color: var(--muted);
  margin-top: 6px; font-family: 'SF Mono', Menlo, monospace;
}
.score-ring-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.score-ring { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
.score-ring svg { width: 56px; height: 56px; transform: rotate(-90deg); }
.score-ring .ring-bg { fill: none; stroke: var(--border); stroke-width: 5; }
.score-ring .ring-fg { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dasharray 0.6s cubic-bezier(0.4,0,0.2,1); }
.score-ring .ring-text {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.score-meta { flex: 1; }
.score-meta .score-pts { font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
.score-meta .score-msg { font-size: 12px; color: var(--muted); margin-top: 2px; }
.hint-box {
  display: none; margin-top: 10px;
  background: var(--warning-light);
  border-left: 4px solid var(--warning);
  border-radius: var(--radius-sm);
  padding: 10px 14px; font-size: 13px;
  color: var(--text);
}
.hint-box.show { display: block; animation: panelIn 0.25s ease-out; }
.hint-label {
  font-size: 11px; font-weight: 800;
  color: var(--warning); text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 4px;
}
.solution {
  display: none; margin-top: 12px;
  background: var(--success-light);
  border: 1px solid var(--success);
  border-radius: var(--radius);
  padding: 14px; font-size: 13px;
  color: var(--text); white-space: pre-wrap;
  line-height: 1.7; font-family: 'SF Mono', Menlo, monospace;
}
.solution.show { display: block; animation: panelIn 0.25s ease-out; }
.solution .sol-label {
  font-size: 11px; font-weight: 800;
  color: var(--success); text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 8px;
  font-family: -apple-system, sans-serif;
}
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 14px; }
.stat {
  background: var(--card); border-radius: var(--radius-lg);
  padding: 18px; text-align: center;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-light);
  transition: all var(--transition);
}
[data-theme="dark"] .stat { border-color: var(--border); }
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--primary-light);
  color: var(--primary);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 8px;
}
[data-theme="dark"] .stat-icon { color: #c7d2fe; }
.stat-icon svg { width: 20px; height: 20px; }
.stat-num {
  font-size: 26px; font-weight: 800;
  color: var(--text); letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.stat-label {
  font-size: 11px; color: var(--muted);
  margin-top: 4px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.history-row {
  display: flex; justify-content: space-between;
  align-items: center; padding: 10px 0;
  border-bottom: 1px solid var(--border-light);
  font-size: 13px;
}
[data-theme="dark"] .history-row { border-color: var(--border); }
.history-row:last-child { border-bottom: none; }
.history-row .h-topic { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 500; }
.history-row .h-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.history-row .h-score {
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  padding: 3px 10px; border-radius: 10px;
  font-size: 12px;
}
.empty-msg {
  font-size: 13px; color: var(--muted);
  text-align: center; padding: 32px 16px;
  display: flex; flex-direction: column;
  align-items: center; gap: 8px;
}
.empty-msg svg { width: 40px; height: 40px; opacity: 0.4; }
.lib-card {
  background: var(--card); border-radius: var(--radius-lg);
  padding: 16px; margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-light);
  transition: all var(--transition);
}
[data-theme="dark"] .lib-card { border-color: var(--border); }
.lib-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.lib-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.lib-topic { font-weight: 700; font-size: 15px; color: var(--text); }
.lib-count {
  font-size: 11px; color: var(--primary);
  background: var(--primary-light); padding: 3px 10px;
  border-radius: 12px; font-weight: 700;
}
[data-theme="dark"] .lib-count { color: #c7d2fe; }
.lib-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.lib-chip {
  font-size: 11px; background: var(--border-light);
  color: var(--text-secondary); padding: 4px 10px;
  border-radius: 12px; font-weight: 500;
}
[data-theme="dark"] .lib-chip { background: var(--border); }
.formula-group {
  background: var(--card); border-radius: var(--radius-lg);
  padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-light);
}
[data-theme="dark"] .formula-group { border-color: var(--border); }
.formula-group h3 {
  font-size: 14px; font-weight: 700;
  color: var(--primary); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.formula-item {
  display: flex; align-items: baseline; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid var(--border-light);
  font-size: 13px;
}
[data-theme="dark"] .formula-item { border-color: var(--border); }
.formula-item:last-child { border-bottom: none; }
.formula-eq {
  font-family: 'SF Mono', Menlo, monospace;
  font-weight: 700; color: var(--text);
  background: var(--primary-light);
  padding: 3px 8px; border-radius: 6px;
  font-size: 12px;
  white-space: nowrap; flex-shrink: 0;
}
[data-theme="dark"] .formula-eq { color: #c7d2fe; }
.formula-desc { color: var(--text-secondary); font-size: 12px; line-height: 1.4; }
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
}
.tabbar-inner { display: flex; max-width: 780px; margin: 0 auto; }
.tab-btn {
  flex: 1; background: none; border: none;
  padding: 10px 4px 8px;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; font-size: 10px; font-weight: 600;
  color: var(--muted);
  font-family: inherit;
  transition: color var(--transition);
  position: relative;
}
.tab-btn.active { color: var(--primary); }
.tab-btn.active::before {
  content: '';
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  width: 32px; height: 3px;
  background: var(--primary);
  border-radius: 0 0 3px 3px;
}
.tab-btn:hover:not(.active) { color: var(--text-secondary); }
.tab-icon { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; }
.tab-icon svg { width: 22px; height: 22px; }
.toast {
  position: fixed;
  bottom: calc(90px + env(safe-area-inset-bottom));
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg);
  padding: 12px 20px; border-radius: 24px;
  font-size: 13px; font-weight: 600;
  box-shadow: var(--shadow-lg);
  z-index: 200;
  opacity: 0; pointer-events: none;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  display: flex; align-items: center; gap: 8px;
  max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast svg { width: 18px; height: 18px; }
#confettiCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 300; }
.error-banner {
  background: var(--danger-light); border: 1px solid var(--danger);
  color: var(--danger);
  padding: 12px 14px; border-radius: var(--radius);
  margin-bottom: 16px; font-size: 12px;
  font-family: 'SF Mono', Menlo, monospace;
  display: none; word-break: break-all;
}
.error-banner.show { display: block; }

function PHY_rand(min, max, step) {
  if (!step) { step = 1; }

}

function PHY_f2(x) { return Number(x).toFixed(2); }
function PHY_f1(x) { return Number(x).toFixed(1); }

function PHY_fmtTime(sec) {
  if (sec < 60) { return sec + PHY_t("time_sec"); }
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return m + PHY_t("time_min") + " " + s + PHY_t("time_sec");
}

function PHY_esc(s) {
  var str = String(s);
  var out = "";
  for (var i = 0; i < str.length; i++) {
    var c = str.charAt(i);
    if (c === "&") { out += "&amp;"; }
    else if (c === "<") { out += "&lt;"; }
    else if (c === ">") { out += "&gt;"; }
    else if (c === '"') { out += "&quot;"; }
    else { out += c; }
  }
  return out;
}

function PHY_loadState() {

    var h = localStorage.getItem("phy_history_v2");

  } catch (e1) { PHY_STATE.history = []; }

    var lang = localStorage.getItem("phy_lang_v2");
    if (lang === "en" || lang === "zh") { PHY_LANG = lang; }
  } catch (e2) {}
  try {
    var theme = localStorage.getItem("phy_theme_v2");
    if (theme === "dark" || theme === "light") {
      document.documentElement.setAttribute("data-theme", theme);
    }
  } catch (e3) {}
  try {
    var notes = localStorage.getItem("phy_notes_v2");
    if (notes) { PHY_STATE.notes = JSON.parse(notes); }
  } catch (e4) { PHY_STATE.notes = {}; }
  try {
    var streak = localStorage.getItem("phy_streak_v2");
    if (streak) {
      var s = JSON.parse(streak);
      PHY_STATE.currentStreak = s.current || 0;
      PHY_STATE.bestStreak = s.best || 0;
    }
  } catch (e5) {}
}

   THEME
   ============================================================ */
function PHY_applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  var lightIcon = PHY_$("themeIconLight");
  var darkIcon = PHY_$("themeIconDark");
  if (lightIcon && darkIcon) {
    if (theme === "dark") {
      lightIcon.classList.add("hidden");
      darkIcon.classList.remove("hidden");
    } else {
      lightIcon.classList.remove("hidden");
      darkIcon.classList.add("hidden");
    }
  }
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    meta.setAttribute("content", theme === "dark" ? "#312e81" : "#4f46e5");
  }
}

function PHY_toggleTheme() {
  var current = document.documentElement.getAttribute("data-theme") || "light";
  var next = (current === "dark") ? "light" : "dark";
  PHY_applyTheme(next);
  PHY_saveTheme(next);
}

/* ============================================================
   CONFETTI
   ============================================================ */
var PHY_confettiParticles = [];
var PHY_confettiRAF = null;

function PHY_launchConfetti() {
  var canvas = PHY_$("confettiCanvas");
  if (!canvas) { return; }
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var colors = ["#4f46e5", "#7c3aed", "#ec4899", "#f59e0b", "#10b981", "#3b82f6"];
  for (var i = 0; i < 60; i++) {
    PHY_confettiParticles.push({
      x: canvas.width / 2 + (Math.random() - 0.5) * 200,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 12,
      vy: Math.random() * -12 - 4,
      size: 6 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      vr: (Math.random() - 0.5) * 20,
      life: 1
    });
  }
  if (!PHY_confettiRAF) {
    PHY_confettiRAF = requestAnimationFrame(PHY_confettiStep);
  }
}

function PHY_confettiStep() {
  var canvas = PHY_$("confettiCanvas");
  if (!canvas) { return; }
  var ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  var alive = false;
  for (var i = 0; i < PHY_confettiParticles.length; i++) {
    var p = PHY_confettiParticles[i];
    if (p.life <= 0) { continue; }
    p.vy += 0.4;
    p.x += p.vx;
    p.y += p.vy;
    p.rotation += p.vr;
    p.life -= 0.012;
    if (p.y > canvas.height + 50) { p.life = 0; }
    if (p.life > 0) {
      alive = true;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.5);
      ctx.restore();
    }
  }
  PHY_confettiParticles = PHY_confettiParticles.filter(function (p) { return p.life > 0; });
  if (alive) {
    PHY_confettiRAF = requestAnimationFrame(PHY_confettiStep);
  } else {
    PHY_confettiRAF = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

window.addEventListener("resize", function () {
  var canvas = PHY_$("confettiCanvas");
  if (canvas) {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

        PHY_STATE.diff = diff.id;
        var all = grid.querySelectorAll(".chip");
        for (var k = 0; k < all.length; k++) { all[k].classList.remove("selected"); }
        btn.classList.add("selected");
      });
      grid.appendChild(btn);
    })(PHY_DIFFS[i]);
  }
}

/* ============================================================
   GENERATE QUESTIONS  (fixed fallback logic)
   ============================================================ */
function PHY_generateQuestions() {
  var qCountEl = PHY_$("qCount");
  if (!qCountEl) { return; }
  var count = parseInt(qCountEl.value, 10);

  /* ---- Step 1: filter by topic only ---- */
  var topicPool = PHY_TEMPLATES.slice();
  if (PHY_STATE.topic !== "all") {
    topicPool = topicPool.filter(function (tpl) {
      return tpl.topic_zh === PHY_STATE.topic;
    });
  }
  if (topicPool.length === 0) {
    PHY_toast(PHY_t("toast_no_topic"), "warn");
    return;
  }

  /* ---- Step 2: within topic, filter by difficulty ---- */
  var pool = topicPool;
  var fallbackUsed = false;

  if (PHY_STATE.diff !== "all") {
    var diffPool = topicPool.filter(function (tpl) {
      return tpl.difficulty === PHY_STATE.diff;
    });
    if (diffPool.length > 0) {
      pool = diffPool;
    } else {
      /* No questions at this difficulty for this topic.
         Stay within the SAME topic; just fall back to other difficulties. */
      pool = topicPool;
      fallbackUsed = true;
    }
  }

  /* ---- Step 3: build questions ---- */
  PHY_STATE.qs = [];
  PHY_STATE.notes = {};
  PHY_STATE.timers = {};
  PHY_STATE.sessionStart = Date.now();

  for (var i = 0; i < count; i++) {
    var tpl = pool[Math.floor(Math.random() * pool.length)];
    var result = tpl.gen(PHY_LANG);
    result.template_id = tpl.id;
    result.topic_zh = tpl.topic_zh;
    result.topic_en = tpl.topic_en;
    result.subtopic_zh = tpl.subtopic_zh;
    result.subtopic_en = tpl.subtopic_en;
    PHY_STATE.qs.push(result);
  }
  PHY_renderQuestions();

  /* ---- Step 4: toast ---- */
  if (fallbackUsed) {
    PHY_toast(PHY_t("toast_fallback_diff"), "info");
  } else {
    PHY_toast(PHY_t("toast_generated") + " (" + count + ")", "info");
  }
}

/* ============================================================
   TIMER
   ============================================================ */
function PHY_startTimer(idx) {
  function tick() {
    var t = PHY_STATE.timers[idx];
    if (!t || t.stopped) { return; }
    var elapsed = Math.floor((Date.now() - t.start) / 1000);
    t.elapsed = elapsed;
    var m = Math.floor(elapsed / 60);
    var s = elapsed % 60;
    var txt = m + ":" + (s < 10 ? "0" : "") + s;
    var el = PHY_$("timerTxt-" + idx);
    if (el) { el.textContent = txt; }
    setTimeout(tick, 1000);
  }
  tick();
}

function PHY_stopTimer(idx) {
  var t = PHY_STATE.timers[idx];
  if (t) { t.stopped = true; }
}

/* ============================================================
   GRADING
   ============================================================ */
function PHY_extractNumbers(text) {
  var nums = [];
  var re = /-?\d+\.?\d*(?:[eE][+-]?\d+)?/g;
  var m;
  while ((m = re.exec(text)) !== null) {
    var n = parseFloat(m[0]);
    if (!isNaN(n)) { nums.push(n); }
  }
  return nums;
}

function PHY_gradeQuestion(idx) {
  var q = PHY_STATE.qs[idx];
  if (!q) { return; }
  var ta = PHY_$("ans-" + idx);
  if (!ta) { return; }
  var text = ta.value.trim();
  if (!text) {
    PHY_toast(PHY_t("alert_enter_answer"), "info");
    return;
  }

  var nums = PHY_extractNumbers(text);
  var tol = Math.abs(q.answer) * 0.02 + 1e-9;
  var hit = false;
  for (var n = 0; n < nums.length; n++) {
    if (Math.abs(nums[n] - q.answer) <= tol) { hit = true; break; }
  }

  PHY_stopTimer(idx);
  var elapsed = PHY_STATE.timers[idx] ? PHY_STATE.timers[idx].elapsed : 0;
  var score = hit ? q.marks : 0;
  var pct = Math.round((score / q.marks) * 100);

  var res = PHY_$("res-" + idx);
  if (!res) { return; }

  var verdictClass = hit ? "correct" : "wrong";
  var verdictText = hit ? PHY_t("verdict_correct") : PHY_t("verdict_wrong");
  var ringColor = hit ? "var(--success)" : "var(--danger)";
  var circumference = 2 * Math.PI * 24;
  var dashArr = (pct / 100) * circumference;

  res.className = "result show " + verdictClass;
  res.innerHTML = "";

  /* ring + meta */
  var ringWrap = document.createElement("div");
  ringWrap.className = "score-ring-wrap";

  var ring = document.createElement("div");
  ring.className = "score-ring";
  ring.innerHTML = '<svg viewBox="0 0 56 56">'
    + '<circle class="ring-bg" cx="28" cy="28" r="24"/>'
    + '<circle class="ring-fg" cx="28" cy="28" r="24" stroke="' + ringColor + '" stroke-dasharray="' + dashArr + ' ' + circumference + '"/>'
    + '</svg>'
    + '<div class="ring-text" style="color: ' + ringColor + ';">' + pct + '%</div>';
  ringWrap.appendChild(ring);

  var meta = document.createElement("div");
  meta.className = "score-meta";
  var pts = document.createElement("div");
  pts.className = "score-pts";
  pts.textContent = score + " / " + q.marks;
  var msg = document.createElement("div");
  msg.className = "score-msg";
  msg.textContent = verdictText + " · " + elapsed + PHY_t("time_sec");
  meta.appendChild(pts);
  meta.appendChild(msg);
  ringWrap.appendChild(meta);

  res.appendChild(ringWrap);

  var expected = document.createElement("div");
  expected.className = "expected";
  expected.textContent = PHY_t("expected_prefix") + PHY_f2(q.answer) + " " + q.unit;
  res.appendChild(expected);

  /* streak */
  if (hit) {
    PHY_STATE.currentStreak += 1;
    if (PHY_STATE.currentStreak > PHY_STATE.bestStreak) {
      PHY_STATE.bestStreak = PHY_STATE.currentStreak;
    }
    PHY_toast(PHY_t("toast_correct") + " " + PHY_STATE.currentStreak + "!", "success");
    PHY_launchConfetti();
    var streakBadge = PHY_$("streakBadge");
    if (streakBadge) {
      streakBadge.classList.add("pulse");
      setTimeout(function () { streakBadge.classList.remove("pulse"); }, 500);
    }
  } else {
    PHY_STATE.currentStreak = 0;
    PHY_toast(PHY_t("toast_wrong"), "info");
  }
  PHY_saveStreak();
  PHY_updateStreakBadge();

  /* push history */
  PHY_STATE.history.push({
    topic_zh: q.topic_zh,
    topic_en: q.topic_en,
    score: score,
    total: q.marks,
    elapsed: elapsed,
    ts: Date.now()
  });
  PHY_saveHistory();
}

function PHY_updateStreakBadge() {
  var badge = PHY_$("streakBadge");
  var count = PHY_$("streakCount");
  if (!badge || !count) { return; }
  if (PHY_STATE.currentStreak > 0) {
    badge.classList.remove("hidden");
    count.textContent = PHY_STATE.currentStreak;
  } else {
    badge.classList.add("hidden");
  }
}

/* ============================================================
   REPORT
   ============================================================ */
function PHY_renderReport() {
  var h = PHY_STATE.history;
  var totalEl = PHY_$("statTotal");
  var avgEl = PHY_$("statAvg");
  var streakEl = PHY_$("statStreak");
  var timeEl = PHY_$("statTime");
  if (!totalEl) { return; }

  totalEl.textContent = h.length;

  if (h.length > 0) {
    var sum = 0;
    var totalTime = 0;
    for (var i = 0; i < h.length; i++) {
      sum += (h[i].score / h[i].total) * 100;
      totalTime += (h[i].elapsed || 0);
    }
    avgEl.textContent = Math.round(sum / h.length) + "%";
    var totalMin = Math.round(totalTime / 60);
    timeEl.innerHTML = totalMin + '<span style="font-size:14px;">m</span>';
  } else {
    avgEl.textContent = "--";
    timeEl.innerHTML = '0<span style="font-size:14px;">m</span>';
  }

  streakEl.textContent = PHY_STATE.bestStreak;

  var list = PHY_$("history");
  if (!list) { return; }
  list.innerHTML = "";

  if (h.length === 0) {
    var empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>'
      + '<span>' + PHY_esc(PHY_t("no_records")) + '</span>';
    list.appendChild(empty);
    return;
  }

  var recent = h.slice(-12).reverse();
  for (var j = 0; j < recent.length; j++) {
    (function (rec) {
      var topicName = (PHY_LANG === "en") ? rec.topic_en : rec.topic_zh;
      var pct = Math.round((rec.score / rec.total) * 100);
      var bgColor, fgColor;
      if (pct >= 70) { bgColor = "var(--success-light)"; fgColor = "var(--success)"; }
      else if (pct >= 40) { bgColor = "var(--warning-light)"; fgColor = "var(--warning)"; }
      else { bgColor = "var(--danger-light)"; fgColor = "var(--danger)"; }

      var row = document.createElement("div");
      row.className = "history-row";

      var topicSpan = document.createElement("span");
      topicSpan.className = "h-topic";
      var dot = document.createElement("span");
      dot.className = "h-dot";
      dot.style.background = fgColor;
      topicSpan.appendChild(dot);
      var nameSpan = document.createElement("span");
      nameSpan.textContent = topicName;
      topicSpan.appendChild(nameSpan);
      row.appendChild(topicSpan);

      var scoreSpan = document.createElement("span");
      scoreSpan.className = "h-score";
      scoreSpan.style.background = bgColor;
      scoreSpan.style.color = fgColor;
      scoreSpan.textContent = rec.score + " / " + rec.total;
      row.appendChild(scoreSpan);

      list.appendChild(row);
    })(recent[j]);
  }
}

/* ============================================================
   EXPORT
   ============================================================ */
function PHY_exportReport() {
  var h = PHY_STATE.history;
  if (h.length === 0) {
    PHY_toast(PHY_t("toast_no_data"), "info");
    return;
  }
  var lines = [];
  lines.push("PhyGenius Report - " + new Date().toLocaleString());
  lines.push("==================================================");
  lines.push("");
  lines.push("Total Attempts: " + h.length);
  var sum = 0;
  var totalTime = 0;
  for (var i = 0; i < h.length; i++) {
    sum += (h[i].score / h[i].total) * 100;
    totalTime += (h[i].elapsed || 0);
  }
  lines.push("Average Score: " + Math.round(sum / h.length) + "%");
  lines.push("Best Streak: " + PHY_STATE.bestStreak);
  lines.push("Total Time: " + Math.round(totalTime / 60) + " min");
  lines.push("");
  lines.push("Recent Attempts:");
  lines.push("--------------------------------------------------");
  var recent = h.slice(-30).reverse();
  for (var j = 0; j < recent.length; j++) {
    var r = recent[j];
    var d = new Date(r.ts);
    lines.push(d.toLocaleDateString() + " " + d.toLocaleTimeString() + " | " + r.topic_en + " | " + r.score + "/" + r.total);
  }

  var text = lines.join("\n");
  try {
    var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "phygenius-report-" + Date.now() + ".txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    PHY_toast(PHY_t("toast_exported"), "success");
  } catch (e) {
    PHY_toast("Export failed", "info");
  }
}

/* ============================================================
   LIBRARY
   ============================================================ */
function PHY_renderLibrary() {
  var countEl = PHY_$("tplCount");
  if (countEl) { countEl.textContent = PHY_TEMPLATES.length; }

  var container = PHY_$("libraryList");
  if (!container) { return; }
  container.innerHTML = "";

  var byTopic = {};
  for (var i = 0; i < PHY_TEMPLATES.length; i++) {
    var tpl = PHY_TEMPLATES[i];
    var key = (PHY_LANG === "en") ? tpl.topic_en : tpl.topic_zh;
    if (!byTopic[key]) { byTopic[key] = []; }
    var subKey = (PHY_LANG === "en") ? tpl.subtopic_en : tpl.subtopic_zh;
    byTopic[key].push(subKey);
  }

  var keys = Object.keys(byTopic);
  for (var k = 0; k < keys.length; k++) {
    var topic = keys[k];
    var subs = byTopic[topic];
    var card = document.createElement("div");
    card.className = "lib-card";

    var head = document.createElement("div");
    head.className = "lib-head";
    head.innerHTML = '<span class="lib-topic">' + PHY_esc(topic) + '</span>'
      + '<span class="lib-count">' + subs.length + ' ' + PHY_esc(PHY_t("tpl_count_suffix")) + '</span>';
    card.appendChild(head);

    var chips = document.createElement("div");
    chips.className = "lib-chips";
    for (var s = 0; s < subs.length; s++) {
      var chip = document.createElement("span");
      chip.className = "lib-chip";
      chip.textContent = subs[s];
      chips.appendChild(chip);
    }
    card.appendChild(chips);

    container.appendChild(card);
  }
}

/* ============================================================
   TABS
   ============================================================ */
function PHY_switchTab(name) {
  var panels = ["practice", "formulas", "report", "library"];
  for (var i = 0; i < panels.length; i++) {
    var p = PHY_$("panel-" + panels[i]);
    if (!p) { continue; }
    if (panels[i] === name) { p.classList.add("active"); }
    else { p.classList.remove("active"); }
  }
  var btns = document.querySelectorAll(".tab-btn");
  for (var j = 0; j < btns.length; j++) {
    if (btns[j].getAttribute("data-tab") === name) { btns[j].classList.add("active"); }
    else { btns[j].classList.remove("active"); }
  }
  if (name === "report") { PHY_renderReport(); }
  if (name === "library") { PHY_renderLibrary(); }
  if (name === "formulas") { PHY_renderFormulas(); }
}

/* ============================================================
   LANGUAGE TOGGLE
   ============================================================ */
function PHY_toggleLang() {
  PHY_LANG = (PHY_LANG === "en") ? "zh" : "en";
  PHY_saveLang();
  PHY_applyI18n();
  PHY_buildTopicChips();
  PHY_buildDiffChips();

  /* Re-render existing questions in the new language */
  if (PHY_STATE.qs.length > 0) {
    var oldCount = PHY_STATE.qs.length;
    /* Preserve notes but regenerate question text */
    var savedNotes = {};
    for (var n in PHY_STATE.notes) {
      if (Object.prototype.hasOwnProperty.call(PHY_STATE.notes, n)) {
        savedNotes[n] = PHY_STATE.notes[n];
      }
    }
    /* Re-generate fresh questions in new language, same count */
    var qCountEl = PHY_$("qCount");
    if (qCountEl) { qCountEl.value = oldCount; }
    PHY_generateQuestions();
    /* Restore notes */
    for (var k in savedNotes) {
      if (Object.prototype.hasOwnProperty.call(savedNotes, k)) {
        PHY_STATE.notes[k] = savedNotes[k];
      }
    }
    PHY_saveNotes();
  }

  PHY_renderLibrary();
  PHY_renderFormulas();
  if (PHY_$("panel-report") && PHY_$("panel-report").classList.contains("active")) {
    PHY_renderReport();
  }
}

/* ============================================================
   INIT
   ============================================================ */
function PHY_init() {
  PHY_loadState();

  var theme = document.documentElement.getAttribute("data-theme") || "light";
  PHY_applyTheme(theme);

  PHY_applyI18n();
  PHY_buildTopicChips();
  PHY_buildDiffChips();
  PHY_renderLibrary();
  PHY_renderFormulas();
  PHY_updateStreakBadge();

  /* Count slider */
  var qCount = PHY_$("qCount");
  if (qCount) {
    qCount.addEventListener("input", function () {
      var lbl = PHY_$("countLbl");
      if (lbl) { lbl.textContent = this.value; }
    });
  }

  /* Generate button */
  var genBtn = PHY_$("genBtn");

<script>
(function () {
"use strict";

/* ============================================================
   OCR ADD-ON v2.1
   ============================================================ */

var PHY_OCR = {
  scriptLoaded: false,
  scriptLoading: null,
  cdn: "https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js",
  modal: null,
  currentTextareaId: null,
  lastResult: null,
  injectTimer: null
};

/* ============================================================
   1. LAZY LOAD TESSERACT
   ============================================================ */
function phyOcrLoadScript() {
  if (PHY_OCR.scriptLoaded) { return Promise.resolve(); }
  if (PHY_OCR.scriptLoading) { return PHY_OCR.scriptLoading; }

  PHY_OCR.scriptLoading = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    s.src = PHY_OCR.cdn;
    s.async = true;
    s.onload = function () {
      PHY_OCR.scriptLoaded = true;
      resolve();
    };
    s.onerror = function () {
      PHY_OCR.scriptLoading = null;
      reject(new Error("Failed to load OCR engine"));
    };
    document.head.appendChild(s);
  });

  return PHY_OCR.scriptLoading;
}

/* ============================================================
   2. BUILD MODAL
   ============================================================ */
function phyOcrBuildModal() {
  if (PHY_OCR.modal) { return; }

  var backdrop = document.createElement("div");
  backdrop.className = "phy-modal-backdrop";
  backdrop.id = "phyOcrModal";

  var modal = document.createElement("div");
  modal.className = "phy-modal";

  /* Head */
  var head = document.createElement("div");
  head.className = "phy-modal-head";
  head.innerHTML = ''
    + '<div class="phy-modal-title">'
    +   '<div class="phy-modal-title-icon">'
    +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
    +       '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>'
    +       '<circle cx="12" cy="13" r="4"/>'
    +     '</svg>'
    +   '</div>'
    +   '<span id="phyOcrTitle">掃描手寫答案</span>'
    + '</div>'
    + '<button class="phy-modal-close" id="phyOcrClose" type="button">'
    +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
    +     '<line x1="18" y1="6" x2="6" y2="18"/>'
    +     '<line x1="6" y1="6" x2="18" y2="18"/>'
    +   '</svg>'
    + '</button>';
  modal.appendChild(head);

  /* Preview image */
  var preview = document.createElement("img");
  preview.className = "phy-ocr-preview";
  preview.id = "phyOcrPreview";
  preview.alt = "Preview";
  preview.style.display = "none";
  modal.appendChild(preview);

  /* Progress */
  var progWrap = document.createElement("div");
  progWrap.className = "phy-progress-wrap";
  progWrap.id = "phyOcrProgressWrap";
  progWrap.innerHTML = ''
    + '<div class="phy-progress-label">'
    +   '<span id="phyOcrProgressText">準備中...</span>'
    +   '<span id="phyOcrProgressPct">0%</span>'
    + '</div>'
    + '<div class="phy-progress-bar">'
    +   '<div class="phy-progress-fill" id="phyOcrProgressFill"></div>'
    + '</div>';
  modal.appendChild(progWrap);

  /* Result section */
  var resultWrap = document.createElement("div");
  resultWrap.id = "phyOcrResultWrap";
  resultWrap.style.display = "none";

  var label = document.createElement("div");
  label.className = "phy-ocr-label";
  label.innerHTML = '<span id="phyOcrResultLabel">辨識結果（可修改）</span>'
    + '<span class="phy-ocr-confidence" id="phyOcrConfidence">--</span>';
  resultWrap.appendChild(label);

  var textarea = document.createElement("textarea");
  textarea.className = "phy-ocr-textarea";
  textarea.id = "phyOcrTextarea";
  textarea.setAttribute("placeholder", "辨識結果會顯示在這裡...");
  resultWrap.appendChild(textarea);

  modal.appendChild(resultWrap);

  /* Actions */
  var actions = document.createElement("div");
  actions.className = "phy-modal-actions";
  actions.id = "phyOcrActions";
  actions.style.display = "none";
  actions.innerHTML = ''
    + '<button class="phy-btn-retry" id="phyOcrRetry" type="button">重試</button>'
    + '<button class="phy-btn-apply" id="phyOcrApply" type="button">'
    +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">'
    +     '<polyline points="20 6 9 17 4 12"/>'
    +   '</svg>'
    +   '<span>套用到答案</span>'
    + '</button>';
  modal.appendChild(actions);

  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);
  PHY_OCR.modal = backdrop;

  /* Event bindings */
  document.getElementById("phyOcrClose").addEventListener("click", phyOcrCloseModal);
  document.getElementById("phyOcrRetry").addEventListener("click", phyOcrReset);
  document.getElementById("phyOcrApply").addEventListener("click", phyOcrApplyResult);

  backdrop.addEventListener("click", function (e) {
    if (e.target === backdrop) { phyOcrCloseModal(); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && backdrop.classList.contains("show")) {
      phyOcrCloseModal();
    }
  });
}

function phyOcrOpenModal(textareaId) {
  phyOcrBuildModal();
  PHY_OCR.currentTextareaId = textareaId;
  phyOcrReset();
  PHY_OCR.modal.classList.add("show");
  setTimeout(function () {
    phyOcrPickFile();
  }, 250);
}

function phyOcrCloseModal() {
  if (PHY_OCR.modal) { PHY_OCR.modal.classList.remove("show"); }
  PHY_OCR.currentTextareaId = null;
  PHY_OCR.lastResult = null;
}

function phyOcrReset() {
  var preview = document.getElementById("phyOcrPreview");
  var resultWrap = document.getElementById("phyOcrResultWrap");
  var actions = document.getElementById("phyOcrActions");
  var progWrap = document.getElementById("phyOcrProgressWrap");
  if (preview) { preview.style.display = "none"; preview.src = ""; }
  if (resultWrap) { resultWrap.style.display = "none"; }
  if (actions) { actions.style.display = "none"; }
  if (progWrap) { progWrap.style.display = "block"; }
  var txt = document.getElementById("phyOcrTextarea");
  if (txt) { txt.value = ""; }
  PHY_OCR.lastResult = null;
}

/* ============================================================
   3. FILE PICKER
   ============================================================ */
function phyOcrPickFile() {
  var input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.style.display = "none";
  input.addEventListener("change", function () {
    var f = input.files[0];
    if (f) { phyOcrProcessImage(f); }
    if (input.parentNode) { input.parentNode.removeChild(input); }
  });
  document.body.appendChild(input);
  input.click();
}

function phyOcrProcessImage(file) {
  if (!file.type.match(/^image\//)) {
    alert("請選擇圖片檔案");
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    alert("圖片過大（上限 10 MB）");
    return;
  }

  var reader = new FileReader();
  reader.onload = function (e) {
    var dataUrl = e.target.result;
    var preview = document.getElementById("phyOcrPreview");
    if (preview) {
      preview.src = dataUrl;
      preview.style.display = "block";
    }
    phyOcrRunRecognition(dataUrl);
  };
  reader.onerror = function () {
    alert("讀取圖片失敗");
  };
  reader.readAsDataURL(file);
}

/* ============================================================
   4. RECOGNITION
   ============================================================ */
function phyOcrUpdateProgress(text, pct) {
  var txt = document.getElementById("phyOcrProgressText");
  var pctEl = document.getElementById("phyOcrProgressPct");
  var fill = document.getElementById("phyOcrProgressFill");
  if (txt) { txt.textContent = text; }
  if (pctEl) { pctEl.textContent = Math.round(pct) + "%"; }
  if (fill) { fill.style.width = pct + "%"; }
}

function phyOcrRunRecognition(dataUrl) {
  phyOcrUpdateProgress("載入 OCR 引擎...", 5);

  phyOcrLoadScript().then(function () {
    phyOcrUpdateProgress("初始化辨識器...", 12);
    if (!window.Tesseract) {
      throw new Error("Tesseract not available");
    }

    return window.Tesseract.recognize(dataUrl, "eng+chi_tra", {
      logger: function (m) {
        if (m.status === "loading tesseract core") {
          phyOcrUpdateProgress("載入核心...", 20);
        } else if (m.status === "initializing tesseract") {
          phyOcrUpdateProgress("初始化中...", 30);
        } else if (m.status === "loading language traineddata") {
          phyOcrUpdateProgress("載入語言包...", 30 + (m.progress || 0) * 30);
        } else if (m.status === "initializing api") {
          phyOcrUpdateProgress("準備 API...", 65);
        } else if (m.status === "recognizing text") {
          phyOcrUpdateProgress("辨識中...", 65 + (m.progress || 0) * 35);
        }
      }
    });
  }).then(function (result) {
    phyOcrUpdateProgress("完成", 100);
    var text = "";
    var confidence = 0;
    if (result && result.data) {
      text = (result.data.text || "").trim();
      confidence = result.data.confidence || 0;
    }
    PHY_OCR.lastResult = { text: text, confidence: confidence };
    phyOcrShowResult(text, confidence);
  }).catch(function (err) {
    phyOcrUpdateProgress("失敗：" + (err.message || "Unknown error"), 100);
    var actions = document.getElementById("phyOcrActions");
    if (actions) { actions.style.display = "flex"; }
    var resultWrap = document.getElementById("phyOcrResultWrap");
    if (resultWrap) { resultWrap.style.display = "block"; }
    var txt = document.getElementById("phyOcrTextarea");
    if (txt) {
      txt.value = "（辨識失敗）\n\n" + (err.message || "") + "\n\n請確認網絡連線，或手動輸入答案。";
    }
    var retry = document.getElementById("phyOcrRetry");
    if (retry) { retry.textContent = "重試"; }
    var apply = document.getElementById("phyOcrApply");
    if (apply) { apply.disabled = true; }
  });
}

function phyOcrShowResult(text, confidence) {
  var progWrap = document.getElementById("phyOcrProgressWrap");
  if (progWrap) { progWrap.style.display = "none"; }

  var resultWrap = document.getElementById("phyOcrResultWrap");
  if (resultWrap) { resultWrap.style.display = "block"; }

  var actions = document.getElementById("phyOcrActions");
  if (actions) { actions.style.display = "flex"; }

  var apply = document.getElementById("phyOcrApply");
  if (apply) { apply.disabled = false; }

  var txt = document.getElementById("phyOcrTextarea");
  if (txt) { txt.value = text || "（未辨識到文字）"; }

  var conf = document.getElementById("phyOcrConfidence");
  if (conf) {
    var level = "low";
    var label = "低";
    if (confidence >= 75) { level = "high"; label = "高"; }
    else if (confidence >= 50) { level = "medium"; label = "中"; }
    conf.className = "phy-ocr-confidence " + level;
    conf.textContent = "信心 " + label + " (" + Math.round(confidence) + "%)";
  }
}

/* ============================================================
   5. APPLY + ADVICE
   ============================================================ */
function phyOcrApplyResult() {
  if (!PHY_OCR.currentTextareaId) { return; }
  var target = document.getElementById(PHY_OCR.currentTextareaId);
  var ocrText = document.getElementById("phyOcrTextarea");
  if (!target || !ocrText) { return; }

  target.value = ocrText.value;
  target.focus();

  /* Generate advice */
  var advice = phyOcrGenerateAdvice(ocrText.value);
  phyOcrShowAdvice(advice);

  /* Auto-grade */
  var idx = PHY_OCR.currentTextareaId.replace("ans-", "");
  var card = target.closest(".question");
  if (card) {
    var gradeBtn = card.querySelector(".btn-grade");
    if (gradeBtn) {
      setTimeout(function () {
        gradeBtn.click();
      }, 350);
    }
  }

  /* Update scan button label */
  var scanBtn = document.querySelector('.phy-scan-btn[data-ans="' + PHY_OCR.currentTextareaId + '"]');
  if (scanBtn) {
    var span = scanBtn.querySelector("span");
    if (span) { span.textContent = "重新掃描"; }
  }

  phyOcrCloseModal();
}

/* ============================================================
   6. ADVICE ENGINE
   ============================================================ */
function phyOcrGenerateAdvice(text) {
  var advice = [];
  if (!text || text.trim().length === 0) {
    advice.push("未辨識到任何文字。請確認照片光線充足、字跡清晰。");
    return advice;
  }

  var t = text;

  /* 1. Numbers check */
  var numMatches = t.match(/-?\d+\.?\d*/g) || [];
  if (numMatches.length === 0) {
    advice.push("未偵測到數值答案。計算題通常需要一個最終數值。");
  } else if (numMatches.length === 1) {
    advice.push("找到 1 個數值。若為多步計算，建議寫下中間步驟，方便自己檢查。");
  } else {
    advice.push("找到 " + numMatches.length + " 個數值，看起來有寫出計算步驟，很好。");
  }

  /* 2. Unit check */
  var unitPatterns = [
    /\b(m\/s|ms-?1|m s-?1|m\/s2|m s-?2)\b/i,
    /\b(kg|g|km)\b/i,
    /\b(N|J|W|V|A|Pa|Hz|MeV|ohm|C|T)\b/i,
    /\b(degC|K)\b/i,
    /\b(年|天|秒|分|個|years?|days?|sec|minutes?)\b/
  ];
  var hasUnit = false;
  for (var i = 0; i < unitPatterns.length; i++) {
    if (unitPatterns[i].test(t)) { hasUnit = true; break; }
  }
  if (numMatches.length > 0 && !hasUnit) {
    advice.push("找到了數值，但看不到單位。記得在答案後加上正確單位（如 N、J、m s-1）。");
  } else if (hasUnit) {
    advice.push("有標示單位，很好。");
  }

  /* 3. Formula check */
  var hasEquals = /[=＝]/.test(t);
  var hasFormulaHint = /\b(sqrt|sin|cos|tan|log|pi)\b/i.test(t)
    || /[a-z]\s*=\s*[a-z0-9]/i.test(t)
    || /[×xX\*\+\/\-]\s*\d/.test(t);
  if (!hasEquals && !hasFormulaHint && numMatches.length > 0) {
    advice.push("只看到數值，看不到公式。即使答案正確，DSE 也需要寫出公式才可獲步驟分。");
  } else if (hasEquals && hasFormulaHint) {
    advice.push("有寫出公式與代入步驟，符合 DSE 評分要求。");
  }

  /* 4. Length check */
  var wordCount = t.split(/\s+/).filter(function (w) { return w.length > 0; }).length;
  if (wordCount < 3 && numMatches.length <= 1) {
    advice.push("答案偏短。若有時間，建議多寫一兩步推導。");
  }

  /* 5. Digits-only detection */
  var digitsOnly = /^[\d\s\.\-\+\=\×\*\/\(\)]+$/.test(t);
  if (digitsOnly) {
    advice.push("答案似乎只有數字與符號，缺少物理量名稱或公式。");
  }

  /* 6. Confidence check */
  if (PHY_OCR.lastResult && PHY_OCR.lastResult.confidence < 60) {
    advice.push("OCR 辨識信心偏低，請人手核對答案框內容是否正確。");
  }

  /* 7. Encouragement */
  if (advice.length === 0) {
    advice.push("作答格式看起來完整，請對照參考答案檢查數值。");
  }

  return advice;
}

function phyOcrShowAdvice(adviceList) {
  /* Remove any previous advice */
  var old = document.querySelectorAll(".phy-advice-box");
  for (var i = 0; i < old.length; i++) {
    if (old[i].parentNode) {
      old[i].parentNode.removeChild(old[i]);
    }
  }
  if (!adviceList || adviceList.length === 0) { return; }

  var target = document.getElementById(PHY_OCR.currentTextareaId);
  if (!target) { return; }
  var card = target.closest(".question");
  if (!card) { return; }

  var box = document.createElement("div");
  box.className = "phy-advice-box";
  var listItems = "";
  for (var j = 0; j < adviceList.length; j++) {
    listItems += "<li>" + adviceList[j] + "</li>";
  }
  box.innerHTML = ''
    + '<div class="phy-advice-head">'
    +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
    +     '<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'
    +   '</svg>'
    +   '<span>AI 建議</span>'
    + '</div>'
    + '<ul class="phy-advice-list">' + listItems + '</ul>';

  /* Insert after result block if it exists, else after btn-row */
  var result = card.querySelector(".result");
  if (result && result.parentNode) {
    result.parentNode.insertBefore(box, result.nextSibling);
  } else {
    var btnRow = card.querySelector(".btn-row");
    if (btnRow && btnRow.parentNode) {
      btnRow.parentNode.insertBefore(box, btnRow.nextSibling);
    } else {
      card.appendChild(box);
    }
  }
}

/* ============================================================
   7. INJECT SCAN BUTTONS
   ============================================================ */
function phyOcrInjectScanButtons() {
  var cards = document.querySelectorAll(".question");
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    if (card.getAttribute("data-phy-ocr") === "1") { continue; }

    var textarea = card.querySelector('textarea[id^="ans-"]');
    if (!textarea) { continue; }

    /* Create scan button */
    var scanRow = document.createElement("div");
    scanRow.className = "phy-scan-row";

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "phy-scan-btn";
    btn.setAttribute("data-ans", textarea.id);
    btn.innerHTML = ''
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
      +   '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>'
      +   '<circle cx="12" cy="13" r="4"/>'
      + '</svg>'
      + '<span>掃描手寫答案</span>';

    btn.addEventListener("click", function () {
      var ansId = this.getAttribute("data-ans");
      phyOcrOpenModal(ansId);
    });

    scanRow.appendChild(btn);

    /* Insert after the question text, before the textarea */
    if (textarea.parentNode) {
      textarea.parentNode.insertBefore(scanRow, textarea);
    }

    card.setAttribute("data-phy-ocr", "1");
  }
}

/* ============================================================
   8. LANGUAGE HOOK
   ============================================================ */
function phyOcrUpdateLanguage() {
  var lang = document.documentElement.lang;
  var isEn = (lang === "en");

  /* Scan buttons */
  var btns = document.querySelectorAll(".phy-scan-btn span");
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].textContent.indexOf("掃描") !== -1 || btns[i].textContent.indexOf("Scan") !== -1) {
      btns[i].textContent = isEn ? "Scan handwritten answer" : "掃描手寫答案";
    } else {
      btns[i].textContent = isEn ? "Scan again" : "重新掃描";
    }
  }

  /* Modal title */
  var title = document.getElementById("phyOcrTitle");
  if (title) { title.textContent = isEn ? "Scan Handwritten Answer" : "掃描手寫答案"; }

  /* Result label */
  var rl = document.getElementById("phyOcrResultLabel");
  if (rl) { rl.textContent = isEn ? "Result (editable)" : "辨識結果（可修改）"; }

  /* Apply button */
  var applySpan = document.querySelector("#phyOcrApply span");
  if (applySpan) { applySpan.textContent = isEn ? "Apply to Answer" : "套用到答案"; }

  /* Retry button */
  var retry = document.getElementById("phyOcrRetry");
  if (retry) { retry.textContent = isEn ? "Retry" : "重試"; }

  /* Advice header */
  var adviceHeads = document.querySelectorAll(".phy-advice-head span");
  for (var j = 0; j < adviceHeads.length; j++) {
    adviceHeads[j].textContent = isEn ? "AI Suggestion" : "AI 建議";
  }
}

/* ============================================================
   9. MUTATION OBSERVER
   ============================================================ */
function phyOcrStartObserver() {
  phyOcrInjectScanButtons();

  var observer = new MutationObserver(function (mutations) {
    var needsInject = false;
    for (var i = 0; i < mutations.length; i++) {
      var m = mutations[i];
      if (m.type === "childList" && m.addedNodes.length > 0) {
        for (var j = 0; j < m.addedNodes.length; j++) {
          var node = m.addedNodes[j];
          if (node.nodeType === 1) {
            if (node.classList && node.classList.contains("question")) {
              needsInject = true;
            } else if (node.querySelector && node.querySelector(".question")) {
              needsInject = true;
            }
          }
        }
      }
    }
    if (needsInject) {
      if (PHY_OCR.injectTimer) { clearTimeout(PHY_OCR.injectTimer); }
      PHY_OCR.injectTimer = setTimeout(function () {
        phyOcrInjectScanButtons();
      }, 60);
    }
  });

  observer.observe(document.body, { childList: true, subtree: true });
}

/* ============================================================
   10. HOOK INTO LANGUAGE BUTTON
   ============================================================ */
function phyOcrHookLangButton() {
  var langBtn = document.getElementById("langBtn");
  if (!langBtn) { return; }
  langBtn.addEventListener("click", function () {
    setTimeout(phyOcrUpdateLanguage, 100);
  });
}

/* ============================================================
   11. INIT
   ============================================================ */
function phyOcrInit() {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", phyOcrInit);
    return;
  }
  phyOcrBuildModal();
  phyOcrStartObserver();
  phyOcrHookLangButton();
  setTimeout(phyOcrUpdateLanguage, 200);
  console.log("[PhyGenius OCR] Add-on v2.1 ready");
}

phyOcrInit();

})();
</script>

<script>
(function () {
"use strict";

function PHYLAB_$(id) { return document.getElementById(id); }

function PHYLAB_esc(s) {
  var str = String(s);
  var out = "";
  for (var i = 0; i < str.length; i++) {
    var c = str.charAt(i);
    if (c === "&") { out += "&amp;"; }
    else if (c === "<") { out += "&lt;"; }
    else if (c === ">") { out += "&gt;"; }
    else if (c === '"') { out += "&quot;"; }
    else { out += c; }
  }
  return out;
}

var PHYLAB_screens = {
  launcher: "phylabLauncher",
  selector: "phylabSelector",
  lab: "phylabLab"
};

function PHYLAB_showScreen(name) {
  var keys = Object.keys(PHYLAB_screens);
  for (var i = 0; i < keys.length; i++) {
    var el = PHYLAB_$(PHYLAB_screens[keys[i]]);
    if (!el) { continue; }
    if (keys[i] === name) { el.classList.remove("hidden"); }
    else { el.classList.add("hidden"); }
  }
}

function PHYLAB_hideAll() {
  var keys = Object.keys(PHYLAB_screens);
  for (var i = 0; i < keys.length; i++) {
    var el = PHYLAB_$(PHYLAB_screens[keys[i]]);
    if (el) { el.classList.add("hidden"); }
  }
}

function PHYLAB_toast(msg, type) {
  if (typeof PHY_toast === "function") {
    try { PHY_toast(msg, type); return; } catch (e) {}
  }
  alert(msg);
}

var PHYLAB_experiments = {};
window.PHYLAB_experiments = PHYLAB_experiments;

/* ============== Experiment 1: Simple Pendulum ============== */
PHYLAB_experiments.pendulum = {
  id: "pendulum",
  title_zh: "單擺測重力加速度",
  desc_zh: "透過測量單擺週期，計算重力加速度 g",
  difficulty: 2,
  unit: "m s-2",
  state: { lengthCm: 80, angleDeg: 15, running: false, startTime: 0, data: [], timerRunning: false, stopwatchStart: 0, stopwatchValue: 0, oscCount: 10 },
  reset: function () {
    this.state = { lengthCm: 80, angleDeg: 15, running: false, startTime: 0, data: [], timerRunning: false, stopwatchStart: 0, stopwatchValue: 0, oscCount: 10 };
  },
  previewSVG: function () {
    return '<svg viewBox="0 0 200 120" preserveAspectRatio="xMidYMid meet">'
      + '<rect x="10" y="10" width="60" height="6" rx="3" fill="#94a3b8"/>'
      + '<line x1="40" y1="16" x2="40" y2="90" stroke="#64748b" stroke-width="2"/>'
      + '<circle cx="40" cy="95" r="8" fill="#4f46e5"/>'
      + '<line x1="40" y1="16" x2="80" y2="20" stroke="#64748b" stroke-width="2"/>'
      + '<circle cx="82" cy="22" r="6" fill="#4f46e5"/>'
      + '<text x="155" y="70" font-size="11" fill="#6366f1" text-anchor="middle" font-weight="700" font-family="monospace">T = 2pi sqrt(L/g)</text>'
      + '</svg>';
  },
  equipItem: function (name) {
    return '<div class="phylab-equip-item">'
      + '<div class="phylab-equip-icon">'
      +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/></svg>'
      + '</div>'
      + '<span>' + PHYLAB_esc(name) + '</span>'
      + '</div>';
  },
  render: function () {
    PHYLAB_$("phylabLabLeft").innerHTML = ''
      + '<div class="phylab-lab-panel-title">儀器與材料</div>'
      + this.equipItem("鐵架台") + this.equipItem("細線") + this.equipItem("金屬擺錘")
      + this.equipItem("米尺") + this.equipItem("碼錶") + this.equipItem("量角器");

    PHYLAB_$("phylabLabCenter").innerHTML = '<div class="phylab-workspace">'
      + '<svg id="phylabPendulumSVG" viewBox="0 0 700 420" preserveAspectRatio="xMidYMid meet"></svg>'
      + '</div>';

    PHYLAB_$("phylabLabRight").innerHTML = ''
      + '<div class="phylab-lab-panel-title">操作面板</div>'
      + '<div class="phylab-control">'
      +   '<div class="phylab-control-label"><span>擺長 L</span><span id="phylabPendLenVal">80 cm</span></div>'
      +   '<input type="range" class="phylab-slider" id="phylabPendLen" min="20" max="150" value="80">'
      + '</div>'
      + '<div class="phylab-control">'
      +   '<div class="phylab-control-label"><span>起始角度</span><span id="phylabPendAngVal">15 度</span></div>'
      +   '<input type="range" class="phylab-slider" id="phylabPendAng" min="5" max="25" value="15">'
      + '</div>'
      + '<button class="phylab-btn" id="phylabPendRelease" type="button"><span>開始擺動</span></button>'
      + '<button class="phylab-btn secondary" id="phylabPendTimer" type="button"><span>開始計時</span></button>'
      + '<div class="phylab-readout" style="margin-top:12px;">'
      +   '<div class="phylab-readout-label">碼錶</div>'
      +   '<div class="phylab-readout-value" id="phylabPendStopwatch">0.00<span class="phylab-readout-unit">s</span></div>'
      + '</div>'
      + '<button class="phylab-btn success" id="phylabPendRecord" type="button" disabled><span>記錄數據</span></button>'
      + '<div class="phylab-lab-panel-title" style="margin-top:16px;">數據記錄</div>'
      + '<div id="phylabPendData"></div>'
      + '<button class="phylab-btn secondary" id="phylabPendClear" type="button" style="margin-top:8px;"><span>清空數據</span></button>';

    PHYLAB_$("phylabStepText").textContent = "步驟 1：調整擺長與角度，然後開始擺動";
    this.renderSVG(); this.renderData(); this.bindControls();
  },
  renderSVG: function () {
    var svg = PHYLAB_$("phylabPendulumSVG");
    if (!svg) { return; }
    var s = this.state;
    var L = s.lengthCm, angle = s.angleDeg;
    var pivotX = 200, pivotY = 60;
    var lengthPx = L * 2.2;
    var bobAngle;
    if (s.running) {
      var T = 2 * Math.PI * Math.sqrt((L / 100) / 9.81);
      var elapsed = (Date.now() - s.startTime) / 1000;
      bobAngle = angle * Math.cos(2 * Math.PI * elapsed / T);
    } else { bobAngle = angle; }
    var rad = bobAngle * Math.PI / 180;
    var bobX = pivotX + lengthPx * Math.sin(rad);
    var bobY = pivotY + lengthPx * Math.cos(rad);
    var ruler = '';
    for (var i = 0; i <= 15; i++) {
      var y = pivotY + i * 22;
      var major = (i % 5 === 0);
      ruler += '<line x1="420" y1="' + y + '" x2="' + (major ? 470 : 445) + '" y2="' + y + '" stroke="#475569" stroke-width="1"/>';
      if (major) { ruler += '<text x="478" y="' + (y + 4) + '" font-size="11" fill="#64748b" font-family="monospace">' + (i * 10) + '</text>'; }
    }
    svg.innerHTML = ''
      + '<defs>'
      +   '<pattern id="phylabGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99,102,241,0.06)" stroke-width="1"/></pattern>'
      +   '<radialGradient id="phylabBobGrad" cx="30%" cy="30%"><stop offset="0%" stop-color="#a5b4fc"/><stop offset="100%" stop-color="#4f46e5"/></radialGradient>'
      + '</defs>'
      + '<rect width="700" height="420" fill="url(#phylabGrid)"/>'
      + '<rect x="140" y="50" width="120" height="10" rx="2" fill="#475569"/>'
      + '<rect x="190" y="50" width="20" height="330" fill="#334155"/>'
      + '<rect x="140" y="370" width="120" height="14" rx="2" fill="#475569"/>'
      + '<circle cx="200" cy="55" r="6" fill="#64748b"/>'
      + '<rect x="415" y="55" width="70" height="340" fill="rgba(30,41,59,0.5)" stroke="#475569" stroke-width="1" rx="4"/>'
      + ruler
      + '<line x1="200" y1="60" x2="200" y2="380" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>'
      + '<line x1="' + pivotX + '" y1="' + pivotY + '" x2="' + bobX + '" y2="' + bobY + '" stroke="#94a3b8" stroke-width="1.5"/>'
      + '<circle cx="' + bobX + '" cy="' + bobY + '" r="14" fill="url(#phylabBobGrad)" stroke="#c7d2fe" stroke-width="1.5"/>'
      + '<ellipse cx="' + (bobX - 4) + '" cy="' + (bobY - 4) + '" rx="4" ry="3" fill="rgba(255,255,255,0.4)"/>'
      + '<line x1="215" y1="60" x2="215" y2="' + (pivotY + lengthPx) + '" stroke="#6366f1" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>'

      + '<rect x="520" y="30" width="160" height="80" rx="8" fill="rgba(15,23,42,0.7)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>'

      + '<text x="535" y="78" font-size="16" fill="#a5b4fc" font-family="monospace" font-weight="700">' + (2 * Math.PI * Math.sqrt((L / 100) / 9.81)).toFixed(3) + ' s</text>'
      + '<text x="535" y="98" font-size="10" fill="#64748b" font-family="monospace">angle=' + angle + ' deg, L=' + L + 'cm</text>';
  },
  bindControls: function () {
    var self = this;
    var lenSlider = PHYLAB_$("phylabPendLen");
    if (lenSlider) {
      lenSlider.addEventListener("input", function () {
        self.state.lengthCm = parseInt(this.value, 10);
        PHYLAB_$("phylabPendLenVal").textContent = self.state.lengthCm + " cm";
        self.renderSVG();
      });
    }
    var angSlider = PHYLAB_$("phylabPendAng");
    if (angSlider) {
      angSlider.addEventListener("input", function () {
        self.state.angleDeg = parseInt(this.value, 10);
        PHYLAB_$("phylabPendAngVal").textContent = self.state.angleDeg + " \u00B0";
        self.renderSVG();
      });
    }
    var relBtn = PHYLAB_$("phylabPendRelease");
    if (relBtn) {
      relBtn.addEventListener("click", function () {
        self.state.running = !self.state.running;
        if (self.state.running) { self.state.startTime = Date.now(); self.animate(); }
      });
    }
    var timerBtn = PHYLAB_$("phylabPendTimer");
    if (timerBtn) { timerBtn.addEventListener("click", function () { self.toggleStopwatch(); }); }
    var recBtn = PHYLAB_$("phylabPendRecord");
    if (recBtn) { recBtn.addEventListener("click", function () { self.record(); }); }
    var clrBtn = PHYLAB_$("phylabPendClear");
    if (clrBtn) { clrBtn.addEventListener("click", function () { self.state.data = []; self.renderData(); }); }
  },
  animate: function () {
    if (!this.state.running) { return; }
    this.renderSVG();
    var self = this;
    requestAnimationFrame(function () { self.animate(); });
  },
  toggleStopwatch: function () {
    var s = this.state;
    var btn = PHYLAB_$("phylabPendTimer");
    if (!s.timerRunning) {
      s.timerRunning = true; s.stopwatchStart = Date.now(); s.stopwatchValue = 0;
      if (btn) { btn.querySelector("span").textContent = "停止計時"; }
      var self = this;
      var tick = function () {
        if (!self.state.timerRunning) { return; }
        self.state.stopwatchValue = (Date.now() - self.state.stopwatchStart) / 1000;
        var el = PHYLAB_$("phylabPendStopwatch");
        if (el) { el.innerHTML = self.state.stopwatchValue.toFixed(2) + '<span class="phylab-readout-unit">s</span>'; }
        setTimeout(tick, 30);
      };
      tick();
    } else {
      s.timerRunning = false;
      s.stopwatchValue = (Date.now() - s.stopwatchStart) / 1000;
      if (btn) { btn.querySelector("span").textContent = "開始計時"; }
      var recBtn = PHYLAB_$("phylabPendRecord");
      if (recBtn) { recBtn.disabled = false; }
      PHYLAB_$("phylabStepText").textContent = "步驟 3：點擊「記錄數據」儲存量度結果";
    }
  },
  record: function () {
    var s = this.state;
    var tTotal = s.stopwatchValue;
    var T = tTotal / s.oscCount;
    s.data.push({ L: s.lengthCm / 100, Lcm: s.lengthCm, t: tTotal, T: T, T2: T * T });
    s.timerRunning = false;
    var btn = PHYLAB_$("phylabPendTimer");
    if (btn) { btn.querySelector("span").textContent = "開始計時"; }
    var recBtn = PHYLAB_$("phylabPendRecord");
    if (recBtn) { recBtn.disabled = true; }
    s.stopwatchValue = 0;
    var sw = PHYLAB_$("phylabPendStopwatch");
    if (sw) { sw.innerHTML = '0.00<span class="phylab-readout-unit">s</span>'; }
    this.renderData();
    PHYLAB_$("phylabStepText").textContent = "步驟 4：已記錄 " + s.data.length + " 組數據（建議 5 組以上）";
  },
  renderData: function () {
    var el = PHYLAB_$("phylabPendData");
    if (!el) { return; }
    var d = this.state.data;
    if (d.length === 0) {
      el.innerHTML = '<table class="phylab-data-table"><tr class="empty"><td>尚未記錄任何數據</td></tr></table>';
      return;
    }
    var html = '<table class="phylab-data-table"><thead><tr><th>L(cm)</th><th>t(s)</th><th>T(s)</th><th>T2</th></tr></thead><tbody>';
    for (var i = 0; i < d.length; i++) {
      html += '<tr><td>' + d[i].Lcm + '</td><td>' + d[i].t.toFixed(2) + '</td><td>' + d[i].T.toFixed(3) + '</td><td>' + d[i].T2.toFixed(3) + '</td></tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  },
  score: function () {
    var d = this.state.data;
    if (d.length < 3) { return { error: "數據不足，請至少記錄 3 組數據" }; }
    var n = d.length;
    var sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
    for (var i = 0; i < n; i++) {
      sumX += d[i].L; sumY += d[i].T2; sumXY += d[i].L * d[i].T2; sumXX += d[i].L * d[i].L;
    }
    var denom = n * sumXX - sumX * sumX;
    if (Math.abs(denom) < 1e-9) { return { error: "數據不足" }; }
    var slope = (n * sumXY - sumX * sumY) / denom;
    var gMeasured = (4 * Math.PI * Math.PI) / slope;
    var expected = 9.81;
    var errorPct = Math.abs(gMeasured - expected) / expected * 100;
    var score;
    if (errorPct < 2) { score = 100; }
    else if (errorPct < 5) { score = 90; }
    else if (errorPct < 10) { score = 75; }
    else if (errorPct < 20) { score = 55; }
    else { score = 30; }
    var advice = [];
    if (d.length < 5) { advice.push("只有 " + d.length + " 組數據。建議量度 5 組以上不同擺長以提升準確度。"); }
    if (errorPct < 5) { advice.push("結果良好！你的 g 值非常接近理論值。"); }
    else { advice.push("誤差較大。請確認起始角度保持較小，並小心計算完整擺動次數。"); }
    advice.push("使用公式：T2 = (4 pi^2 / g) L。T2 對 L 圖的斜率可求得 g = 4 pi^2 / 斜率。");
    return { score: score, measured: gMeasured, expected: expected, unit: this.unit, errorPct: errorPct, advice: advice };
  }
};

  /* 流暢的電子動畫：只更新 cx/cy，速度用真實時間計算 */
  startElectronAnimation: function () {
    var myGen = ++this.state.animGen;
    var self = this;
    var startTime = performance.now();

    function loop(t) {
      if (self.state.animGen !== myGen) { return; }
      var svg = document.getElementById("phylabOhmSVG");
      var g = document.getElementById("phylabOhmElectrons");
      if (!svg || !g) { return; }

      var I = self.state.voltage / self.state.resistance;
      /* 速度：像素/秒，與電流成正比，但設上限避免太快看不清 */
      var speed = Math.min(I * 700, 450);
      var elapsed = (t - startTime) / 1000;
      var total = 1600; /* 電路周長：500 + 200 + 500 + 200 */
      var n = g.children.length;

      for (var k = 0; k < n; k++) {
        var pos = ((elapsed * speed) + k * (total / n)) % total;
        if (pos < 0) { pos += total; }
        var x, y;
        if (pos < 500) { x = 100 + pos; y = 120; }
        else if (pos < 700) { x = 600; y = 120 + (pos - 500); }
        else if (pos < 1200) { x = 600 - (pos - 700); y = 320; }
        else { x = 100; y = 320 - (pos - 1200); }
        g.children[k].setAttribute("cx", x);
        g.children[k].setAttribute("cy", y);
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  },

  record: function () {

      el.innerHTML = '<table class="phylab-data-table"><tr class="empty"><td>尚未記錄任何數據</td></tr></table>';
      return;
    }
    var html = '<table class="phylab-data-table"><thead><tr><th>V (V)</th><th>I (A)</th></tr></thead><tbody>';
    for (var i = 0; i < d.length; i++) {
      html += '<tr><td>' + d[i].V.toFixed(2) + '</td><td>' + d[i].I.toFixed(4) + '</td></tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  },

  score: function () {
    var d = this.state.data;
    if (d.length < 3) { return { error: "數據不足，請至少記錄 3 組數據" }; }
    var n = d.length;
    var sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
    for (var i = 0; i < n; i++) {
      sumX += d[i].I; sumY += d[i].V; sumXY += d[i].I * d[i].V; sumXX += d[i].I * d[i].I;
    }
    var denom = n * sumXX - sumX * sumX;
    if (Math.abs(denom) < 1e-12) { return { error: "數據不足" }; }
    var slope = (n * sumXY - sumX * sumY) / denom;
    var expected = 47.0;
    var errorPct = Math.abs(slope - expected) / expected * 100;
    var score;
    if (errorPct < 2) { score = 100; }
    else if (errorPct < 5) { score = 90; }
    else if (errorPct < 10) { score = 75; }
    else if (errorPct < 20) { score = 55; }
    else { score = 30; }
    var advice = [];
    if (d.length < 5) { advice.push("只有 " + d.length + " 組數據。建議量度 5 組以上不同電壓。"); }
    if (errorPct < 5) { advice.push("結果良好！你的 R 值非常接近標準電阻值。"); }
    else { advice.push("誤差較大。請確認伏特計並聯於電阻兩端，安培計串聯於電路中。"); }
    advice.push("V-I 圖的斜率即為電阻 R，因為 V = IR 是通過原點的直線。");
    return { score: score, measured: slope, expected: expected, unit: this.unit, errorPct: errorPct, advice: advice };
  }
};
