<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPi BLE 控制器</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f5f5f7; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { font-size: 16px; font-weight: bold; padding: 12px 24px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; }
        .btn-connect { background-color: #0071e3; color: white; width: 80%; }
        .btn-action { background-color: #34c759; color: white; }
        .btn-stop { background-color: #ff3b30; color: white; }
        #status { font-weight: bold; color: #86868b; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>CyberPi 無線藍牙控制面板</h1>
    <div id="status">當前狀態：等待連線...</div>

    <button class="btn-connect" onclick="connectBLE()">🔍 搜尋並連接 CyberPi</button>
    <hr style="border: 0; border-top: 1px solid #d2d2d7; margin: 20px 0;">

    <button class="btn-action" onclick="sendSignal('A')">發送 A (行動 1)</button>
    <button class="btn-action" onclick="sendSignal('B')">發送 B (行動 2)</button>
    <br>
    <button class="btn-stop" onclick="sendSignal('STOP')">🛑 停止所有行動</button>
</div>

<script>
let bluetoothDevice = null;
let txCharacteristic = null;

// 宣告所有 CyberPi 可能使用的 16-bit 藍牙服務（包含標準與自訂）
const OPTIONAL_SERVICES = [
    '0000ffe0-0000-1000-8000-00805f9b34fb', // Makeblock 專用
    '6e400001-b5a3-f393-e0a9-e50e24dcca9e', // Nordic UART 專用
    '0000180a-0000-1000-8000-00805f9b34fb'  // 系統資訊服務
];

async function connectBLE() {
    const statusDiv = document.getElementById('status');
    try {
        statusDiv.innerText = "狀態：請在彈出視窗中選擇設備...";
        
        // 使用 acceptAllDevices 盲掃，但必須同時在 optionalServices 宣告可能用到的服務
        bluetoothDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: OPTIONAL_SERVICES
        });

        statusDiv.innerText = "狀態：正在建立 GATT 連線...";
        const server = await bluetoothDevice.gatt.connect();

        statusDiv.innerText = "狀態：正在解析晶片通道...";
        
        // 自動嘗試抓取可用的服務
        let connectedService = null;
        for (let uuid of OPTIONAL_SERVICES) {
            try {
                connectedService = await server.getPrimaryService(uuid);
                if (connectedService) break;
            } catch (e) { continue; }
        }

        if (!connectedService) {
            throw new Error("無法辨識此設備的藍牙服務，請確保已斷開 mBlock 軟體");
        }

        // 自動尋找具有寫入權限的特徵值
        const characteristics = await connectedService.getCharacteristics();
        txCharacteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);

        if (!txCharacteristic) {
            throw new Error("找不到允許寫入數據的藍牙通道");
        }

        statusDiv.innerText = "狀態：🎉 藍牙連線成功！";
        statusDiv.style.color = "#34c759";

    } catch (error) {
        console.error(error);
        statusDiv.innerText = "連線失敗: " + error.message;
        statusDiv.style.color = "red";
    }
}

async function sendSignal(signalText) {
    if (!txCharacteristic) {
        alert("請先成功連接藍牙！");
        return;
    }
    try {
        const encoder = new TextEncoder();
        // 為了確保離線 Python 能精準斷句，維持發送 \n
        await txCharacteristic.writeValue(encoder.encode(signalText + '\n'));
        document.getElementById('status').innerText = `狀態：已成功發送指令 [${signalText}]`;
    } catch (error) {
        document.getElementById('status').innerText = "發送失敗: " + error.message;
    }
}
</script>
</body>
</html>
