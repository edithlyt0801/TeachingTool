<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>CyberPi 藍牙控制器</title>
    <style>
        body { font-family: sans-serif; text-align: center; marginTop: 50px; }
        button { font-size: 18px; padding: 10px 20px; margin: 10px; cursor: pointer; }
        #status { color: gray; font-weight: bold; }
    </style>
</head>
<body>

    <h1>CyberPi 藍牙控制面板</h1>
    <p>連線狀態：<span id="status">未連線</span></p>

    <!-- 功能按鈕 -->
    <button onclick="connectAndSend('A')">發送訊號 A (行動 1)</button>
    <button onclick="connectAndSend('B')">發送訊號 B (行動 2)</button>
    <button onclick="connectAndSend('STOP')">發送停止訊號</button>

<script>
let bluetoothDevice = null;
let txCharacteristic = null;

// CyberPi 採用的標準 Nordic UART 藍牙服務 UUID
const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const TX_CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; 

async function connectAndSend(signalText) {
    const statusText = document.getElementById('status');
    
    try {
        // 1. 如果尚未連線，先進行藍牙配對
        if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
            statusText.innerText = "正在搜尋 CyberPi...";
            
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                // 搜尋名字開頭為 CyberPi 的設備，或改為 acceptAllDevices: true
                filters: [{ namePrefix: 'CyberPi' }], 
                optionalServices: [UART_SERVICE_UUID]
            });
            
            statusText.innerText = "正在連接設備...";
            const server = await bluetoothDevice.gatt.connect();
            
            statusText.innerText = "正在取得藍牙服務...";
            const service = await server.getPrimaryService(UART_SERVICE_UUID);
            txCharacteristic = await service.getCharacteristic(TX_CHARACTERISTIC_UUID);
            
            statusText.innerText = "已連線";
            statusText.style.color = "green";
        }

        // 2. 發送訊號（結尾必須加 \n，CyberPi 才能正確讀取整行字串）
        let encoder = new TextEncoder();
        await txCharacteristic.writeValue(encoder.encode(signalText + '\n'));
        console.log("成功發送訊號: " + signalText);

    } catch (error) {
        console.error("藍牙操作失敗: ", error);
        statusText.innerText = "連線失敗或被取消";
        statusText.style.color = "red";
    }
}
</script>
