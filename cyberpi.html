<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPi mBlock 專用藍牙控制器</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f5f5f7; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { font-size: 16px; font-weight: bold; padding: 12px 24px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; }
        .btn-connect { background-color: #0071e3; color: white; width: 80%; }
        .btn-action { background-color: #34c759; color: white; }
        .btn-stop { background-color: #ff3b30; color: white; }
        #status { font-weight: bold; color: #86868b; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>CyberPi 藍牙控制面板</h1>
    <div id="status">當前狀態：等待連線...</div>

    <button class="btn-connect" onclick="connectAndSend('')">🔍 搜尋並連接 CyberPi</button>
    <hr style="border: 0; border-top: 1px solid #d2d2d7; margin: 20px 0;">

    <button class="btn-action" onclick="connectAndSend('A')">發送 A (行動 1)</button>
    <button class="btn-action" onclick="connectAndSend('B')">發送 B (行動 2)</button>
    <br>
    <button class="btn-stop" onclick="connectAndSend('STOP')">🛑 停止所有行動</button>
</div>

<script>
let bluetoothDevice = null;
let txCharacteristic = null;

async function connectAndSend(signalText) {
    const statusDiv = document.getElementById('status');
    
    try {
        if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
            statusDiv.innerText = "狀態：請在視窗中選擇 [CyberPi_GATT]...";
            statusDiv.style.color = "#0071e3";
            
            // 盲掃附近所有藍牙，不預設任何過濾器
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true
            });
            
            statusDiv.innerText = "狀態：已捕捉裝置，正在建立 GATT 連線...";
            const server = await bluetoothDevice.gatt.connect();
            
            statusDiv.innerText = "狀態：正在讀取晶片內部所有服務...";
            // 關鍵：動態獲取這台設備上所有可用的 Primary Services
            const services = await server.getPrimaryServices();
            
            if (services.length === 0) {
                throw new Error("這台設備目前沒有開放任何公開的藍牙服務，請重啟 CyberPi");
            }
            
            console.log("發現服務數量:", services.length);
            
            // 尋找第一個可以進行資料讀寫通訊的服務
            let foundService = null;
            for (let service of services) {
                try {
                    const characteristics = await service.getCharacteristics();
                    // 尋找具有寫入權限的通道
                    txCharacteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
                    if (txCharacteristic) {
                        foundService = service;
                        console.log("成功鎖定通訊服務 UUID:", service.uuid);
                        console.log("成功鎖定寫入特徵值 UUID:", txCharacteristic.uuid);
                        break;
                    }
                } catch (e) {
                    // 跳過無權限讀取的系統預留服務
                    continue;
                }
            }
            
            if (!txCharacteristic) {
                throw new Error("雖然連上設備，但找不到任何允許網頁寫入數據的通道");
            }
            
            statusDiv.innerText = "狀態：🎉 通道綁定成功，可以發送訊號！";
            statusDiv.style.color = "#34c759";
            
            bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                statusDiv.innerText = "狀態：❌ 藍牙已斷開連線";
                statusDiv.style.color = "#ff3b30";
                bluetoothDevice = null;
                txCharacteristic = null;
            });
        }

        // 如果連線成功且有點擊功能鈕，則送出訊號
        if (signalText !== '' && txCharacteristic) {
            let encoder = new TextEncoder();
            await txCharacteristic.writeValue(encoder.encode(signalText + '\n'));
            console.log("成功發送指令 -> " + signalText);
            statusDiv.innerText = `狀態：已成功發送指令 [${signalText}]`;
        }

    } catch (error) {
        console.error("藍牙詳細錯誤報告: ", error);
        statusDiv.innerText = "狀態：連線失敗 - " + error.message;
        statusDiv.style.color = "#ff3b30";
    }
}

</script>

</body>
</html>
