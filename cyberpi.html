<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPi 網頁藍牙控制器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; margin-top: 50px; background-color: #f5f5f7; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { font-size: 16px; font-weight: bold; padding: 12px 24px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .btn-connect { background-color: #0071e3; color: white; width: 80%; }
        .btn-connect:hover { background-color: #0077ed; }
        .btn-action { background-color: #34c759; color: white; }
        .btn-action:hover { background-color: #30b651; }
        .btn-stop { background-color: #ff3b30; color: white; }
        .btn-stop:hover { background-color: #e03329; }
        #status { font-weight: bold; color: #86868b; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>CyberPi 藍牙控制面板</h1>
    
    <!-- 狀態顯示 -->
    <div id="status">當前狀態：等待連線...</div>

    <!-- 連線按鈕（第一次可先點擊連線，或直接點功能鈕也會觸發連線） -->
    <button class="btn-connect" onclick="connectAndSend('')">🔍 搜尋並連接 CyberPi</button>
    <hr style="border: 0; border-top: 1px solid #d2d2d7; margin: 20px 0;">

    <!-- 功能動作按鈕 -->
    <button class="btn-action" onclick="connectAndSend('A')">發送 A (行動 1)</button>
    <button class="btn-action" onclick="connectAndSend('B')">發送 B (行動 2)</button>
    <br>
    <button class="btn-stop" onclick="connectAndSend('STOP')">🛑 停止所有行動</button>
</div>

<script>
let bluetoothDevice = null;
let txCharacteristic = null;

// CyberPi 採用的標準 Nordic UART 藍牙服務 UUID
const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const TX_CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; 

async function connectAndSend(signalText) {
    const statusDiv = document.getElementById('status');
    
    try {
        // 1. 如果尚未建立連線，先進行藍牙配對
        if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
            statusDiv.innerText = "狀態：正在彈出藍牙視窗，請選擇你的 CyberPi...";
            statusDiv.style.color = "#0071e3";
            
            // 啟用全掃描模式，避免被名稱篩選擋住
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true, 
                optionalServices: [UART_SERVICE_UUID] 
            });
            
            statusDiv.innerText = "狀態：正在連接藍牙晶片...";
            const server = await bluetoothDevice.gatt.connect();
            
            statusDiv.innerText = "狀態：正在尋找通訊通道...";
            const service = await server.getPrimaryService(UART_SERVICE_UUID);
            txCharacteristic = await service.getCharacteristic(TX_CHARACTERISTIC_UUID);
            
            statusDiv.innerText = "狀態：🎉 連線成功！";
            statusDiv.style.color = "#34c759";
            
            // 監聽斷線事件
            bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                statusDiv.innerText = "狀態：❌ 藍牙已斷開連線";
                statusDiv.style.color = "#ff3b30";
                bluetoothDevice = null;
                txCharacteristic = null;
            });
        }

        // 2. 如果有點擊功能按鈕（傳入的文字不為空），則發送訊號
        if (signalText !== '') {
            let encoder = new TextEncoder();
            // 尾端必須加上 \n 換行符號，CyberPi 的 read_string() 才能正確斷句
            await txCharacteristic.writeValue(encoder.encode(signalText + '\n'));
            console.log("成功發送訊號 -> " + signalText);
            statusDiv.innerText = `狀態：已成功發送指令 [${signalText}]`;
            statusDiv.style.color = "#34c759";
        }

    } catch (error) {
        console.error("藍牙錯誤資訊: ", error);
        statusDiv.innerText = "狀態：連線失敗或被取消 (" + error.message + ")";
        statusDiv.style.color = "#ff3b30";
    }
}
</script>

</body>
</html>
