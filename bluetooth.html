<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Pico 2 W 傾斜偵測雙向控制器</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 50px; 
            background-color: #f0f2f5; 
            transition: background-color 0.3s ease; 
        }
        button { font-size: 20px; padding: 15px 30px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; }
        .connect { background-color: #2196F3; color: white; }
        .on { background-color: #4caf50; color: white; font-weight: bold; }
        .off { background-color: #f44336; color: white; }
        
        #display-box {
            margin: 30px auto;
            padding: 25px;
            width: 320px;
            border-radius: 12px;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #status-text { font-size: 28px; font-weight: bold; color: #666; margin: 10px 0; }
        #log { font-weight: bold; color: #777; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>🌐 Pico 2 W 傾斜偵測狀態面板</h1>
    <button class="connect" onclick="connectPico()">1. 連接 Pico 2 W 藍牙</button>
    <br><br>
    
    <div id="display-box">
        <p style="color: #888; font-size: 16px; margin: 0;">當前感應器狀態</p>
        <div id="status-text">⚪ 尚未連線</div>
    </div>

    <!-- 新增手動強制同步按鈕，預防藍牙斷訊 -->
    <button class="on" onclick="sendCommand('ON')">強制同步：直立</button>
    <button class="off" onclick="sendCommand('OFF')">強制同步：傾斜</button>

    <p id="log">系統日誌：等待藍牙連線...</p>

    <script>
        const SERVICE_UUID = 0x1815;
        const CHAR_UUID = 0x2A56;
        
        let picoCharacteristic = null;

        // 🎯 核心修正：確保 UI 即時且正確地被渲染
        function updateUI(state) {
            const statusText = document.getElementById('status-text');
            // 使用 include 或 trim 確保徹底排除任何隱形換行符
            if (state.includes("ON")) {
                statusText.innerText = "🟢 偵測到直立";
                statusText.style.color = "#2e7d32"; 
                document.body.style.backgroundColor = "#e8f5e9"; 
            } else if (state.includes("OFF")) {
                statusText.innerText = "🚨 偵測到傾斜";
                statusText.style.color = "#c62828"; 
                document.body.style.backgroundColor = "#ffebee"; 
            }
        }

        // 🎯 核心修正：加強解碼與去除尾隨字元
        function handleNotification(event) {
            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            // 清理可能來自 MicroPython 的 \r\n 或空格
            const state = decoder.decode(value).replace(/[^a-zA-Z]/g, ""); 
            
            console.log("收到 Pico 乾淨狀態碼: '" + state + "'");
            document.getElementById('log').innerText = "系統日誌：收到硬體即時更新 -> " + state;
            updateUI(state);
        }

        async function connectPico() {
            document.getElementById('log').innerText = "正在尋找 Pico2W_LED...";
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Pico2W_LED' }],
                    optionalServices: [SERVICE_UUID]
                });

                document.getElementById('log').innerText = "正在建立藍牙連線...";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                picoCharacteristic = await service.getCharacteristic(CHAR_UUID);

                // 啟動監聽
                await picoCharacteristic.startNotifications();
                picoCharacteristic.addEventListener('characteristicvaluechanged', handleNotification);

                document.getElementById('log').innerText = "🎉 連線成功！";
                document.getElementById('status-text').innerText = "🚨 偵測到傾斜";
                document.body.style.backgroundColor = "#ffebee";
            } catch (error) {
                console.error(error);
                document.getElementById('log').innerText = "❌ 連線失敗: " + error;
            }
        }

        async function sendCommand(cmd) {
            if (!picoCharacteristic) {
                alert("請先點擊按鈕連接藍牙！");
                return;
            }
            try {
                const encoder = new TextEncoder();
                await picoCharacteristic.writeValue(encoder.encode(cmd));
                document.getElementById('log').innerText = "系統日誌：手動強制同步為 " + cmd;
                updateUI(cmd); 
            } catch (error) {
                console.error(error);
                document.getElementById('log').innerText = "❌ 發送失敗";
            }
        }
    </script>
</body>
</html>
