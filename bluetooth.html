<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Pico 2 W 傾斜偵測雙向控制器</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 50px; 
            background-color: #f0f2f5; 
            transition: background-color 0.4s ease; 
        }
        button { font-size: 20px; padding: 15px 30px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; }
        .connect { background-color: #2196F3; color: white; }
        .on { background-color: #ffeb3b; color: #333; font-weight: bold; }
        .off { background-color: #3f51b5; color: white; }
        
        /* 狀態顯示框 */
        #display-box {
            margin: 30px auto;
            padding: 25px;
            width: 320px;
            border-radius: 12px;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #status-text { font-size: 28px; font-weight: bold; color: #666; margin: 10px 0; }
        #log { font-weight: bold; color: #777; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>🌐 Pico 2 W 傾斜偵測狀態面板</h1>
    <button class="connect" onclick="connectPico()">1. 連接 Pico 2 W 藍牙</button>
    <br><br>
    
    <!-- 核心狀態顯示區域 -->
    <div id="display-box">
        <p style="color: #888; font-size: 16px; margin: 0;">當前感應器狀態</p>
        <div id="status-text">⚪ 尚未連線</div>
    </div>

    <button class="on" onclick="sendCommand('ON')">💡 網頁開燈</button>
    <button class="off" onclick="sendCommand('OFF')">🌑 網頁關燈</button>

    <p id="log">系統日誌：等待藍牙連線...</p>

    <script>
        const SERVICE_UUID = 0x1815;
        const CHAR_UUID = 0x2A56;
        
        let picoCharacteristic = null;

        // 🎯 根據 Pico 傳回的狀態，精準顯示您的指定文字
        function updateUI(state) {
            const statusText = document.getElementById('status-text');
            if (state === "ON") {
                statusText.innerText = "🟢 偵測到直立";
                statusText.style.color = "#2e7d32"; // 綠色字體代表導通直立
                document.body.style.backgroundColor = "#e8f5e9"; // 轉為淡綠色背景
            } else if (state === "OFF") {
                statusText.innerText = "🚨 偵測到傾斜";
                statusText.style.color = "#c62828"; // 紅色字體代表斷開傾斜
                document.body.style.backgroundColor = "#ffebee"; // 轉為淡紅色背景
            }
        }

        // 監聽來自 Pico 2 W 的傾斜開關即時通知
        function handleNotification(event) {
            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            const state = decoder.decode(value).trim();
            
            console.log("收到 Pico 狀態碼: " + state);
            document.getElementById('log').innerText = "系統日誌：實體感應器觸發狀態變更";
            updateUI(state);
        }

        async function connectPico() {
            document.getElementById('log').innerText = "正在尋找 Pico2W_LED...";
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Pico2W_LED' }],
                    optionalServices: [SERVICE_UUID]
                });

                document.getElementById('log').innerText = "正在建立藍牙連線...";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                picoCharacteristic = await service.getCharacteristic(CHAR_UUID);

                // 啟動藍牙即時通知
                await picoCharacteristic.startNotifications();
                picoCharacteristic.addEventListener('characteristicvaluechanged', handleNotification);

                document.getElementById('log').innerText = "🎉 連線成功！已進入實體連動監測模式。";
                document.getElementById('status-text').innerText = "🚨 偵測到傾斜";
                document.body.style.backgroundColor = "#ffebee";
            } catch (error) {
                console.error(error);
                document.getElementById('log').innerText = "❌ 連線失敗: " + error;
            }
        }

        // 網頁點擊時主動控制
        async function sendCommand(cmd) {
            if (!picoCharacteristic) {
                alert("請先點擊按鈕連接藍牙！");
                return;
            }
            try {
                const encoder = new TextEncoder();
                await picoCharacteristic.writeValue(encoder.encode(cmd));
                document.getElementById('log').innerText = "系統日誌：網頁手動發送 " + cmd;
                updateUI(cmd); 
            } catch (error) {
                console.error(error);
                document.getElementById('log').innerText = "❌ 發送指令失敗";
            }
        }
    </script>
</body>
</html>
