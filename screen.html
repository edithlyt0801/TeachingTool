<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad 多螢幕同步拼貼播放牆 (免設定雲端版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for reactive UI -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- MQTT.js for robust WebSocket sync -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            overscroll-behavior: none;
            background-color: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-black h-screen w-screen overflow-hidden select-none" x-data="videoWallApp()">

    <!-- 設置畫面 -->
    <div x-show="!connected || showSettings" 
         class="fixed inset-0 z-50 bg-neutral-950/95 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto"
         x-transition.opacity>
        <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 w-full max-w-xl shadow-2xl space-y-5">
            
            <div class="text-center space-y-1">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-indigo-600/20 text-indigo-400 mb-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold tracking-tight">iPad 拼接影音牆 (即時同步)</h1>
                <p class="text-xs text-neutral-400">免帳號、免複雜設定，自動穿透防火牆同步多達 20 台 iPad</p>
            </div>

            <!-- 連線狀態與提示 -->
            <div :class="connectionStatusType === 'success' ? 'bg-emerald-950/50 border-emerald-600/50 text-emerald-200' : (connectionStatusType === 'warning' ? 'bg-amber-950/50 border-amber-600/50 text-amber-200' : 'bg-neutral-950/60 border-neutral-800 text-neutral-300')" class="border p-3 rounded-xl text-xs space-y-1 transition">
                <div class="font-bold flex items-center space-x-1.5">
                    <span class="w-2 h-2 rounded-full" :class="connectionStatusType === 'success' ? 'bg-emerald-400 animate-pulse' : (connectionStatusType === 'warning' ? 'bg-amber-400' : 'bg-neutral-400')"></span>
                    <span x-text="connectionStatusText"></span>
                </div>
            </div>

            <div class="space-y-3 text-sm">
                <!-- 房間 ID -->
                <div>
                    <label class="block text-xs font-semibold text-neutral-300 uppercase tracking-wider mb-1">同步房間代碼 (所有 iPad 必須相同)</label>
                    <input type="text" x-model="config.roomId" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="例如：room-20">
                </div>

                <!-- 網格設定 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-neutral-300 uppercase tracking-wider mb-1">總列數 (Rows)</label>
                        <input type="number" x-model.number="config.totalRows" min="1" max="10" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-neutral-300 uppercase tracking-wider mb-1">總行數 (Cols)</label>
                        <input type="number" x-model.number="config.totalCols" min="1" max="10" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <!-- 本機座標 -->
                <div class="grid grid-cols-2 gap-3 bg-neutral-950/50 p-3 rounded-xl border border-neutral-800">
                    <div>
                        <label class="block text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-1">本機所在列 (Row)</label>
                        <select x-model.number="config.myRow" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-3 py-2 text-white text-xs">
                            <template x-for="r in config.totalRows">
                                <option :value="r-1" x-text="`第 ${r} 列 (索引 ${r-1})`"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-1">本機所在行 (Col)</label>
                        <select x-model.number="config.myCol" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-3 py-2 text-white text-xs">
                            <template x-for="c in config.totalCols">
                                <option :value="c-1" x-text="`第 ${c} 行 (索引 ${c-1})`"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <!-- 影片網址 -->
                <div>
                    <label class="block text-xs font-semibold text-neutral-300 uppercase tracking-wider mb-1">影片網址 (URL)</label>
                    <input type="text" x-model="config.videoUrl" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-2.5 text-white text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="https://example.com/video.mp4">
                </div>

                <!-- 本機影片檔案上傳 -->
                <div>
                    <label class="block text-xs font-semibold text-neutral-300 uppercase tracking-wider mb-1">或上傳本機影片檔案</label>
                    <input type="file" accept="video/*" @change="handleFileSelect($event)" class="w-full text-xs text-neutral-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer bg-neutral-800 border border-neutral-700 rounded-xl p-2">
                    <p class="text-[11px] text-neutral-400 mt-1">提示：跨多台 iPad 建議使用公開影片網址，若使用本機上傳請確保每台 iPad 各自選擇相同影片檔案。</p>
                </div>
            </div>

            <!-- 按鈕群組 -->
            <div class="flex space-x-3 pt-2">
                <button @click="startWall()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-6 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30">
                    進入拼貼牆
                </button>
                <button @click="toggleTestPattern()" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-200 font-medium py-3 px-4 rounded-xl transition duration-200 text-xs">
                    校正格線
                </button>
            </div>
            
        </div>
    </div>

    <!-- 影片拼接畫布區域 -->
    <div class="relative w-full h-full overflow-hidden bg-black flex items-center justify-center" @click="toggleControls()">
        
        <!-- 巨型定位容器 -->
        <div class="absolute inset-0 overflow-hidden" 
             :style="`width: ${config.totalCols * 100}vw; height: ${config.totalRows * 100}vh; transform: translate(-${config.myCol * 100}vw, -${config.myRow * 100}vh);`">
            
            <video id="wallVideo" 
                   x-ref="videoElement"
                   :src="config.videoUrl"
                   class="absolute inset-0 w-full h-full object-cover"
                   preload="auto"
                   playsinline
                   webkit-playsinline
                   muted
                   @ended="onVideoEnded()">
            </video>
        </div>

        <!-- 測試對齊格線 -->
        <div x-show="testPattern" class="absolute inset-0 border-4 border-indigo-500/80 bg-indigo-950/30 flex flex-col items-center justify-center p-6 pointer-events-none z-20 backdrop-blur-[2px]">
            <div class="bg-neutral-900/90 border border-indigo-500/50 rounded-2xl p-6 text-center shadow-2xl max-w-sm w-full pointer-events-auto">
                <span class="inline-block px-3 py-1 bg-indigo-500 text-white text-xs font-bold rounded-full mb-3 uppercase tracking-widest">校正模式</span>
                <h2 class="text-3xl font-extrabold text-white mb-1" x-text="`Row ${config.myRow + 1} , Col ${config.myCol + 1}`"></h2>
                <p class="text-xs text-neutral-400 mt-2">請確認實體 iPad 擺放位置與螢幕編號是否相符。</p>
            </div>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="w-full h-[1px] bg-indigo-500/50"></div>
            </div>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="h-full w-[1px] bg-indigo-500/50"></div>
            </div>
        </div>

        <!-- 浮動控制面板 -->
        <div x-show="showControls" 
             x-transition
             class="absolute bottom-6 left-1/2 -translate-x-1/2 z-40 bg-neutral-900/90 border border-neutral-800 backdrop-blur-md px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3">
            
            <button @click.stop="togglePlay()" class="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl transition flex items-center space-x-1">
                <svg x-show="!isPlaying" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg x-show="isPlaying" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>

            <button @click.stop="toggleMute()" :class="isMuted ? 'bg-neutral-800 text-neutral-400' : 'bg-emerald-600 text-white'" class="p-3 rounded-xl transition text-xs font-semibold">
                <span x-text="isMuted ? '🔇 靜音' : '🔊 有聲'"></span>
            </button>

            <button @click.stop="restartSync()" class="bg-neutral-800 hover:bg-neutral-700 text-white p-3 rounded-xl transition text-xs font-semibold">
                重整同步
            </button>

            <button @click.stop="toggleTestPattern()" class="bg-neutral-800 hover:bg-neutral-700 text-white p-3 rounded-xl transition text-xs font-semibold">
                格線
            </button>

            <button @click.stop="showSettings = true" class="bg-neutral-800 hover:bg-neutral-700 text-white p-3 rounded-xl transition text-xs font-semibold">
                設定
            </button>

            <div class="text-xs pl-2 border-l border-neutral-700 flex items-center space-x-1">
                <span :class="isOnline ? 'text-emerald-400' : 'text-amber-400'" x-text="isOnline ? '● 雲端連線' : '○ 本機模式'"></span>
            </div>
        </div>

    </div>

    <!-- 邏輯腳本 -->
    <script>
        function videoWallApp() {
            return {
                connected: false,
                showSettings: true,
                showControls: false,
                testPattern: false,
                isPlaying: false,
                isMuted: true,
                isOnline: false,
                connectionStatusText: '準備連線至多裝置同步通道...',
                connectionStatusType: 'neutral',
                
                mqttClient: null,
                broadcastChannel: null,
                isRemoteTrigger: false,

                config: {
                    roomId: 'ipad-wall-room-1',
                    totalRows: 4,
                    totalCols: 5,
                    myRow: 0,
                    myCol: 0,
                    videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'
                },

                init() {
                    const saved = localStorage.getItem('ipad_wall_multibroker_config');
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            if (parsed.videoUrl && !parsed.videoUrl.startsWith('blob:')) {
                                this.config = parsed;
                            } else if (parsed) {
                                this.config = { ...parsed, videoUrl: this.config.videoUrl };
                            }
                        } catch(e){}
                    }
                },

                handleFileSelect(event) {
                    const file = event.target.files[0];
                    if (file) {
                        this.config.videoUrl = URL.createObjectURL(file);
                    }
                },

                async startWall() {
                    localStorage.setItem('ipad_wall_multibroker_config', JSON.stringify(this.config));
                    this.showSettings = false;
                    this.connected = true;

                    // 1. 初始化同機分頁廣播 (同機測試用)
                    try {
                        if (window.BroadcastChannel) {
                            if (this.broadcastChannel) this.broadcastChannel.close();
                            this.broadcastChannel = new BroadcastChannel(`videowall_bc_${this.config.roomId}`);
                            this.broadcastChannel.onmessage = (e) => this.handleRemoteCommand(e.data);
                        }
                    } catch(e) {}

                    // 2. 初始化跨裝置 WebSocket MQTT 連線
                    this.initMQTTWithFallback();

                    const video = this.$refs.videoElement;
                    if (video) {
                        video.muted = true;
                        this.isMuted = true;
                        video.addEventListener('play', () => { this.isPlaying = true; });
                        video.addEventListener('pause', () => { this.isPlaying = false; });
                    }
                },

                initMQTTWithFallback() {
                    const brokers = [
                        { name: 'EMQX', url: 'wss://broker.emqx.io:8084/mqtt' },
                        { name: 'HiveMQ', url: 'wss://broker.hivemq.com:8884/mqtt' },
                        { name: 'Mosquitto', url: 'wss://test.mosquitto.org:8081/mqtt' }
                    ];

                    let brokerIdx = 0;

                    const tryConnect = () => {
                        if (brokerIdx >= brokers.length) {
                            this.isOnline = false;
                            this.connectionStatusType = 'warning';
                            this.connectionStatusText = '公共網路連線受阻，已自動啟用本機與同網域同步模式。';
                            return;
                        }

                        const currentBroker = brokers[brokerIdx];
                        this.connectionStatusType = 'neutral';
                        this.connectionStatusText = `正在連線至同步通道 (${currentBroker.name})...`;

                        try {
                            const clientId = 'ipad_wall_' + Math.random().toString(16).substring(2, 10);
                            const client = mqtt.connect(currentBroker.url, {
                                clientId: clientId,
                                keepalive: 30,
                                reconnectPeriod: 2000,
                                timeout: 5000
                            });

                            this.mqttClient = client;

                            client.on('connect', () => {
                                this.isOnline = true;
                                this.connectionStatusType = 'success';
                                this.connectionStatusText = `已成功連線至同步伺服器 (${currentBroker.name})！所有 iPad 可完美同步。`;
                                const topic = `videowall/room/${this.config.roomId}/sync`;
                                client.subscribe(topic);
                            });

                            client.on('message', (topic, payload) => {
                                try {
                                    const data = JSON.parse(payload.toString());
                                    if (!this.isRemoteTrigger) {
                                        this.handleRemoteCommand(data);
                                    }
                                } catch(e){}
                            });

                            client.on('error', (err) => {
                                client.end();
                                brokerIdx++;
                                tryConnect();
                            });

                            client.on('offline', () => {
                                this.isOnline = false;
                            });

                        } catch(e) {
                            brokerIdx++;
                            tryConnect();
                        }
                    };

                    tryConnect();
                },

                sendCommand(action, currentTime) {
                    const data = { action, currentTime, timestamp: Date.now() };

                    // 1. 同機分頁廣播
                    if (this.broadcastChannel) {
                        try { this.broadcastChannel.postMessage(data); } catch(e) {}
                    }

                    // 2. 跨裝置 MQTT 廣播
                    if (this.mqttClient && this.isOnline) {
                        try {
                            const topic = `videowall/room/${this.config.roomId}/sync`;
                            this.mqttClient.publish(topic, JSON.stringify(data));
                        } catch(e) {}
                    }
                },

                handleRemoteCommand(data) {
                    const video = this.$refs.videoElement;
                    if (!video || !data) return;

                    this.isRemoteTrigger = true;
                    setTimeout(() => { this.isRemoteTrigger = false; }, 300);

                    if (data.action === 'play') {
                        const latency = data.timestamp ? (Date.now() - data.timestamp) / 1000 : 0;
                        const targetTime = data.currentTime + Math.min(latency, 1.0);
                        if (Math.abs(video.currentTime - targetTime) > 0.4) {
                            video.currentTime = targetTime;
                        }
                        video.play().catch(() => {});
                    } else if (data.action === 'pause') {
                        video.pause();
                        video.currentTime = data.currentTime;
                    } else if (data.action === 'seek') {
                        video.currentTime = data.currentTime;
                    }
                },

                togglePlay() {
                    const video = this.$refs.videoElement;
                    if (!video) return;

                    if (video.paused) {
                        video.play().then(() => {
                            this.sendCommand('play', video.currentTime);
                        }).catch(() => {
                            this.errorMessage = '播放受阻：請先點擊畫面解除瀏覽器限制';
                        });
                    } else {
                        video.pause();
                        this.sendCommand('pause', video.currentTime);
                    }
                },

                toggleMute() {
                    const video = this.$refs.videoElement;
                    if (!video) return;
                    video.muted = !video.muted;
                    this.isMuted = video.muted;
                },

                restartSync() {
                    const video = this.$refs.videoElement;
                    if (!video) return;
                    video.currentTime = 0;
                    this.sendCommand('seek', 0);
                },

                toggleControls() {
                    this.showControls = !this.showControls;
                },

                toggleTestPattern() {
                    this.testPattern = !this.testPattern;
                },

                onVideoEnded() {
                    const video = this.$refs.videoElement;
                    if (video) {
                        video.currentTime = 0;
                        video.play().catch(() => {});
                    }
                }
            }
        }
    </script>
</body>
</html>
