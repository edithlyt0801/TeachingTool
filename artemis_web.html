<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artemis: Archery posture analysis lab</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            bg: '#050507', 
                            panel: 'rgba(20, 20, 24, 0.65)', 
                            pink: '#FF33A1', 
                            yellow: '#FFD100',
                        }
                    },
                    boxShadow: {
                        'glow-pink': '0 0 25px rgba(255, 51, 161, 0.3)',
                        'glow-yellow': '0 0 25px rgba(255, 209, 0, 0.3)',
                        'glass': '0 10px 40px -10px rgba(0, 0, 0, 0.8)'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #050507;
            color: #F3F4F6;
            background-image: 
                radial-gradient(circle at 15% 30%, rgba(255, 51, 161, 0.04), transparent 40%),
                radial-gradient(circle at 85% 70%, rgba(255, 209, 0, 0.04), transparent 40%);
            background-attachment: fixed;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            letter-spacing: 0.02em;
        }

        .glass-panel {
            background: var(--tw-colors-theme-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.25rem;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.8);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #33333A; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4A4A52; }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }
        .slider-yellow::-webkit-slider-thumb { background: #FFD100; box-shadow: 0 0 15px rgba(255, 209, 0, 0.7); border: 2px solid #fff; }
        .slider-yellow::-webkit-slider-runnable-track { background: rgba(255, 209, 0, 0.15); }
        .slider-pink::-webkit-slider-thumb { background: #FF33A1; box-shadow: 0 0 15px rgba(255, 51, 161, 0.7); border: 2px solid #fff; }
        .slider-pink::-webkit-slider-runnable-track { background: rgba(255, 51, 161, 0.15); }

        .tab-active {
            border-bottom: 3px solid #FFD100;
            color: #FFD100;
            text-shadow: 0 0 20px rgba(255, 209, 0, 0.5);
            font-weight: 700;
        }

        input:checked ~ .dot { transform: translateX(120%); background-color: #FFD100; box-shadow: 0 0 10px rgba(255,209,0,0.6); }
        input:checked ~ .bg-track { background-color: rgba(255,209,0,0.2); border-color: rgba(255,209,0,0.4); }
        input.pink-toggle:checked ~ .dot { background-color: #FF33A1; box-shadow: 0 0 10px rgba(255,51,161,0.6); }
        input.pink-toggle:checked ~ .bg-track { background-color: rgba(255,51,161,0.2); border-color: rgba(255,51,161,0.4); }
        input.cyan-toggle:checked ~ .dot { background-color: #00E5FF; box-shadow: 0 0 10px rgba(0,229,255,0.6); }
        input.cyan-toggle:checked ~ .bg-track { background-color: rgba(0,229,255,0.2); border-color: rgba(0,229,255,0.4); }
        
        .editing-mode #analysis-canvas { cursor: crosshair; }

        .btn-upload {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s ease;
        }
        .btn-upload:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
        
        /* For Recording Overlay */
        @keyframes pulse-border {
            0% { border-color: rgba(239, 68, 68, 0.3); }
            50% { border-color: rgba(239, 68, 68, 1); box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
            100% { border-color: rgba(239, 68, 68, 0.3); }
        }
        .recording-active { animation: pulse-border 2s infinite; border: 2px solid red !important; }

        /* Hide Number Input Arrows */
        .hide-arrows::-webkit-inner-spin-button, .hide-arrows::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .hide-arrows { -moz-appearance: textfield; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full py-2 px-4 md:px-8 flex flex-col md:flex-row items-center justify-between z-50 bg-black/50 backdrop-blur-xl border-b border-white/5 sticky top-0">
        <div class="flex items-center gap-4">
            <img src="https://raw.githubusercontent.com/edithlyt0801/TeachingTool/refs/heads/main/logo.png" alt="Artemis Logo" class="h-10 md:h-12 w-auto object-contain">
            <div class="flex flex-col justify-center">
                <h1 class="text-xl md:text-2xl font-extrabold tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-[#FFD100] via-[#FF8050] to-[#FF33A1]">
                    Artemis
                </h1>
                <span class="text-[9px] md:text-[10px] text-gray-400 tracking-[0.25em] uppercase font-medium" data-i18n="subtitle">Archery posture analysis lab</span>
            </div>
        </div>
        
        <div class="flex gap-4 items-center mt-2 md:mt-0">
            <button id="lang-toggle" class="btn-upload px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-gray-300 hover:text-white">
                <i data-lucide="globe" class="w-3.5 h-3.5"></i>
                <span>EN / 中文</span>
            </button>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="w-full pt-4 pb-4 flex justify-center relative">
        <div class="flex gap-10 relative z-10">
            <button onclick="switchTab('camera')" id="tab-btn-camera" class="tab-active pb-2 px-3 text-base transition-all" data-i18n="tab_camera">即時攝影</button>
            <button onclick="switchTab('analysis')" id="tab-btn-analysis" class="pb-2 px-3 text-base text-gray-500 hover:text-gray-300 transition-all font-medium" data-i18n="tab_analysis">影片分析</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow px-4 md:px-8 pb-8 flex flex-col items-center w-full max-w-[1440px] mx-auto relative z-10">

        <!-- ==================== TAB 1: Real-time Camera ==================== -->
        <section id="view-camera" class="w-full flex flex-col lg:flex-row gap-6 animate-fade-in">
            
            <!-- Viewport (Left) -->
            <div class="flex-grow flex flex-col gap-5 lg:w-3/5 xl:w-[65%]">
                <div class="glass-panel w-full aspect-video relative overflow-hidden border border-white/5 flex items-center justify-center bg-black shadow-glow-yellow" id="camera-container">
                    <video id="live-video" class="hidden" autoplay playsinline></video>
                    <canvas id="live-canvas" class="w-full h-full object-contain"></canvas>
                    
                    <div id="camera-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 bg-[#0A0A0B] transition-opacity duration-300">
                        <i data-lucide="camera-off" class="w-12 h-12 mb-4 opacity-40 text-gray-400"></i>
                        <p class="text-xs tracking-widest uppercase font-medium" data-i18n="camera_off_msg">攝影機未啟動 (請點擊啟動)</p>
                    </div>

                    <div id="ai-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur-md z-20 hidden">
                        <div class="w-10 h-10 border-[3px] border-[#FFD100]/20 border-t-[#FF33A1] rounded-full animate-spin mb-4"></div>
                        <p class="text-[#FFD100] text-xs font-bold tracking-[0.15em] mb-3" data-i18n="loading_ai">AI 模型載入中</p>
                        <div class="w-48 h-1 bg-white/10 rounded-full overflow-hidden">
                            <div id="ai-progress-bar" class="h-full bg-gradient-to-r from-[#FFD100] to-[#FF33A1] transition-all duration-300 shadow-[0_0_10px_#FF33A1]" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls (Right) -->
            <div class="flex flex-col gap-5 lg:w-2/5 xl:w-[35%] max-h-[85vh] overflow-y-auto pr-2 custom-scrollbar">
                <div class="glass-panel p-6 flex flex-col gap-6">
                    <h3 class="font-bold text-sm tracking-widest text-gray-300 uppercase flex items-center gap-2.5 border-b border-white/5 pb-3">
                        <i data-lucide="camera" class="w-4.5 h-4.5 text-[#FFD100]"></i>
                        <span data-i18n="camera_settings">攝影機設定</span>
                    </h3>

                    <div class="flex flex-col gap-2.5">
                        <label class="text-[11px] font-bold text-gray-400 tracking-widest uppercase" data-i18n="select_camera">攝影機來源</label>
                        <select id="camera-select" class="bg-[#18181B] border border-white/10 rounded-xl py-2.5 px-4 text-xs text-gray-200 focus:outline-none focus:border-[#FFD100] transition-colors appearance-none font-medium">
                            <option value="default" data-i18n="loading_cameras">請先啟動攝影機...</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-2.5">
                        <label class="text-[11px] font-bold text-gray-400 tracking-widest uppercase" data-i18n="resolution">解析度</label>
                        <select id="camera-resolution" class="bg-[#18181B] border border-white/10 rounded-xl py-2.5 px-4 text-xs text-gray-200 focus:outline-none focus:border-[#FFD100] transition-colors appearance-none font-medium">
                            <option value="auto" data-i18n="res_auto">自動 (Auto)</option>
                            <option value="720p">720p (HD)</option>
                            <option value="1080p">1080p (FHD)</option>
                            <option value="4k">4K (UHD)</option>
                        </select>
                    </div>

                    <div class="h-px w-full bg-white/5"></div>

                    <div class="flex flex-col gap-4">
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <div class="relative flex items-center">
                                <input type="checkbox" id="ai-skeleton-toggle" class="sr-only">
                                <div class="bg-track block bg-white/10 w-10 h-5 rounded-full transition-all border border-white/5"></div>
                                <div class="dot absolute left-1 bg-gray-400 w-3 h-3 rounded-full transition-transform transform group-hover:bg-white shadow-sm"></div>
                            </div>
                            <span class="text-xs font-semibold text-gray-300 group-hover:text-white transition-colors" data-i18n="ai_skeleton">AI 骨架疊加</span>
                        </label>
                        
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <div class="relative flex items-center">
                                <input type="checkbox" id="joint-angle-toggle" class="sr-only pink-toggle">
                                <div class="bg-track block bg-white/10 w-10 h-5 rounded-full transition-all border border-white/5"></div>
                                <div class="dot absolute left-1 bg-gray-400 w-3 h-3 rounded-full transition-transform transform group-hover:bg-white shadow-sm"></div>
                            </div>
                            <span class="text-xs font-semibold text-gray-300 group-hover:text-white transition-colors" data-i18n="show_angles">顯示關節角度</span>
                        </label>

                        <label class="flex items-center gap-3 cursor-pointer group">
                            <div class="relative flex items-center">
                                <input type="checkbox" id="mirror-toggle" class="sr-only" checked>
                                <div class="bg-track block bg-white/10 w-10 h-5 rounded-full transition-all border border-white/5"></div>
                                <div class="dot absolute left-1 bg-gray-400 w-3 h-3 rounded-full transition-transform transform group-hover:bg-white shadow-sm"></div>
                            </div>
                            <span class="text-xs font-semibold text-gray-300 group-hover:text-white transition-colors" data-i18n="mirror_view">鏡像畫面 (Mirror)</span>
                        </label>
                    </div>

                    <div class="h-px w-full bg-white/5"></div>

                    <div class="flex flex-col gap-3">
                        <div class="flex justify-between items-end">
                            <label class="text-[11px] font-bold text-gray-400 tracking-widest uppercase" data-i18n="delay_time">延遲時間 (秒)</label>
                            <span id="delay-val" class="text-[#FFD100] font-mono text-xs font-bold bg-[#FFD100]/10 px-2 py-0.5 rounded">0.0s</span>
                        </div>
                        <input type="range" id="delay-slider" min="0" max="5" step="0.5" value="0" class="slider-yellow mt-1">
                    </div>

                    <button id="btn-toggle-camera" class="w-full mt-2 px-5 py-3.5 rounded-xl font-bold bg-[#FFD100] text-black hover:bg-[#FFC000] transition-all shadow-[0_0_20px_rgba(255,209,0,0.2)] hover:shadow-[0_0_30px_rgba(255,209,0,0.4)] flex justify-center items-center gap-2 text-sm">
                        <i data-lucide="video" class="w-4 h-4"></i>
                        <span data-i18n="start_camera">啟動攝影機</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- ==================== TAB 2: Video Analysis ==================== -->
        <section id="view-analysis" class="w-full hidden animate-fade-in">
            <div class="flex flex-col lg:flex-row gap-6 w-full">
                
                <!-- Left: Video Player Area -->
                <div class="flex-grow flex flex-col gap-4 lg:w-3/5 xl:w-[65%]">
                    <div class="glass-panel w-full aspect-video relative overflow-hidden bg-black flex items-center justify-center shadow-glow-pink" id="analysis-container">
                        
                        <div class="absolute inset-0 overflow-hidden" id="video-workspace">
                            <video id="video-1" class="absolute top-0 left-0 w-full h-full object-contain origin-center pointer-events-none" playsinline muted></video>
                            <video id="video-2" class="absolute top-0 left-0 w-full h-full object-contain origin-center pointer-events-none opacity-50" playsinline muted></video>
                        </div>
                        
                        <canvas id="analysis-canvas" class="absolute top-0 left-0 w-full h-full z-10"></canvas>

                        <!-- Recording Overlay -->
                        <div id="recording-overlay" class="absolute inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex-col items-center justify-center">
                            <div class="w-10 h-10 border-[3px] border-[#00E5FF]/20 border-t-[#00E5FF] rounded-full animate-spin mb-4"></div>
                            <p class="text-[#00E5FF] font-bold tracking-widest text-sm animate-pulse" data-i18n="recording_msg">影片匯出錄製中...</p>
                            <p class="text-gray-400 text-[10px] mt-2" data-i18n="recording_warn">請勿切換分頁或關閉瀏覽器</p>
                        </div>

                        <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-600 pointer-events-none z-0 bg-[#0A0A0B]">
                            <i data-lucide="film" class="w-12 h-12 mb-4 opacity-40 text-gray-400"></i>
                            <p class="text-xs tracking-widest uppercase font-medium" data-i18n="upload_to_start">請上傳影片以開始分析</p>
                        </div>
                    </div>

                    <!-- Playback Controls -->
                    <div class="glass-panel px-6 py-4 flex items-center gap-5 border border-white/5">
                        <button id="btn-play-pause" class="w-10 h-10 rounded-full bg-[#FF33A1]/10 hover:bg-[#FF33A1]/20 flex items-center justify-center transition-all border border-[#FF33A1]/30 disabled:opacity-30 disabled:border-white/10 disabled:bg-white/5" disabled>
                            <i data-lucide="play" class="w-4 h-4 ml-0.5 text-[#FF33A1]"></i>
                        </button>
                        <span id="time-display" class="font-mono text-sm w-20 text-center text-[#FF33A1] font-bold bg-[#FF33A1]/10 px-2 py-0.5 rounded">00:00.0</span>
                        <input type="range" id="video-timeline" min="0" max="100" value="0" step="0.1" class="slider-pink flex-grow disabled:opacity-30" disabled>
                    </div>
                </div>

                <!-- Right: Tools & Calibration -->
                <div class="flex flex-col gap-5 lg:w-2/5 xl:w-[35%] max-h-[85vh] overflow-y-auto pr-2 custom-scrollbar">
                    
                    <!-- Uploads & Global Settings -->
                    <div class="glass-panel p-6 flex flex-col gap-5">
                        <h3 class="font-bold text-xs tracking-widest text-gray-300 uppercase flex items-center gap-2 mb-1">
                            <i data-lucide="upload-cloud" class="w-4 h-4 text-[#FF33A1]"></i>
                            <span data-i18n="video_sources">影片來源設定</span>
                        </h3>
                        
                        <div class="flex flex-col gap-2.5">
                            <label class="text-[11px] font-bold text-[#FFD100] flex items-center gap-2 tracking-wider">
                                <div class="w-2.5 h-2.5 rounded-full bg-[#FFD100] shadow-[0_0_8px_rgba(255,209,0,0.8)]"></div>
                                <span data-i18n="video_1_label">基準影片 (黃色)</span>
                            </label>
                            <div class="flex gap-3 items-center">
                                <input type="file" id="upload-v1" accept="video/*" class="hidden">
                                <button onclick="document.getElementById('upload-v1').click()" class="btn-upload text-[11px] px-4 py-2 rounded-lg text-white font-semibold flex-shrink-0" data-i18n="choose_file">選擇檔案</button>
                                <span id="name-v1" class="text-[11px] text-gray-500 truncate" data-i18n="no_file">未選擇檔案</span>
                            </div>
                        </div>

                        <div class="h-px w-full bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>

                        <div class="flex flex-col gap-2.5">
                            <label class="text-[11px] font-bold text-[#FF33A1] flex items-center gap-2 tracking-wider">
                                <div class="w-2.5 h-2.5 rounded-full bg-[#FF33A1] shadow-[0_0_8px_rgba(255,51,161,0.8)]"></div>
                                <span data-i18n="video_2_label">疊加影片 (粉紅)</span>
                            </label>
                            <div class="flex gap-3 items-center">
                                <input type="file" id="upload-v2" accept="video/*" class="hidden">
                                <button onclick="document.getElementById('upload-v2').click()" class="btn-upload text-[11px] px-4 py-2 rounded-lg text-white font-semibold flex-shrink-0" data-i18n="choose_file">選擇檔案</button>
                                <span id="name-v2" class="text-[11px] text-gray-500 truncate" data-i18n="no_file">未選擇檔案</span>
                            </div>
                        </div>

                        <div class="bg-black/40 p-4 rounded-xl border border-white/5 mt-2 shadow-inner">
                            <div class="flex justify-between text-[11px] font-bold mb-3 uppercase tracking-wider items-center">
                                <span class="text-gray-400" data-i18n="overlay_opacity">疊加透明度 (影片二)</span>
                                <div class="flex items-center bg-[#FF33A1]/10 rounded px-1.5 focus-within:ring-1 focus-within:ring-[#FF33A1]">
                                    <input type="number" id="opacity-num" value="50" min="0" max="100" class="w-8 bg-transparent text-[#FF33A1] text-right font-mono text-[11px] outline-none hide-arrows font-bold">
                                    <span class="text-[#FF33A1] text-[10px] ml-0.5">%</span>
                                </div>
                            </div>
                            <input type="range" id="opacity-slider" min="0" max="100" value="50" class="slider-pink">
                        </div>
                    </div>

                    <!-- Kinematic Chain Tools -->
                    <div class="glass-panel p-6 flex flex-col gap-4">
                        <div class="flex items-center justify-between border-b border-white/5 pb-3">
                            <h3 class="font-bold text-xs tracking-widest text-gray-300 uppercase flex items-center gap-2">
                                <i data-lucide="git-commit" class="w-4 h-4 text-[#FFD100]"></i>
                                <span data-i18n="kinematic_chain">運動鏈標註</span>
                            </h3>
                            <label class="flex items-center gap-2 cursor-pointer group">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="edit-mode-toggle" class="sr-only">
                                    <div class="bg-track block bg-white/10 w-8 h-4 rounded-full transition-colors border border-white/5"></div>
                                    <div class="dot absolute left-1 bg-gray-400 w-2.5 h-2.5 rounded-full transition transform group-hover:bg-white shadow-sm"></div>
                                </div>
                                <span class="text-[10px] font-bold text-gray-400 group-hover:text-white transition-colors tracking-wide uppercase" data-i18n="enable_edit">啟用編輯</span>
                            </label>
                        </div>
                        
                        <div class="flex justify-between items-center mt-1">
                            <div class="flex gap-6">
                                <label class="flex items-center gap-2 cursor-pointer group">
                                    <input type="radio" name="node-target" value="v1" checked class="text-[#FFD100] focus:ring-[#FFD100] bg-black/50 border-white/20">
                                    <span class="text-xs font-bold text-gray-300 group-hover:text-[#FFD100]" data-i18n="edit_v1">編輯 V1</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer group">
                                    <input type="radio" name="node-target" value="v2" class="text-[#FF33A1] focus:ring-[#FF33A1] bg-black/50 border-white/20">
                                    <span class="text-xs font-bold text-gray-300 group-hover:text-[#FF33A1]" data-i18n="edit_v2">編輯 V2</span>
                                </label>
                            </div>
                            <div class="flex gap-4">
                                <label class="flex items-center gap-1.5 cursor-pointer">
                                    <input type="checkbox" id="show-nodes-v1" checked class="rounded text-[#FFD100] focus:ring-[#FFD100] bg-black/50 border-white/20">
                                    <span class="text-[10px] font-semibold text-gray-400" data-i18n="show_v1_nodes">顯示 V1</span>
                                </label>
                                <label class="flex items-center gap-1.5 cursor-pointer">
                                    <input type="checkbox" id="show-nodes-v2" checked class="rounded text-[#FF33A1] focus:ring-[#FF33A1] bg-black/50 border-white/20">

    <script>
        // ==========================================
        // 1. Initialization & State Management
        // ==========================================
        lucide.createIcons();

        const APP_STATE = {
            lang: 'zh',
            activeTab: 'camera',
            camera: {
                stream: null, delaySeconds: 0, showSkeleton: false, showAngles: false,
                isMirrored: true, isRunning: false, aiReady: false, frameBuffer: []
            },
            analysis: {
                isPlaying: false, editModeEnabled: false, nodes: { v1: [], v2: [] }, draggingNode: null,
                v1: { file: null, scale: 100, x: 0, y: 0, start: 0, duration: 0 },
                v2: { file: null, scale: 100, x: 0, y: 0, start: 0, duration: 0 },
                opacity: 50
            }
        };

        const DICTIONARY = {
            zh: {
                subtitle: "射箭姿勢分析實驗室", tab_camera: "即時攝影", tab_analysis: "影片分析",
                camera_off_msg: "攝影機未啟動 (請點擊啟動)", loading_ai: "AI 模型載入中...",
                camera_settings: "攝影機設定", select_camera: "攝影機來源", resolution: "解析度",
                res_auto: "自動 (Auto)", delay_time: "延遲時間 (秒)", ai_skeleton: "AI 骨架疊加",
                show_angles: "顯示關節角度", mirror_view: "鏡像畫面 (Mirror)", start_camera: "啟動攝影機",
                stop_camera: "關閉攝影機", upload_to_start: "請上傳影片以開始分析", video_sources: "影片來源設定",
                video_1_label: "基準影片 (黃色)", video_2_label: "疊加影片 (粉紅)", choose_file: "選擇檔案",
                no_file: "未選擇檔案", overlay_opacity: "疊加透明度 (影片二)", kinematic_chain: "運動鏈標註",
                enable_edit: "啟用編輯", clear_all: "清除全部節點",
                node_instructions: "啟用編輯模式後：在畫面上左鍵新增節點，右鍵刪除，拖曳微調。系統將自動計算三個連續節點之夾角。",
                edit_v1: "編輯 V1", edit_v2: "編輯 V2", show_v1_nodes: "顯示 V1", show_v2_nodes: "顯示 V2",
                cal_v1_title: "基準影片 (V1) 校準", cal_v2_title: "疊加影片 (V2) 校準", reset_cal: "重設",
                scale: "縮放比例", pan_x: "水平平移 (X)", pan_y: "垂直平移 (Y)", start_time: "剪輯開始時間",
                export_tools: "輸出與存檔", export_include_nodes: "匯出包含運動鏈標註", export_image: "匯出畫面",
                export_video: "匯出整段影片", recording_msg: "影片匯出錄製中...", recording_warn: "請勿切換分頁或關閉瀏覽器"
            },
            en: {
                subtitle: "Archery Posture Analysis Lab", tab_camera: "Real-time Camera", tab_analysis: "Video Analysis",
                camera_off_msg: "Camera Offline (Click Start)", loading_ai: "Loading AI Model...",
                camera_settings: "Camera Settings", select_camera: "Camera Source", resolution: "Resolution",
                res_auto: "Auto", delay_time: "Delay (Sec)", ai_skeleton: "AI Skeleton",
                show_angles: "Show Joint Angles", mirror_view: "Mirror View", start_camera: "Start Camera",
                stop_camera: "Stop Camera", upload_to_start: "Upload videos to begin", video_sources: "Video Source Settings",
                video_1_label: "Base Video (Yellow)", video_2_label: "Overlay Video (Pink)", choose_file: "Choose File",
                no_file: "No file chosen", overlay_opacity: "Overlay Opacity (V2)", kinematic_chain: "Kinematic Chain",
                enable_edit: "Enable Edit", clear_all: "Clear All Nodes",
                node_instructions: "When enabled: Left click to add, right click to delete, drag to adjust. Angles are calculated automatically.",
                edit_v1: "Edit V1", edit_v2: "Edit V2", show_v1_nodes: "Show V1", show_v2_nodes: "Show V2",
                cal_v1_title: "Base Video (V1) Calib.", cal_v2_title: "Overlay Video (V2) Calib.", reset_cal: "Reset",
                scale: "Scale", pan_x: "Pan X", pan_y: "Pan Y", start_time: "Trim Start Time",
                export_tools: "Export Tools", export_include_nodes: "Include Kinematic Chain", export_image: "Export Image",
                export_video: "Export Video", recording_msg: "Recording export video...", recording_warn: "Do not close or switch tabs"
            }
        };

        function toggleLanguage() {
            APP_STATE.lang = APP_STATE.lang === 'zh' ? 'en' : 'zh';
            const dict = DICTIONARY[APP_STATE.lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) {
                    if (el.tagName === 'INPUT' && el.type === 'button') el.value = dict[key];
                    else el.textContent = dict[key];
                }
            });
            if (APP_STATE.activeTab === 'camera') {
                const btnSpan = document.querySelector('#btn-toggle-camera span');
                btnSpan.textContent = APP_STATE.camera.isRunning ? dict.stop_camera : dict.start_camera;
            }
        }
        document.getElementById('lang-toggle').addEventListener('click', toggleLanguage);

        function switchTab(tabId) {
            APP_STATE.activeTab = tabId;
            const btnCam = document.getElementById('tab-btn-camera'), btnAna = document.getElementById('tab-btn-analysis');
            const viewCam = document.getElementById('view-camera'), viewAna = document.getElementById('view-analysis');

            if (tabId === 'camera') {
                btnCam.classList.add('tab-active', 'text-gray-200'); btnCam.classList.remove('text-gray-500');
                btnAna.classList.remove('tab-active', 'text-gray-200'); btnAna.classList.add('text-gray-500');
                viewCam.classList.remove('hidden'); viewAna.classList.add('hidden');
            } else {
                btnAna.classList.add('tab-active', 'text-gray-200'); btnAna.classList.remove('text-gray-500');
                btnCam.classList.remove('tab-active', 'text-gray-200'); btnCam.classList.add('text-gray-500');
                viewAna.classList.remove('hidden'); viewCam.classList.add('hidden');
                resizeAnalysisCanvas();
            }
        }

        // ==========================================
        // Camera & MediaPipe
        // ==========================================
        const videoLive = document.getElementById('live-video'), canvasLive = document.getElementById('live-canvas');
        const ctxLive = canvasLive.getContext('2d', { willReadFrequently: true });
        const camSelect = document.getElementById('camera-select');
        let poseDetector = null, animationFrameId = null;

        function showAILoading(show) {
            const loader = document.getElementById('ai-loader'), bar = document.getElementById('ai-progress-bar');
            if (show) { loader.classList.remove('hidden'); bar.style.width = '0%'; setTimeout(() => bar.style.width = '80%', 100); } 
            else { bar.style.width = '100%'; setTimeout(() => loader.classList.add('hidden'), 300); }
        }

        async function initPose() {
            if (poseDetector) return;
            showAILoading(true);
            poseDetector = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
            poseDetector.setOptions({ modelComplexity: 1, smoothLandmarks: true, enableSegmentation: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            poseDetector.onResults(onPoseResults);
            await poseDetector.initialize();
            APP_STATE.camera.aiReady = true; showAILoading(false);
        }

        async function updateCameraList() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices(), videoDevices = devices.filter(d => d.kind === 'videoinput');
                const currentTrack = APP_STATE.camera.stream && APP_STATE.camera.stream.getVideoTracks()[0];
                const currentId = currentTrack ? currentTrack.getSettings().deviceId : null;

                camSelect.innerHTML = '';
                videoDevices.forEach((device, i) => {
                    const opt = document.createElement('option');
                    opt.value = device.deviceId; opt.text = device.label || `Camera ${i + 1}`;
                    if (currentId === device.deviceId) opt.selected = true;
                    camSelect.appendChild(opt);
                });
            } catch (e) {}
        }

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180 / Math.PI);
            return Math.round(angle > 180 ? 360 - angle : angle);
        }

        function onPoseResults(results) {
            if (!APP_STATE.camera.isRunning) return;
            ctxLive.clearRect(0, 0, canvasLive.width, canvasLive.height);
            ctxLive.drawImage(results.image, 0, 0, canvasLive.width, canvasLive.height);

            if (results.poseLandmarks && APP_STATE.camera.showSkeleton) {
                const w = canvasLive.width, h = canvasLive.height;
                ctxLive.save(); ctxLive.strokeStyle = '#FFD100'; ctxLive.lineWidth = 3; ctxLive.fillStyle = '#fff';
                ctxLive.shadowColor = 'rgba(255,209,0,0.5)'; ctxLive.shadowBlur = 5;
                for (const conn of POSE_CONNECTIONS) {
                    const s = results.poseLandmarks[conn[0]], e = results.poseLandmarks[conn[1]];
                    if (s.visibility > 0.5 && e.visibility > 0.5) { ctxLive.beginPath(); ctxLive.moveTo(s.x*w, s.y*h); ctxLive.lineTo(e.x*w, e.y*h); ctxLive.stroke(); }
                }
                ctxLive.shadowBlur = 0;
                for (const lm of results.poseLandmarks) {
                    if (lm.visibility > 0.5) { ctxLive.beginPath(); ctxLive.arc(lm.x*w, lm.y*h, 4, 0, 2*Math.PI); ctxLive.fill(); ctxLive.stroke(); }
                }
                ctxLive.restore();

                if (APP_STATE.camera.showAngles) {
                    const lm = results.poseLandmarks;
                    const drawAng = (a,b,c) => {
                        if(lm[a].visibility>0.5 && lm[b].visibility>0.5 && lm[c].visibility>0.5){
                            const ang = calculateAngle(lm[a], lm[b], lm[c]);
                            ctxLive.fillStyle = '#FF33A1'; ctxLive.font = 'bold 16px Inter';
                            ctxLive.lineWidth = 3; ctxLive.strokeStyle = '#000';
                            ctxLive.strokeText(`${ang}°`, lm[b].x*w+12, lm[b].y*h-12);
                            ctxLive.fillText(`${ang}°`, lm[b].x*w+12, lm[b].y*h-12);
                        }
                    };
                    drawAng(11,13,15); drawAng(12,14,16); drawAng(23,25,27); drawAng(24,26,28); 
                    drawAng(11,23,25); drawAng(12,24,26); drawAng(13,11,23); drawAng(14,12,24);
                }
            }
        }

        async function processVideoFrame() {
            if (!APP_STATE.camera.isRunning) return;
            if (videoLive.readyState >= 2 && videoLive.videoWidth > 0) {
                if (canvasLive.width !== videoLive.videoWidth) { canvasLive.width = videoLive.videoWidth; canvasLive.height = videoLive.videoHeight; }
                const offCanvas = document.createElement('canvas'); offCanvas.width = canvasLive.width; offCanvas.height = canvasLive.height;
                const offCtx = offCanvas.getContext('2d');
                
                if (APP_STATE.camera.isMirrored) { offCtx.translate(offCanvas.width, 0); offCtx.scale(-1, 1); }
                offCtx.drawImage(videoLive, 0, 0, offCanvas.width, offCanvas.height);
                
                APP_STATE.camera.frameBuffer.push({ time: performance.now(), image: offCanvas });
                const tTarget = performance.now() - (APP_STATE.camera.delaySeconds * 1000);
                while (APP_STATE.camera.frameBuffer.length > 1 && APP_STATE.camera.frameBuffer[1].time < tTarget) APP_STATE.camera.frameBuffer.shift();
                
                const frame = APP_STATE.camera.frameBuffer[0];
                if (frame) {
                    if (APP_STATE.camera.showSkeleton && APP_STATE.camera.aiReady) await poseDetector.send({image: frame.image});
                    else { ctxLive.clearRect(0,0,canvasLive.width,canvasLive.height); ctxLive.drawImage(frame.image, 0, 0); }
                }
            }
            animationFrameId = requestAnimationFrame(processVideoFrame);
        }

        document.getElementById('btn-toggle-camera').addEventListener('click', async () => {
            const dict = DICTIONARY[APP_STATE.lang];
            if (APP_STATE.camera.isRunning) {
                APP_STATE.camera.isRunning = false;
                if (APP_STATE.camera.stream) APP_STATE.camera.stream.getTracks().forEach(t => t.stop());
                cancelAnimationFrame(animationFrameId); ctxLive.clearRect(0, 0, canvasLive.width, canvasLive.height);
                document.getElementById('camera-placeholder').classList.remove('hidden');
                document.getElementById('btn-toggle-camera').innerHTML = `<i data-lucide="video" class="w-4 h-4"></i> <span>${dict.start_camera}</span>`;
                document.getElementById('btn-toggle-camera').className = "w-full mt-2 px-5 py-3.5 rounded-xl font-bold bg-[#FFD100] text-black hover:bg-[#FFC000] transition-all shadow-[0_0_20px_rgba(255,209,0,0.2)] flex justify-center items-center gap-2 text-sm";
                APP_STATE.camera.frameBuffer = []; lucide.createIcons();
            } else {
                const deviceId = camSelect.value, res = document.getElementById('camera-resolution').value;
                let vConstraints = { facingMode: 'environment' };
                if (deviceId && deviceId !== 'default') vConstraints.deviceId = { exact: deviceId };
                if (res === '1080p') { vConstraints.width = {ideal: 1920}; vConstraints.height = {ideal: 1080}; }
                else if (res === '720p') { vConstraints.width = {ideal: 1280}; vConstraints.height = {ideal: 720}; }
                else if (res === '4k') { vConstraints.width = {ideal: 3840}; vConstraints.height = {ideal: 2160}; }
                
                try { APP_STATE.camera.stream = await navigator.mediaDevices.getUserMedia({video: vConstraints, audio: false}); } 
                catch (err) {
                    try { APP_STATE.camera.stream = await navigator.mediaDevices.getUserMedia({video: true, audio: false}); } 
                    catch (e2) { alert("Camera access denied: " + e2.message); return; }
                }

                videoLive.srcObject = APP_STATE.camera.stream; videoLive.setAttribute('playsinline', 'true'); await videoLive.play();
                APP_STATE.camera.isRunning = true; document.getElementById('camera-placeholder').classList.add('hidden');
                document.getElementById('btn-toggle-camera').innerHTML = `<i data-lucide="video-off" class="w-4 h-4"></i> <span>${dict.stop_camera}</span>`;
                document.getElementById('btn-toggle-camera').className = "w-full mt-2 px-5 py-3.5 rounded-xl font-bold bg-[#FF33A1] text-white hover:bg-[#E62E91] transition-all shadow-[0_0_20px_rgba(255,51,161,0.2)] flex justify-center items-center gap-2 text-sm";
                lucide.createIcons();
                if (camSelect.options.length <= 1 || camSelect.value === 'default') await updateCameraList();
                processVideoFrame();
                if (APP_STATE.camera.showSkeleton && !APP_STATE.camera.aiReady) initPose();
            }
        });

        document.getElementById('delay-slider').addEventListener('input', e => { APP_STATE.camera.delaySeconds = parseFloat(e.target.value); document.getElementById('delay-val').innerText = `${APP_STATE.camera.delaySeconds.toFixed(1)}s`; });
        document.getElementById('ai-skeleton-toggle').addEventListener('change', e => { APP_STATE.camera.showSkeleton = e.target.checked; if (e.target.checked && APP_STATE.camera.isRunning && !APP_STATE.camera.aiReady) initPose(); });
        document.getElementById('joint-angle-toggle').addEventListener('change', e => APP_STATE.camera.showAngles = e.target.checked);
        document.getElementById('mirror-toggle').addEventListener('change', e => APP_STATE.camera.isMirrored = e.target.checked);


        // ==========================================
        // Video Analysis & Playback
        // ==========================================
        const video1 = document.getElementById('video-1'), video2 = document.getElementById('video-2');
        const videoTimeline = document.getElementById('video-timeline'), timeDisplay = document.getElementById('time-display');

        function formatTime(s) { return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toFixed(1).padStart(4,'0')}`; }

        function handleFileUpload(inputElemId, nameElemId, videoElem, stateKey) {
            document.getElementById(inputElemId).addEventListener('change', e => {
                const file = e.target.files[0];
                if (file) {
                    document.getElementById(nameElemId).textContent = file.name;
                    videoElem.src = URL.createObjectURL(file); videoElem.load();
                    APP_STATE.analysis[stateKey].file = file;
                    document.getElementById('video-placeholder').classList.add('hidden');
                    document.getElementById('btn-play-pause').disabled = false; videoTimeline.disabled = false;
                    videoElem.addEventListener('loadeddata', function force() { videoElem.currentTime = 0.001; videoElem.removeEventListener('loadeddata', force); });
                }
            });
        }
        handleFileUpload('upload-v1', 'name-v1', video1, 'v1');
        handleFileUpload('upload-v2', 'name-v2', video2, 'v2');

        // ★ 核心修復：精準鎖定延遲影片的第一幀，防止卡頓
        function syncVideos() {
            if (!video1.duration) return;
            const t = video1.currentTime, start1 = APP_STATE.analysis.v1.start, start2 = APP_STATE.analysis.v2.start;
            
            if(!APP_STATE.analysis.draggingTimeline) videoTimeline.value = (t / video1.duration) * 100;
            timeDisplay.textContent = formatTime(t);

            if (video2.src && video2.duration) {
                let targetV2 = start2 + (t - start1);
                
                if (targetV2 <= 0) {
                    if (!video2.paused) video2.pause();
                    if (Math.abs(video2.currentTime - 0.001) > 0.05) video2.currentTime = 0.001;
                } else if (targetV2 >= video2.duration) {
                    if (!video2.paused) video2.pause();
                } else {
                    if (APP_STATE.analysis.isPlaying && video2.paused) {
                        let playPromise = video2.play();
                        if (playPromise !== undefined) playPromise.catch(e => console.warn(e));
                    } else if (!APP_STATE.analysis.isPlaying && !video2.paused) {
                        video2.pause();
                    }
                    if (Math.abs(video2.currentTime - targetV2) > 0.15) {
                        video2.currentTime = targetV2;
                    }
                }
            }
        }

        video1.addEventListener('timeupdate', syncVideos);
        video1.addEventListener('loadedmetadata', () => { APP_STATE.analysis.v1.duration = video1.duration; document.getElementById('v1-time').max = video1.duration.toFixed(2); });
        video2.addEventListener('loadedmetadata', () => { APP_STATE.analysis.v2.duration = video2.duration; document.getElementById('v2-time').max = video2.duration.toFixed(2); });
        
        video1.addEventListener('ended', () => {
            APP_STATE.analysis.isPlaying = false;
            document.getElementById('btn-play-pause').innerHTML = '<i data-lucide="play" class="w-4 h-4 ml-0.5 text-[#FF33A1]"></i>';
            lucide.createIcons();
            if(video2.src) video2.pause();
        });

        document.getElementById('btn-play-pause').addEventListener('click', function() {
            if (APP_STATE.analysis.isPlaying) {
                video1.pause(); if(video2.src) video2.pause();
                this.innerHTML = '<i data-lucide="play" class="w-4 h-4 ml-0.5 text-[#FF33A1]"></i>'; APP_STATE.analysis.isPlaying = false;
            } else {
                APP_STATE.analysis.isPlaying = true;
                video1.play(); 
                syncVideos(); 
                this.innerHTML = '<i data-lucide="pause" class="w-4 h-4 text-[#FF33A1]"></i>'; 
            }
            lucide.createIcons();
        });

        videoTimeline.addEventListener('mousedown', () => APP_STATE.analysis.draggingTimeline = true);
        videoTimeline.addEventListener('touchstart', () => APP_STATE.analysis.draggingTimeline = true);
        videoTimeline.addEventListener('input', e => { if(video1.duration) { video1.currentTime = (e.target.value/100)*video1.duration; syncVideos(); } });
        videoTimeline.addEventListener('mouseup', () => APP_STATE.analysis.draggingTimeline = false);
        videoTimeline.addEventListener('touchend', () => APP_STATE.analysis.draggingTimeline = false);

        // Opacity Logic
        const opacitySlider = document.getElementById('opacity-slider');
        const opacityNum = document.getElementById('opacity-num');
        const updateOpacity = (val, fromSlider) => {
            let v = parseFloat(val); if(isNaN(v)) return;
            if(v<0) v=0; if(v>100) v=100;
            APP_STATE.analysis.opacity = v;
            if(fromSlider) opacityNum.value = v; else opacitySlider.value = v;
            video2.style.opacity = v / 100;
        };
        opacitySlider.addEventListener('input', e => updateOpacity(e.target.value, true));
        opacityNum.addEventListener('input', e => updateOpacity(e.target.value, false));

        // ==========================================
        // Calibration (Inputs & Sliders)
        // ==========================================
        function applyVideoTransforms() {
            video1.style.transform = `scale(${APP_STATE.analysis.v1.scale/100}) translate(${APP_STATE.analysis.v1.x}%, ${APP_STATE.analysis.v1.y}%)`;
            video2.style.transform = `scale(${APP_STATE.analysis.v2.scale/100}) translate(${APP_STATE.analysis.v2.x}%, ${APP_STATE.analysis.v2.y}%)`;
        }

        function bindCalControl(vidId, stateProp, isTime) {
            const slider = document.getElementById(`${vidId}-${stateProp}`);
            const numInput = document.getElementById(`${vidId}-${stateProp}-num`);

            const updateState = (val, source) => {
                let parsed = parseFloat(val); if (isNaN(parsed)) return;
                if (isTime && parsed < 0) parsed = 0;

                APP_STATE.analysis[vidId][stateProp] = parsed;
                if (source === 'slider') numInput.value = isTime ? parsed.toFixed(2) : parsed;
                else slider.value = parsed;

                if (isTime) { APP_STATE.analysis[vidId].start = parsed; } 
                else { applyVideoTransforms(); }
            };

            slider.addEventListener('input', e => updateState(e.target.value, 'slider'));
            numInput.addEventListener('input', e => updateState(e.target.value, 'input'));
            
            if(isTime) {
                slider.addEventListener('change', () => syncVideos());
                numInput.addEventListener('change', () => syncVideos());
            }
        }

        ['v1', 'v2'].forEach(vid => {
            bindCalControl(vid, 'scale', false); bindCalControl(vid, 'x', false); bindCalControl(vid, 'y', false); bindCalControl(vid, 'time', true);
            
            document.getElementById(`btn-reset-${vid}`).addEventListener('click', () => {
                APP_STATE.analysis[vid] = { ...APP_STATE.analysis[vid], scale: 100, x: 0, y: 0, start: 0, time: 0 };
                ['scale', 'x', 'y', 'time'].forEach(p => {
                    const val = p === 'scale' ? 100 : 0;
                    document.getElementById(`${vid}-${p}`).value = val;
                    document.getElementById(`${vid}-${p}-num`).value = p === 'time' ? `0.00` : val;
                });
                applyVideoTransforms(); syncVideos();
            });
        });

        // ==========================================
        // Kinematic Nodes
        // ==========================================
        const anaCanvas = document.getElementById('analysis-canvas'), anaCtx = anaCanvas.getContext('2d'), anaContainer = document.getElementById('analysis-container');
        function resizeAnalysisCanvas() {
            if (anaContainer && (anaCanvas.width !== anaContainer.clientWidth || anaCanvas.height !== anaContainer.clientHeight)) {
                anaCanvas.width = anaContainer.clientWidth; anaCanvas.height = anaContainer.clientHeight;
                drawAnalysisCanvas();
            }
        }
        window.addEventListener('resize', resizeAnalysisCanvas); setInterval(resizeAnalysisCanvas, 500);

        document.getElementById('edit-mode-toggle').addEventListener('change', e => {
            APP_STATE.analysis.editModeEnabled = e.target.checked;
            e.target.checked ? anaContainer.classList.add('editing-mode') : (anaContainer.classList.remove('editing-mode'), APP_STATE.analysis.draggingNode = null);
        });

        function drawAnalysisCanvas() {
            anaCtx.clearRect(0, 0, anaCanvas.width, anaCanvas.height);
            const drawNodes = (nodes, col, glow) => {
                anaCtx.strokeStyle = col; anaCtx.fillStyle = col;
                if (nodes.length > 1) {
                    anaCtx.lineWidth = 2.5; anaCtx.shadowColor = glow; anaCtx.shadowBlur = 8;
                    anaCtx.beginPath(); anaCtx.moveTo(nodes[0].x*anaCanvas.width, nodes[0].y*anaCanvas.height);
                    for(let i=1; i<nodes.length; i++) anaCtx.lineTo(nodes[i].x*anaCanvas.width, nodes[i].y*anaCanvas.height);
                    anaCtx.stroke(); anaCtx.shadowBlur = 0; 
                }
                if (nodes.length >= 3) {
                    for(let i=1; i<nodes.length-1; i++) {
                        const ang = getVisualAngle(nodes[i-1], nodes[i], nodes[i+1], anaCanvas.width, anaCanvas.height);
                        anaCtx.font = 'bold 14px Inter'; anaCtx.lineWidth = 3; anaCtx.strokeStyle = 'rgba(10,10,11,0.8)';
                        anaCtx.strokeText(`${ang}°`, nodes[i].x*anaCanvas.width+12, nodes[i].y*anaCanvas.height-12);
                        anaCtx.fillText(`${ang}°`, nodes[i].x*anaCanvas.width+12, nodes[i].y*anaCanvas.height-12);
                    }
                }
                nodes.forEach(n => {
                    anaCtx.beginPath(); anaCtx.arc(n.x*anaCanvas.width, n.y*anaCanvas.height, 5, 0, 2*Math.PI); anaCtx.fill();
                    anaCtx.lineWidth = 1.5; anaCtx.strokeStyle = '#FFF'; anaCtx.stroke();
                });
            };
            if(document.getElementById('show-nodes-v1').checked) drawNodes(APP_STATE.analysis.nodes.v1, '#FFD100', 'rgba(255,209,0,0.5)'); 
            if(document.getElementById('show-nodes-v2').checked) drawNodes(APP_STATE.analysis.nodes.v2, '#FF33A1', 'rgba(255,51,161,0.5)'); 
        }
        function getPointerPos(e) { const r = anaCanvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: (t.clientX - r.left)/anaCanvas.width, y: (t.clientY - r.top)/anaCanvas.height }; }
        function getVisualAngle(p1,p2,p3,w,h) { let a = Math.abs((Math.atan2(p3.y*h - p2.y*h, p3.x*w - p2.x*w) - Math.atan2(p1.y*h - p2.y*h, p1.x*w - p2.x*w))*180/Math.PI); return Math.round(a>180?360-a:a); }
        
        anaCanvas.addEventListener('mousedown', e => {
            if(!APP_STATE.analysis.editModeEnabled) return; e.preventDefault();
            const pos = getPointerPos(e), target = document.querySelector('input[name="node-target"]:checked').value, nodes = APP_STATE.analysis.nodes[target];
            let idx = nodes.findIndex(n => Math.hypot(n.x - pos.x, n.y - pos.y) < 15/anaCanvas.width);
            if (e.button === 2) { if(idx > -1) nodes.splice(idx, 1); } 
            else if (e.button === 0) { if(idx > -1) APP_STATE.analysis.draggingNode = {set: target, index: idx}; else nodes.push(pos); }
            drawAnalysisCanvas();
        });
        anaCanvas.addEventListener('mousemove', e => { if(APP_STATE.analysis.draggingNode) { e.preventDefault(); APP_STATE.analysis.nodes[APP_STATE.analysis.draggingNode.set][APP_STATE.analysis.draggingNode.index] = getPointerPos(e); drawAnalysisCanvas(); }});
        window.addEventListener('mouseup', () => APP_STATE.analysis.draggingNode = null);
        anaCanvas.addEventListener('contextmenu', e => { if(APP_STATE.analysis.editModeEnabled) e.preventDefault(); });
        ['show-nodes-v1', 'show-nodes-v2'].forEach(id => document.getElementById(id).addEventListener('change', drawAnalysisCanvas));
        document.getElementById('btn-clear-nodes').addEventListener('click', () => { APP_STATE.analysis.nodes.v1 = []; APP_STATE.analysis.nodes.v2 = []; drawAnalysisCanvas(); });

        // ==========================================
        // Export Functions
        // ==========================================
        function drawSceneToTargetCanvas(targetCtx, w, h, includeNodes) {
            targetCtx.fillStyle = '#000'; targetCtx.fillRect(0, 0, w, h);
            const drawVid = (vid, conf, isOverlay) => {
                if(vid.readyState >= 2) {
                    targetCtx.save();
                    if(isOverlay) targetCtx.globalAlpha = APP_STATE.analysis.opacity/100;
                    targetCtx.translate(w/2, h/2); targetCtx.scale(conf.scale/100, conf.scale/100);
                    targetCtx.translate(w*(conf.x/100), h*(conf.y/100)); targetCtx.translate(-w/2, -h/2);
                    const scale = Math.min(w/vid.videoWidth, h/vid.videoHeight);
                    const drawW = vid.videoWidth * scale, drawH = vid.videoHeight * scale;
                    targetCtx.drawImage(vid, (w-drawW)/2, (h-drawH)/2, drawW, drawH);
                    targetCtx.restore();
                }
            };
            drawVid(video1, APP_STATE.analysis.v1, false); drawVid(video2, APP_STATE.analysis.v2, true);
            if(includeNodes) targetCtx.drawImage(anaCanvas, 0, 0, w, h);
        }

        document.getElementById('btn-export-image').addEventListener('click', () => {
            const c = document.createElement('canvas'); c.width = anaCanvas.width; c.height = anaCanvas.height;
            drawSceneToTargetCanvas(c.getContext('2d'), c.width, c.height, document.getElementById('export-nodes-toggle').checked);
            const a = document.createElement('a'); a.download = `Artemis_Frame_${Date.now()}.png`; a.href = c.toDataURL('image/png'); a.click();
        });

        document.getElementById('btn-export-video').addEventListener('click', async () => {
            if(!video1.duration) return alert("請先上傳基準影片！ (Please upload base video first!)");
            
            const overlay = document.getElementById('recording-overlay');
            overlay.classList.remove('hidden'); overlay.classList.add('flex');
            document.getElementById('analysis-container').classList.add('recording-active');

            const c = document.createElement('canvas'); c.width = anaCanvas.width; c.height = anaCanvas.height;
            const ctx = c.getContext('2d'); const stream = c.captureStream(30);
            
            const recorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm' });
            const chunks = []; recorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                const blob = new Blob(chunks, {type: 'video/webm'});
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Artemis_Analysis_${Date.now()}.webm`; a.click();
                overlay.classList.add('hidden'); overlay.classList.remove('flex');
                document.getElementById('analysis-container').classList.remove('recording-active');
                
                APP_STATE.analysis.isPlaying = false; 
                document.getElementById('btn-play-pause').innerHTML = '<i data-lucide="play" class="w-4 h-4 ml-0.5 text-[#FF33A1]"></i>';
                lucide.createIcons();
            };

            APP_STATE.analysis.isPlaying = true;
            video1.currentTime = 0; 
            syncVideos(); 
            video1.play(); 
            recorder.start();

            const renderLoop = () => {
                if(recorder.state !== 'recording') return;
                drawSceneToTargetCanvas(ctx, c.width, c.height, document.getElementById('export-nodes-toggle').checked);
                if(video1.ended || video1.currentTime >= video1.duration - 0.05) { 
                    video1.pause(); if(video2.src) video2.pause(); 
                    recorder.stop(); return; 
                }
                requestAnimationFrame(renderLoop);
            };
            requestAnimationFrame(renderLoop);
        });

    </script>
</body>
</html>
