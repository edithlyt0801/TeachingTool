    PHYLAB_$("phylabStepText").textContent = PHYLAB_t("step_adjust");
    this.renderSVG();
    this.renderData();
    this.bindControls();
  },

  equipItem: function (id, zh, en) {
    var name = (PHYLAB_LANG === "en") ? en : zh;
    return ''
      + '<div class="phylab-equip-item">'
      +   '<div class="phylab-equip-icon">'
      +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      +       '<circle cx="12" cy="12" r="3"/>'
      +     '</svg>'
      +   '</div>'
      +   '<span>' + PHYLAB_esc(name) + '</span>'
      + '</div>';
  },

  /* Map 0-150 cm to 0-700 px range: 60 + value*4 */
  cmToPx: function (cm) {
    return 60 + cm * 4;
  },

  renderSVG: function () {
    var svg = PHYLAB_$("phylabLensSVG");
    if (!svg) { return; }
    var s = this.state;
    var objPos = 20;
    var lensPos = s.lensPosition;
    var screenPos = s.screenPosition;
    var f = s.focalLength;

    var u = lensPos - objPos; /* object distance */
    var v = screenPos - lensPos; /* image distance */

    /* Sharpness: how close does screen position match predicted image distance?
       Predicted image distance from thin lens: 1/v = 1/f - 1/(-u) -> v = uf/(u-f) */
    var predictedV = (u > f) ? (u * f) / (u - f) : -1;
    var sharpnessPct;
    if (predictedV < 0) {
      sharpnessPct = 0;
    } else {
      var diff = Math.abs(v - predictedV);
      sharpnessPct = Math.max(0, 100 - diff * 20);
    }

    var objPx = this.cmToPx(objPos);
    var lensPx = this.cmToPx(lensPos);
    var screenPx = this.cmToPx(screenPos);
    var axisY = 220;

    /* Blur factor for image */
    var blur = Math.max(0, 1 - sharpnessPct / 100);

    svg.innerHTML = ''
      + '<defs>'
      +   '<radialGradient id="phylabLensGlow">'
      +     '<stop offset="0%" stop-color="rgba(99,102,241,0.3)"/>'
      +     '<stop offset="100%" stop-color="rgba(99,102,241,0)"/>'
      +   '</radialGradient>'
      + '</defs>'

      /* Bench */
      + '<rect x="20" y="' + (axisY + 60) + '" width="660" height="20" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>'

      /* Ruler ticks */
      + this.renderRuler(axisY + 60)

      /* Optical axis */
      + '<line x1="40" y1="' + axisY + '" x2="680" y2="' + axisY + '" stroke="#334155" stroke-width="1" stroke-dasharray="6 4"/>'

      /* Light rays from object through lens */
      + this.renderRays(objPx, lensPx, screenPx, axisY, f, u, v)

      /* Object (arrow) */
      + '<g transform="translate(' + objPx + ',' + axisY + ')">'
      +   '<line x1="0" y1="0" x2="0" y2="-50" stroke="#10b981" stroke-width="3"/>'
      +   '<polygon points="-6,-46 6,-46 0,-56" fill="#10b981"/>'
      +   '<circle cy="-25" r="18" fill="rgba(16,185,129,0.15)"/>'
      + '</g>'
      + '<text x="' + objPx + '" y="' + (axisY + 20) + '" font-size="11" fill="#10b981" text-anchor="middle" font-weight="700">OBJECT</text>'

      /* Lens */
      + '<g transform="translate(' + lensPx + ',' + axisY + ')">'
      +   '<polygon points="0,-70 -22,0 0,70 22,0" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="2"/>'
      +   '<line x1="0" y1="-70" x2="0" y2="70" stroke="#a5b4fc" stroke-width="0.5" stroke-dasharray="3 3"/>'
      + '</g>'
      + '<text x="' + lensPx + '" y="' + (axisY + 90) + '" font-size="11" fill="#a5b4fc" text-anchor="middle" font-weight="700">LENS</text>'

      /* Screen */
      + '<g transform="translate(' + screenPx + ',' + axisY + ')">'
      +   '<rect x="-3" y="-80" width="6" height="160" fill="#475569" rx="2"/>'
      +   '<rect x="-2" y="-78" width="4" height="156" fill="#64748b"/>'
      + '</g>'
      + '<text x="' + screenPx + '" y="' + (axisY + 90) + '" font-size="11" fill="#cbd5e1" text-anchor="middle" font-weight="700">SCREEN</text>'

      /* Image on screen */
      + this.renderImage(screenPx, axisY, u, v, f, blur, sharpnessPct)

      /* Info box */
      + '<rect x="480" y="30" width="200" height="90" rx="8" fill="rgba(15,23,42,0.75)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>'
      + '<text x="495" y="52" font-size="10" fill="#64748b" font-family="monospace">u = ' + u.toFixed(0) + ' cm, v = ' + v.toFixed(0) + ' cm</text>'
      + '<text x="495" y="72" font-size="10" fill="#64748b" font-family="monospace">1/u + 1/v = 1/f</text>'
      + '<text x="495" y="90" font-size="10" fill="#64748b" font-family="monospace">f expected = ' + f.toFixed(1) + ' cm</text>'
      + '<text x="495" y="110" font-size="12" fill="' + (sharpnessPct > 90 ? '#10b981' : (sharpnessPct > 60 ? '#fbbf24' : '#ef4444')) + '" font-family="monospace" font-weight="700">Sharpness: ' + sharpnessPct.toFixed(0) + '%</text>';
  },

  renderRuler: function (y) {
    var html = '<rect x="40" y="' + (y - 8) + '" width="620" height="20" fill="#0f172a" stroke="#334155" rx="2"/>';
    for (var i = 0; i <= 30; i++) {
      var x = 60 + i * 20;
      var isMajor = (i % 5 === 0);
      html += '<line x1="' + x + '" y1="' + (y - 8) + '" x2="' + x + '" y2="' + (y - (isMajor ? 18 : 13)) + '" stroke="#475569" stroke-width="1"/>';
      if (isMajor) {
        html += '<text x="' + x + '" y="' + (y + 22) + '" font-size="9" fill="#64748b" text-anchor="middle" font-family="monospace">' + (i * 5) + '</text>';
      }
    }
    return html;
  },

  renderRays: function (objPx, lensPx, screenPx, axisY, f, u, v) {
    /* Three characteristic rays from arrow tip */
    var objHeight = 50;
    var objTipX = objPx;
    var objTipY = axisY - objHeight;

    /* Image position and height (thin lens) */
    if (u <= f) {
      /* No real image */
      return ''
        + '<line x1="' + objTipX + '" y1="' + objTipY + '" x2="' + lensPx + '" y2="' + objTipY + '" stroke="#fbbf24" stroke-width="1" opacity="0.6"/>'
        + '<line x1="' + objTipX + '" y1="' + objTipY + '" x2="' + lensPx + '" y2="' + (axisY + 40) + '" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>';
    }
    var imgHeight = objHeight * (v / u);
    var imgX = screenPx;
    var imgTipY = axisY + imgHeight;

    var rays = '';

    /* Ray 1: Parallel to axis, through focal point */
    rays += '<line x1="' + objTipX + '" y1="' + objTipY + '" x2="' + lensPx + '" y2="' + objTipY + '" stroke="#fbbf24" stroke-width="1.5" opacity="0.75"/>';
    rays += '<line x1="' + lensPx + '" y1="' + objTipY + '" x2="' + (lensPx + 200) + '" y2="' + (objTipY + (200 / (lensPx - (lensPx - f * 4)) * 0)) + '" stroke="#fbbf24" stroke-width="1.5" opacity="0.75"/>';
    /* This ray 1 goes toward focal point on other side */
    var fPx = f * 4;
    var ray1EndX = 680;
    var ray1EndY = objTipY + (ray1EndX - lensPx) * ((axisY - objTipY) / (fPx));
    rays += '<line x1="' + lensPx + '" y1="' + objTipY + '" x2="' + ray1EndX + '" y2="' + ray1EndY + '" stroke="#fbbf24" stroke-width="1.5" opacity="0.75"/>';

    /* Ray 2: Through optical centre (undeviated) */
    var slope2 = (axisY - objTipY) / (lensPx - objTipX);
    var ray2EndX = 680;
    var ray2EndY = objTipY + (ray2EndX - objTipX) * ((axisY - objTipY) / (lensPx - objTipX));
    rays += '<line x1="' + objTipX + '" y1="' + objTipY + '" x2="' + ray2EndX + '" y2="' + ray2EndY + '" stroke="#fbbf24" stroke-width="1.5" opacity="0.75"/>';

    /* Ray 3: Through front focal point, exits parallel */
    var frontF = lensPx - fPx;
    if (frontF > objTipX) {
      rays += '<line x1="' + objTipX + '" y1="' + objTipY + '" x2="' + lensPx + '" y2="' + (objTipY + (lensPx - objTipX) * ((axisY - objTipY) / (frontF - objTipX))) + '" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>';
    }

    return rays;
  },

  renderImage: function (screenPx, axisY, u, v, f, blur, sharpnessPct) {
    if (sharpnessPct < 20) {
      /* Too blurry, just a smudge */
      return '<ellipse cx="' + screenPx + '" cy="' + axisY + '" rx="30" ry="40" fill="rgba(251,191,36,' + (0.15 + sharpnessPct / 400) + ')"/>';
    }
    var imgHeight = 50 * (v / u);
    var opacity = sharpnessPct / 100;
    /* Inverted arrow */
    return ''
      + '<g transform="translate(' + screenPx + ',' + axisY + ')" opacity="' + opacity + '">'
      +   '<line x1="0" y1="0" x2="0" y2="' + imgHeight + '" stroke="#fbbf24" stroke-width="3"/>'
      +   '<polygon points="-6,' + (imgHeight - 4) + ' 6,' + (imgHeight - 4) + ' 0,' + (imgHeight + 6) + '" fill="#fbbf24"/>'
      + '</g>';
  },

  bindControls: function () {
    var self = this;
    var lensSlider = PHYLAB_$("phylabLensPos");
    if (lensSlider) {
      lensSlider.addEventListener("input", function () {
        self.state.lensPosition = parseInt(this.value, 10);
        var el = PHYLAB_$("phylabLensPosVal");
        if (el) { el.textContent = self.state.lensPosition + " cm"; }
        self.updateReadouts();
        self.renderSVG();
      });
    }
    var screenSlider = PHYLAB_$("phylabScreenPos");
    if (screenSlider) {
      screenSlider.addEventListener("input", function () {
        self.state.screenPosition = parseInt(this.value, 10);
        var el = PHYLAB_$("phylabScreenPosVal");
        if (el) { el.textContent = self.state.screenPosition + " cm"; }
        self.updateReadouts();
        self.renderSVG();
      });
    }
    var recBtn = PHYLAB_$("phylabLensRecord");
    if (recBtn) {
      recBtn.addEventListener("click", function () { self.record(); });
    }
    this.updateReadouts();
  },

  updateReadouts: function () {
    var s = this.state;
    var objPos = 20;
    var u = s.lensPosition - objPos;
    var v = s.screenPosition - s.lensPosition;
    var uEl = PHYLAB_$("phylabLensU");
    if (uEl) { uEl.innerHTML = u + '<span class="phylab-readout-unit">cm</span>'; }
    var vEl = PHYLAB_$("phylabLensV");
    if (vEl) { vEl.innerHTML = v + '<span class="phylab-readout-unit">cm</span>'; }

    var predictedV = (u > s.focalLength) ? (u * s.focalLength) / (u - s.focalLength) : -1;
    var sharp = (predictedV > 0) ? Math.max(0, 100 - Math.abs(v - predictedV) * 20) : 0;
    var sEl = PHYLAB_$("phylabLensSharp");
    if (sEl) {
      sEl.textContent = sharp.toFixed(0) + "%";
      sEl.style.color = sharp > 90 ? "#10b981" : (sharp > 60 ? "#fbbf24" : "#ef4444");
    }
  },

  record: function () {
    var s = this.state;
    var objPos = 20;
    var u = s.lensPosition - objPos;
    var v = s.screenPosition - s.lensPosition;
    var predictedV = (u > s.focalLength) ? (u * s.focalLength) / (u - s.focalLength) : -1;
    var sharp = (predictedV > 0) ? Math.max(0, 100 - Math.abs(v - predictedV) * 20) : 0;

    if (sharp < 60) {
      PHYLAB_toast(PHYLAB_LANG === "en"
        ? "Image is not sharp enough (min 60%). Adjust the screen position."
        : "影像不夠清晰（至少 60%）。請調整屏幕位置。", "warn");
      return;
    }
    if (u <= s.focalLength) {
      PHYLAB_toast(PHYLAB_LANG === "en"
        ? "Object must be farther than the focal length."
        : "物距必須大於焦距，才可形成實像。", "warn");
      return;
    }
    var fMeasured = (u * v) / (u + v);
    s.data.push({ u: u, v: v, f: fMeasured, sharp: sharp });
    this.renderData();
    PHYLAB_$("phylabStepText").textContent = PHYLAB_t("step_record") + " (" + s.data.length + ")";
  },

  renderData: function () {
    var el = PHYLAB_$("phylabLensData");
    if (!el) { return; }
    var d = this.state.data;
    if (d.length === 0) {
      el.innerHTML = '<table class="phylab-data-table"><tr class="empty"><td>' + PHYLAB_esc(PHYLAB_t("no_data")) + '</td></tr></table>';
      return;
    }
    var html = '<table class="phylab-data-table"><thead><tr>'
      + '<th>u</th><th>v</th><th>f</th>'
      + '</tr></thead><tbody>';
    for (var i = 0; i < d.length; i++) {
      html += '<tr>'
        + '<td>' + d[i].u + '</td>'
        + '<td>' + d[i].v + '</td>'
        + '<td>' + d[i].f.toFixed(1) + '</td>'
        + '</tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  },

  score: function () {
    var d = this.state.data;
    if (d.length < 3) {
      return { error: PHYLAB_t("insufficient_data") };
    }
    /* Average measured focal length */
    var sum = 0;
    for (var i = 0; i < d.length; i++) { sum += d[i].f; }
    var fMeasured = sum / d.length;

    var expected = 15.0;
    var errorPct = Math.abs(fMeasured - expected) / expected * 100;
    var score;
    if (errorPct < 2) { score = 100; }
    else if (errorPct < 5) { score = 90; }
    else if (errorPct < 10) { score = 75; }
    else if (errorPct < 20) { score = 55; }
    else { score = 30; }

    var advice = [];
    if (d.length < 4) {
      advice.push(PHYLAB_LANG === "en"
        ? "Only " + d.length + " data points. Try at least 4 different u values."
        : "只有 " + d.length + " 組數據。建議至少量度 4 組不同物距。");
    }
    if (errorPct < 5) {
      advice.push(PHYLAB_LANG === "en"
        ? "Good result! Your focal length closely matches the expected value."
        : "結果良好！你的焦距非常接近標準值。");
    } else {
      advice.push(PHYLAB_LANG === "en"
        ? "Large error. Make sure the image is sharp (>=90%) before recording."
        : "誤差較大。請確認屏幕成像清晰（清晰度 ≥ 90%）後才記錄數據。");
    }
    advice.push(PHYLAB_LANG === "en"
      ? "Formula: 1/u + 1/v = 1/f. Average the f values from multiple trials."
      : "公式：1/u + 1/v = 1/f。將多次實驗的 f 值取平均以提升準確度。");

    return {
      score: score,
      measured: fMeasured,
      expected: expected,
      unit: this.unit,
      errorPct: errorPct,
      advice: advice
    };
  }
};

/* ============================================================
   EXPERIMENT SELECTOR RENDERER
   ============================================================ */
function PHYLAB_renderSelector() {
  var grid = PHYLAB_$("phylabExpGrid");
  if (!grid) { return; }
  grid.innerHTML = "";

  var expKeys = Object.keys(PHYLAB_experiments);
  for (var i = 0; i < expKeys.length; i++) {
    (function (key) {
      var exp = PHYLAB_experiments[key];
      var card = document.createElement("button");
      card.className = "phylab-exp-card";
      card.type = "button";

      var title = (PHYLAB_LANG === "en") ? exp.title_en : exp.title_zh;
      var desc = (PHYLAB_LANG === "en") ? exp.desc_en : exp.desc_zh;

      var diffDots = "";
      for (var d = 1; d <= 3; d++) {
        diffDots += '<div class="phylab-exp-difficulty-dot ' + (d <= exp.difficulty ? "filled" : "") + '"></div>';
      }

      card.innerHTML = ''
        + '<div class="phylab-exp-preview">' + exp.previewSVG() + '</div>'
        + '<div class="phylab-exp-title">' + PHYLAB_esc(title) + '</div>'
        + '<div class="phylab-exp-subtitle">' + PHYLAB_esc(desc) + '</div>'
        + '<div class="phylab-exp-meta">'
        +   '<div class="phylab-exp-difficulty">' + diffDots + '</div>'
        +   '<div class="phylab-exp-start">'
        +     '<span>' + PHYLAB_esc(PHYLAB_t("start")) + '</span>'
        +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
        +   '</div>'
        + '</div>';

      card.addEventListener("click", function () {
        PHYLAB_openExperiment(key);
      });

      grid.appendChild(card);
    })(expKeys[i]);
  }
}

/* ============================================================
   OPEN EXPERIMENT
   ============================================================ */
var PHYLAB_currentExp = null;

function PHYLAB_openExperiment(key) {
  var exp = PHYLAB_experiments[key];
  if (!exp) { return; }
  PHYLAB_currentExp = exp;
  exp.reset();
  PHYLAB_showScreen("lab");
  var title = (PHYLAB_LANG === "en") ? exp.title_en : exp.title_zh;
  var titleEl = PHYLAB_$("phylabLabTitle");
  if (titleEl) { titleEl.textContent = title; }
  exp.render();
}

/* ============================================================
   RESULT MODAL
   ============================================================ */
function PHYLAB_showResult(result) {
  if (result.error) {
    PHYLAB_toast(result.error, "warn");
    return;
  }

  var backdrop = PHYLAB_$("phylabResultBackdrop");
  if (!backdrop) { return; }

  var emoji = "🎉";
  var title = PHYLAB_t("result_excellent");
  if (result.score >= 90) {
    emoji = "🏆"; title = PHYLAB_t("result_excellent");
  } else if (result.score >= 75) {
    emoji = "✨"; title = PHYLAB_t("result_good");
  } else if (result.score >= 55) {
    emoji = "👍"; title = PHYLAB_t("result_ok");
  } else {
    emoji = "📚"; title = PHYLAB_t("result_poor");
  }

  var emojiEl = PHYLAB_$("phylabResultEmoji");
  if (emojiEl) { emojiEl.textContent = emoji; }
  var titleEl = PHYLAB_$("phylabResultTitle");
  if (titleEl) { titleEl.textContent = title; }
  var subEl = PHYLAB_$("phylabResultSub");
  if (subEl) { subEl.textContent = PHYLAB_t("score_lbl") + ": " + result.score + " / 100"; }

  /* Score ring */
  var circumference = 2 * Math.PI * 38;
  var dash = (result.score / 100) * circumference;
  var ring = PHYLAB_$("phylabScoreRing");
  if (ring) {
    var color = result.score >= 75 ? "#10b981" : (result.score >= 55 ? "#f59e0b" : "#ef4444");
    ring.setAttribute("stroke", color);
    ring.setAttribute("stroke-dasharray", "0 " + circumference);
    setTimeout(function () {
      ring.setAttribute("stroke-dasharray", dash + " " + circumference);
    }, 100);
  }
  var textEl = PHYLAB_$("phylabScoreText");
  if (textEl) {
    textEl.textContent = "0%";
    textEl.style.color = result.score >= 75 ? "#10b981" : (result.score >= 55 ? "#f59e0b" : "#ef4444");
    var startTime = Date.now();
    var animate = function () {
      var elapsed = Date.now() - startTime;
      var pct = Math.min(result.score, (elapsed / 800) * result.score);
      textEl.textContent = Math.round(pct) + "%";
      if (pct < result.score) { requestAnimationFrame(animate); }
    };
    animate();
  }

  /* Compare table */
  var compareHtml = ''
    + '<div class="phylab-compare-row">'
    +   '<span class="phylab-compare-label">' + PHYLAB_esc(PHYLAB_t("your_result")) + '</span>'
    +   '<span class="phylab-compare-value">' + result.measured.toFixed(2) + ' ' + PHYLAB_esc(result.unit) + '</span>'
    + '</div>'
    + '<div class="phylab-compare-row">'
    +   '<span class="phylab-compare-label">' + PHYLAB_esc(PHYLAB_t("expected")) + '</span>'
    +   '<span class="phylab-compare-value">' + result.expected.toFixed(2) + ' ' + PHYLAB_esc(result.unit) + '</span>'
    + '</div>'
    + '<div class="phylab-compare-row">'
    +   '<span class="phylab-compare-label">' + PHYLAB_esc(PHYLAB_t("error_pct")) + '</span>'
    +   '<span class="phylab-compare-value" style="color:' + (result.errorPct < 5 ? "#10b981" : (result.errorPct < 15 ? "#f59e0b" : "#ef4444")) + ';">' + result.errorPct.toFixed(2) + '%</span>'
    + '</div>';
  var cmpEl = PHYLAB_$("phylabResultCompare");
  if (cmpEl) { cmpEl.innerHTML = compareHtml; }

  /* Advice */
  var adviceHtml = ''
    + '<div class="phylab-advice-head">'
    +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">'
    +     '<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'
    +   '</svg>'
    +   '<span>' + PHYLAB_esc(PHYLAB_t("advice_title")) + '</span>'
    + '</div>'
    + '<ul>';
  for (var i = 0; i < result.advice.length; i++) {
    adviceHtml += '<li>' + PHYLAB_esc(result.advice[i]) + '</li>';
  }
  adviceHtml += '</ul>';
  var advEl = PHYLAB_$("phylabResultAdvice");
  if (advEl) { advEl.innerHTML = adviceHtml; }

  backdrop.classList.add("show");

  /* Confetti on high score */
  if (result.score >= 75 && typeof PHY_launchConfetti === "function") {
    try { PHY_launchConfetti(); } catch (e) {}
  }
}

function PHYLAB_hideResult() {
  var backdrop = PHYLAB_$("phylabResultBackdrop");
  if (backdrop) { backdrop.classList.remove("show"); }
}

/* ============================================================
   TOAST HELPER (fallback if not present)
   ============================================================ */
var PHYLAB_toastTimer = null;
function PHYLAB_toast(msg, type) {
  /* Use existing toast if available */
  var existing = PHYLAB_$("toast");
  if (existing && typeof PHY_toast === "function") {
    try { PHY_toast(msg, type); return; } catch (e) {}
  }
  /* Fallback */
  var el = PHYLAB_$("phylabToast");
  if (!el) {
    el = document.createElement("div");
    el.id = "phylabToast";
    el.style.cssText = "position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 10px 40px rgba(0,0,0,0.5);opacity:0;transition:all 0.3s;max-width:90vw;text-align:center;";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = "1";
  el.style.transform = "translateX(-50%) translateY(0)";
  if (PHYLAB_toastTimer) { clearTimeout(PHYLAB_toastTimer); }
  PHYLAB_toastTimer = setTimeout(function () {
    el.style.opacity = "0";
    el.style.transform = "translateX(-50%) translateY(20px)";
  }, 2200);
}

/* ============================================================
   I18N APPLY FOR EXISTING TEXTS
   ============================================================ */
function PHYLAB_applyI18n() {
  var els = document.querySelectorAll("[data-phylab-i18n]");
  for (var i = 0; i < els.length; i++) {
    var key = els[i].getAttribute("data-phylab-i18n");
    els[i].textContent = PHYLAB_t(key);
  }
}

/* ============================================================
   PARTICLES FOR LAUNCHER
   ============================================================ */
function PHYLAB_spawnParticles() {
  var wrap = PHYLAB_$("phylabParticles");
  if (!wrap) { return; }
  var html = "";
  for (var i = 0; i < 30; i++) {
    var left = Math.random() * 100;
    var delay = Math.random() * 20;
    var duration = 15 + Math.random() * 15;
    var size = 1 + Math.random() * 3;
    html += '<div class="phylab-particle" style="left:' + left + '%; animation-delay: -' + delay + 's; animation-duration: ' + duration + 's; width:' + size + 'px; height:' + size + 'px;"></div>';
  }
  wrap.innerHTML = html;
}

/* ============================================================
   WIRE UP LAUNCHER & NAVIGATION
   ============================================================ */
function PHYLAB_bindNavigation() {
  /* Launcher choices */
  var choices = document.querySelectorAll("[data-phylab-choice]");
  for (var i = 0; i < choices.length; i++) {
    (function (btn) {
      btn.addEventListener("click", function () {
        var choice = btn.getAttribute("data-phylab-choice");
        if (choice === "practice") {
          PHYLAB_hideAll();
        } else if (choice === "experiment") {
          PHYLAB_showScreen("selector");
          PHYLAB_renderSelector();
        }
      });
    })(choices[i]);
  }

  /* Back buttons */
  var navs = document.querySelectorAll("[data-phylab-nav]");
  for (var j = 0; j < navs.length; j++) {
    (function (btn) {
      btn.addEventListener("click", function () {
        var target = btn.getAttribute("data-phylab-nav");
        if (target === "launcher") {
          PHYLAB_showScreen("launcher");
        } else if (target === "selector") {
          PHYLAB_showScreen("selector");
          PHYLAB_renderSelector();
        }
      });
    })(navs[j]);
  }

  /* Reset button */
  var resetBtn = PHYLAB_$("phylabReset");
  if (resetBtn) {
    resetBtn.addEventListener("click", function () {
      if (!PHYLAB_currentExp) { return; }
      if (!confirm(PHYLAB_LANG === "en" ? "Reset current experiment?" : "確定重置此實驗？")) { return; }
      PHYLAB_currentExp.reset();
      PHYLAB_currentExp.render();
    });
  }

  /* Score button */
  var scoreBtn = PHYLAB_$("phylabScore");
  if (scoreBtn) {
    scoreBtn.addEventListener("click", function () {
      if (!PHYLAB_currentExp) { return; }
      var result = PHYLAB_currentExp.score();
      PHYLAB_showResult(result);
    });
  }

  /* Result modal buttons */
  var retryBtn = PHYLAB_$("phylabResultRetry");
  if (retryBtn) {
    retryBtn.addEventListener("click", function () {
      PHYLAB_hideResult();
      if (PHYLAB_currentExp) {
        PHYLAB_currentExp.reset();
        PHYLAB_currentExp.render();
      }
    });
  }
  var backBtn = PHYLAB_$("phylabResultBack");
  if (backBtn) {
    backBtn.addEventListener("click", function () {
      PHYLAB_hideResult();
      PHYLAB_showScreen("selector");
      PHYLAB_renderSelector();
    });
  }

  /* Close result on backdrop click */
  var backdrop = PHYLAB_$("phylabResultBackdrop");
  if (backdrop) {
    backdrop.addEventListener("click", function (e) {
      if (e.target === backdrop) { PHYLAB_hideResult(); }
    });
  }
}

/* ============================================================
   SYNC LANGUAGE WITH EXISTING APP
   ============================================================ */
function PHYLAB_syncLang() {
  /* Read existing lang setting */
  try {
    var saved = localStorage.getItem("phy_lang_v1") || localStorage.getItem("phy_lang_v2");
    if (saved === "en" || saved === "zh") {
      PHYLAB_LANG = saved;
    }
  } catch (e) {}
  /* Watch existing langBtn clicks */
  var langBtn = document.getElementById("langBtn");
  if (langBtn) {
    langBtn.addEventListener("click", function () {
      setTimeout(function () {
        try {
          var newLang = localStorage.getItem("phy_lang_v1") || localStorage.getItem("phy_lang_v2");
          if (newLang === "en" || newLang === "zh") {
            PHYLAB_LANG = newLang;
            PHYLAB_applyI18n();
          }
        } catch (e) {}
      }, 100);
    });
  }
}

/* ============================================================
   INIT
   ============================================================ */
function PHYLAB_init() {
  PHYLAB_spawnParticles();
  PHYLAB_applyI18n();
  PHYLAB_bindNavigation();
  PHYLAB_syncLang();
  PHYLAB_showScreen("launcher");
  console.log("[PhyGenius Lab] v2.1 ready | experiments:", Object.keys(PHYLAB_experiments).length);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", PHYLAB_init);
} else {
  PHYLAB_init();
}

})();
</script>
